function whImpact(m){const refs=whReferences(m),direct=whConsumers(m.id),affected=whAffected(m.id);openDialog('依赖与影响 · '+esc(m.name),`<div class="stack"><div class="flex between">${pill(m.layer,'blue')}<span class="mono">${esc(m.code)}</span></div><div><h3>上游与共享引用</h3>${refs.map(r=>`<div class="wh-ref"><button class="textbtn" data-wh="open-dialog-model" data-id="${r.id}">${r.layer} / ${esc(r.name)}</button><p>当前可见版本：${modelVersion(r)?'v'+modelVersion(r):'未发布 / 版本未知'}</p></div>`).join('')||'<p class="tiny muted" style="margin-top:8px">外部来源或生成规则，无其他模型上游。</p>'}</div><div><h3>直接下游</h3>${direct.map(r=>`<div class="wh-ref"><button class="textbtn" data-wh="open-dialog-model" data-id="${r.id}">${r.layer} / ${esc(r.name)}</button><p>引用只是设计声明，不表示加工已经发生。</p></div>`).join('')||'<p class="tiny muted" style="margin-top:8px">当前没有已声明的直接下游。</p>'}</div><div><h3>传递影响范围 · ${affected.length} 个模型</h3><div class="wh-impacttree">${affected.map(r=>`<div class="wh-ref">${r.layer} · ${esc(r.name)}</div>`).join('')}</div></div>${note('当前后端没有全覆盖的精确上游版本绑定证据。原型记录的是本次核对时的版本；不能据此补造历史依赖快照。')}</div>`,`<button class="btn" data-wh="simulate-version" data-id="${m.id}">模拟上游版本变化</button><button class="btn primary" data-wh="ack-references" data-id="${m.id}">核对当前引用</button>`,true)}
function whOpenUpstreams(m){const layer=m.layer==='DIM'||m.layer==='DWD'?'ODS':m.layer==='DWS'?'DWD':m.upstreamLayer,candidates=wh().models.filter(p=>p.layer===layer&&p.id!==m.id);openDialog('选择上游 '+layer+' 模型',`<div class="stack"><p class="fieldvalue">选择稳定模型 ID，逐字段确认来源。多个上游不自动推导连接。</p>${candidates.map(p=>`<label class="optioncard"><input type="checkbox" name="wh-upstream" value="${p.id}" ${m.upstream.includes(p.id)?'checked':''}><div><strong>${esc(p.name)}</strong><p>${p.code} · ${modelVersion(p)?'已发布 v'+modelVersion(p):'未发布设计'} · ${modelFields(p).length} 个字段</p></div></label>`).join('')||note('没有可用上游，请先在对应层设计模型。','warn')}${note('改变上游后，原分组或度量可能不再存在。草稿保留原字段并提示缺失，需用户重新核对。')}</div>`,`<button class="btn primary" data-wh="upstreams-apply">带入上游选择</button>`)}
function whPreview(m){const errors=whChecks(m).filter(c=>c.level==='error');if(errors.length){openDialog('预览需要先处理结构问题',errors.map(c=>note(esc(c.title)+'：'+esc(c.text),'error')).join(''));return}m.preview={structure:whStructure(m),currentReferences:whReferences(m).map(p=>({modelId:p.id,currentVersion:modelVersion(p)||null})),saved:false};openDialog(m.layer+' · 结果结构预览',`<div class="stack"><div>${pill('只读预览','blue')}<p class="fieldvalue" style="margin-top:10px">${['DWS','ADS'].includes(m.layer)?'结果粒度：'+whGrain(m):'字段结构按当前设计展开。'}</p></div><div class="tablewrap"><table class="gridtable"><thead><tr><th>字段</th><th>物理类型</th><th>聚合 / 角色</th></tr></thead><tbody>${m.preview.structure.fields.map(f=>`<tr><td class="mono">${esc(f.id)}</td><td class="mono">${f.physicalType}</td><td>${esc(modelFields(m).find(x=>x.id===f.id)?.func||modelFields(m).find(x=>x.id===f.id)?.role||'属性')}</td></tr>`).join('')}</tbody></table></div>${note('本原型预览没有调用后端。正式实现由 derive/preview 与结构校验返回最终字段，预览不创建模型、任务或发布版本。')}</div>`,`<button class="btn primary" data-wh="preview-open-physical">进入物理结构</button>`)}
function whSave(m,sources=false){if(m.id==='fact-order'){save();return}if(m.layer==='ODS'){whOdsConfirm(m);return}const errors=whChecks(m).filter(c=>c.level==='error');if(errors.length){wh().tab='delivery';render();toast('先处理结构错误，当前草稿保留');return}if(s.saveConflict){openDialog('模拟保存冲突',`<div class="stack">${note('编辑基线已变化。本地草稿完整保留，不能强制覆盖。','warn')}<pre class="statebox">${esc(JSON.stringify({modelId:m.id,localRevision:m.revision,serverRevision:m.revision+1,localStructure:whStructure(m)},null,2))}</pre></div>`,`<button class="btn primary" data-wh="merge-conflict">核对并合并新基线</button>`);return}if(sources){m.currentMappings=modelFields(m).map(f=>({targetColumn:f.id,source:f.source||null,sourceRef:m.sourceChoices?.[f.id]||null,fieldRole:f.role,aggregateFunc:f.func||null,stdFieldId:f.stdFieldId||null,proposedConversion:f.transformProposal||null}));m.sourceDirty=false;s.lastAction='模拟保存 '+m.layer+' 当前映射'}else{m.saved=whStructure(m);m.dirty=false;m.revision++;s.lastAction='模拟保存 '+m.layer+' 完整结构';}whRecordReferences(m);render();toast(sources?'已模拟保存当前映射；没有冻结历史映射':'已模拟保存完整结构，设计元数据提案留在会话中')}
function whPublish(m){if(!m.saved||m.dirty){wh().tab='physical';render();toast('请先保存物理结构草稿');return}const errors=whChecks(m).filter(c=>c.level==='error');if(errors.length){wh().tab='delivery';render();toast('请先核对结构错误');return}openDialog('发布 '+m.layer+' 设计版本',`<div class="stack"><div class="flex between"><strong>${esc(m.name)}</strong>${pill('新版本 v'+(m.version+1),'blue')}</div><p class="fieldvalue">发布当前已保存物理结构。后续草稿修改不会移动该快照。</p><pre class="statebox">${esc(JSON.stringify({modelId:m.id,modelCode:m.code,table:m.saved.tableName,columns:m.saved.fields.length,primaryKey:m.saved.primaryKey},null,2))}</pre>${note('正式系统仍按原权限与审批策略发布。这里仅模拟不可变结构快照；来源映射与聚合设计没有当前后端的历史冻结证据。')}${m.sourceDirty?note('当前映射草稿尚未保存，交接时会明确提示。','warn'):''}</div>`,`<button class="btn primary" data-wh="publish-confirm">模拟发布设计 v${m.version+1}</button>`)}
function whVersions(m){const versions=m.published||[],last=versions.at(-1);const current=whStructure(m),changed=last?JSON.stringify(current)!==JSON.stringify(last.structure):true;openDialog('版本与当前草稿 · '+esc(m.name),`<div class="stack"><div class="flex between">${pill(versions.length+' 个演示快照','green')}${pill(changed?'当前结构与发布版本有差异':'当前结构与发布版本一致',changed?'orange':'green')}</div>${last?`<div class="wh-versionbar">发布 v${last.no} 固定 ${last.structure.fields.length} 个字段；当前草稿 ${current.fields.length} 个字段。</div>`:note('没有已发布版本，可先保存并发布设计。')}<h3>当前结构与最近发布结构</h3><pre class="statebox">${esc(JSON.stringify({current,latestPublished:last||null,limitations:['Mapping history is not frozen','Current standard definitions are not historical standard evidence']},null,2))}</pre>${versions.map(v=>`<div class="wh-ref"><strong>精确结构版本 v${v.no}</strong><p>${v.structure.tableName} · ${v.structure.fields.length} 个字段 · 部署待核对 / 运行暂无证据</p></div>`).join('')}</div>`,`<button class="btn" data-wh="export">导出完整会话</button>`,true)}
function whDDL(m){if(!m.saved||m.dirty){wh().tab='physical';render();toast('先保存结构，再生成对应 DDL');return}const t=m.saved,q=id=>t.dialect==='MYSQL'?'`'+id+'`':'"'+id+'"';const lines=t.fields.map(f=>'  '+q(f.id)+' '+f.physicalType+(f.nullable?'':' NOT NULL'));if(t.primaryKey.length)lines.push('  PRIMARY KEY ('+t.primaryKey.map(q).join(', ')+')');let sql='-- HTML 原型示例，仅生成，不执行。\n-- 对应模拟已保存结构 / '+m.layer+' / '+t.modelCode+'\nCREATE TABLE '+q(t.tableName)+' (\n'+lines.join(',\n')+'\n);\n';for(const idx of t.indexes)sql+='CREATE '+(idx.unique?'UNIQUE ':'')+'INDEX '+q(idx.name)+' ON '+q(t.tableName)+' ('+idx.columns.map(q).join(', ')+');\n';if(t.partition)sql+='-- 分区设计：'+t.partition.type+' ('+t.partition.columns.join(', ')+')；本原型不生成完整分区边界，实际使用后端方言模板。\n';m.ddlPreview=sql;openDialog('已保存 '+m.layer+' 结构 · DDL 文本',`<div class="stack">${note('建模只生成脚本。建表通过已有部署渠道完成；这里没有执行 SQL。')}<pre class="codebox">${esc(sql)}</pre></div>`,`<button class="btn primary" data-wh="download-ddl">${icon('download')}下载 SQL</button>`,true)}
function whHandoff(m){const version=m.published?.at(-1);const todo={ODS:['配置源端接入任务、全量/增量与幂等策略','核对 CDC / 分区 / 接入落表与来源漂移'],DIM:['实现代理键生成、未知成员与迟到维度策略',m.scd==='SCD2'?'实现 SCD2 属性变化检测、有效区间和历史查找':'实现当前属性更新或日历生成'],DWD:['确认事实业务粒度、唯一性和订单金额对账','实现维度键查找、过滤、清洗、增量与重算'],DWS:['确认分组粒度、统计周期、时区与截点','实现聚合加工、重算窗口与上游连接','核对可加性、去重计数、比率与平均值'],ADS:['确认应用结果字段、查询粒度和消费入口','实现上游连接与必要计算，验证重聚合口径','通过原 Dataset / Data Service 形成受治理消费']}[m.layer];openDialog(m.layer+' · 开发交接单',`<div class="stack"><div class="flex between"><strong>${esc(m.name)}</strong>${pill(version?'精确结构 v'+version.no:'结构版本尚未发布',version?'blue':'orange')}</div><div class="wh-ref"><strong class="tiny">设计引用</strong><p>${esc(m.code)} · ${esc(m.target)} / ${esc(m.tableName||m.code)}<br>${['DWS','ADS'].includes(m.layer)?'当前粒度：'+whGrain(m):m.layer==='DIM'?'当前历史策略：'+m.scd:'当前说明：'+esc(m.grain||'订单商品明细')}</p></div><div><h3>当前依赖上下文</h3>${whReferences(m).map(r=>`<div class="wh-ref">${r.layer} · ${esc(r.name)}<p>${modelVersion(r)?'当前可见 v'+modelVersion(r):'版本未知 / 未发布'}，不补造历史绑定。</p></div>`).join('')||'<p class="tiny muted" style="margin-top:8px">外部来源 / 日历生成，无模型上游。</p>'}</div><div><h3>由原有模块继续完成</h3>${todo.map(t=>`<div class="wh-check"><span class="dot" style="color:#a8b8cf"></span><p>${t}</p></div>`).join('')}</div>${m.sourceDirty?note('当前来源 / 分层映射尚有未保存修改。','warn'):''}${note(m.layer==='DWS'||m.layer==='ADS'?'DWS/ADS 的本窗口是模拟会话交接投影；当前 DWD/DIM readiness 不能证明本层已通过正式交接检查。':'交接检查不代表任务创建授权。目标页需重读项目、权限和精确版本。')}<div class="flex between">${pill('部署：待核对','orange')}${pill('运行：暂无证据','orange')}</div></div>`,`<button class="btn primary" data-wh="export">导出设计与待办</button>`,true)}
function whImport(){openDialog('ODS · 从源表导入模型',`<div class="stack"><div class="wh-grainform"><div class="formfield"><label>来源数据源 / 库</label><input readonly value="Retail ERP / sales / MYSQL"></div><div class="formfield"><label>目标分层 / 库</label><input readonly value="ODS / retail_ods"></div></div><p class="wh-tabnote">先确认当前目录，再按表独立导入结构和来源映射。导入不会创建接入任务。</p>${sourceCatalog.map(t=>`<label class="optioncard wh-sourcetable"><input type="checkbox" data-wh-input="import-table" value="${t.table}" ${wh().importSelection.includes(t.table)?'checked':''}><div><strong>${t.name} <span class="mono muted">${t.table}</span></strong><p>${t.fields.length} 个来源字段 · ${wh().models.some(m=>m.layer==='ODS'&&m.sourceTable===t.table)?'已有对应 ODS，本次会返回跳过':'尚未导入'}</p></div></label>`).join('')}<div class="wh-import-preview"><strong class="tiny">当前选择的结构预览</strong>${wh().importSelection.map(t=>{const src=sourceCatalog.find(x=>x.table===t);return `<p class="tiny mono" style="margin-top:9px">${t}<br>${src.fields.map(f=>`${f[0]} ${f[2]}`).join(' · ')}</p>`}).join('')||'<p class="tiny muted">请选择来源表</p>'}</div><label class="wh-rowlabel"><input type="checkbox" data-wh-input="import-fail" ${wh().importFail?'checked':''}>模拟一个新表导入失败，查看部分成功回执</label>${note('正式导入由服务端重读来源结构和模型编辑基线；来源变化需重新确认。每张表单独报告 created / skipped / failed。')}</div>`,`<button class="btn primary" data-wh="import-confirm">确认并模拟导入</button>`,true)}
function whImportConfirm(){const selection=wh().importSelection;if(!selection.length){toast('先选择来源表');return}const receipts=[];let failed=false;for(const table of selection){const existing=wh().models.find(m=>m.layer==='ODS'&&m.sourceTable===table);if(existing){receipts.push({table,status:'SKIPPED',reason:'已有来源对应 ODS，未覆盖其结构',modelId:existing.id});continue}if(wh().importFail&&!failed){receipts.push({table,status:'FAILED',reason:'模拟来源证据在确认时变化；请重新预览',modelId:null});failed=true;continue}const model=odsSeed(table,'ods-'+table);model.version=0;model.saved=whStructure(model);model.dirty=false;model.sourceDirty=false;model.currentMappings=modelFields(model).map(f=>({targetColumn:f.id,source:f.source}));wh().models.push(model);receipts.push({table,status:'CREATED',modelId:model.id,reason:'模拟保存结构、来源与确认映射，设计未发布'});}wh().receipt=receipts;wh().importFail=false;s.lastAction='ODS 逐表导入回执';whImportReceipt()}
function whImportReceipt(){openDialog('ODS · 逐表导入回执',`<div class="stack"><div class="flex">${pill('已创建 '+wh().receipt.filter(r=>r.status==='CREATED').length,'green')}${pill('跳过 '+wh().receipt.filter(r=>r.status==='SKIPPED').length)}${pill('失败 '+wh().receipt.filter(r=>r.status==='FAILED').length,'orange')}</div>${wh().receipt.map(r=>`<div class="wh-ref"><div class="flex between"><strong class="mono">${r.table}</strong>${pill(r.status,r.status==='CREATED'?'green':r.status==='FAILED'?'orange':'')}</div><p>${r.reason}</p>${r.modelId?`<button class="textbtn" data-wh="open-dialog-model" data-id="${r.modelId}">打开 ODS 模型</button>`:''}</div>`).join('')}${note('成功项不会因为另一张表失败而撤销。失败项需要重读来源再重试，不能盲目重复创建。')}</div>`,`<button class="btn" data-wh="import">重新选择 / 重试</button><button class="btn primary" data-wh="overview-dialog">返回全景</button>`);render()}
function whSourceEvidence(m){const diff=whOdsDiff(m);openDialog('ODS · 当前来源证据核对',`<div class="stack"><div class="flex between">${pill(m.provider,'blue')}${pill('历史来源：未冻结','orange')}</div><p class="fieldvalue">模型 ${esc(m.code)} · 当前设计版本 ${modelVersion(m)?'v'+modelVersion(m):'未发布'}<br>来源 Retail ERP / sales.${esc(m.sourceTable)}</p>${m.provider==='READY'?`<p class="tiny muted">读取时刻：演示本次读取。比较当前目录和模型结构；不证明发布当时源库是什么。</p>${diff.map(d=>note(`${d.kind}：${esc(d.id)} ${esc(d.saved||'')} → ${esc(d.current||'缺失')}`,'warn')).join('')||note('当前演示目录与模型字段一致。','')}<pre class="statebox">${esc(JSON.stringify(whSourceColumns(m),null,2))}</pre>`:note(m.provider==='FORBIDDEN'?'无权读取当前来源，结果不可核对。':'来源 provider 暂时不可用，结果不可核对。','warn')}${note('发现变化只展示差异与待办，不自动同步模型或改写发布快照。')}</div>`,`<button class="btn" data-wh="source-drift">${m.sourceDrift?'恢复来源场景':'模拟来源结构变化'}</button><button class="btn primary" data-wh="ods-confirm">人工确认结构与映射</button>`,true)}
function whOdsConfirm(m){if(m.provider!=='READY'){toast('来源当前无法读取，请先恢复目录状态');return}const src=whSourceColumns(m);openDialog('ODS · 人工确认来源与目标字段',`<div class="stack"><p class="fieldvalue">逐列决定本次导入的结构。新增来源字段默认不选；由你确认后才带入草稿。</p>${src.map(([id,name,type])=>`<label class="optioncard"><input type="checkbox" name="wh-ods-column" value="${id}" ${m.fields.some(f=>f.id===id)?'checked':''}><div><strong>${name} <span class="mono">${id}</span></strong><p>${type} → ${whType(type,m.dialect)} · ${m.fields.some(f=>f.id===id)?'已有目标字段，本次按确认的来源结构核对':'新增来源字段'}</p></div></label>`).join('')}${note('本原型使用明确的字段选择演示 ODS 专用原子命令。正式提交 expectedDefinition / expectedSourceColumns / structure / selections，由源域重读后裁决。')}</div>`,`<button class="btn primary" data-wh="ods-confirm-apply">确认并模拟保存来源导入</button>`,true)}
function whNew(layer=''){openDialog('新建模型 · 选择本层任务',`<div class="stack"><div class="formfield"><label>目标分层</label><select id="wh-new-layer" data-wh-input="new-layer">${warehouseLayers.map(l=>`<option value="${l}" ${l===(layer||'DWD')?'selected':''}>${l} · ${layerNames[l]}</option>`).join('')}</select></div><p class="wh-tabnote">ODS 选择源表导入；其他层从业务过程或公共维度定义开始，每张落地表一个独立模型。</p><div class="formfield"><label>模型名称</label><input id="wh-new-name" value="${{ODS:'',DWD:'订单事实设计',DIM:'客户属性维度',DWS:'销售汇总设计',ADS:'经营应用设计'}[layer||'DWD']}"></div><div class="formfield"><label>稳定模型编码（创建后固定）</label><input id="wh-new-code" value="${(layer||'DWD').toLowerCase()}_new_${wh().models.length+1}"></div><div class="formfield"><label>业务范围</label><input readonly value="订单交易；DIM 默认归入公共维度"></div>${note('分层和过程引用现有 Semantic 配置。本原型只在内存新增模型；正式派生仍限制“同过程同层一个模型”；成熟多事实/多汇总设计需评审最小合同调整，不能用前端绕过。')}</div>`,`<button class="btn primary" data-wh="new-apply">继续设计</button>`)}
function whNewApply(){const layer=document.getElementById('wh-new-layer').value;if(layer==='ODS'){whImport();return}const name=document.getElementById('wh-new-name').value.trim(),code=document.getElementById('wh-new-code').value.trim();if(!name||!/^[a-z][a-z0-9_]*$/i.test(code)){toast('请填写名称和合法的稳定模型编码');return}if(wh().models.some(m=>m.code.toLowerCase()===code.toLowerCase())){toast('当前项目已存在该模型编码');return}const id='new-'+Date.now(),m={id,layer,code,name,process:layer==='DIM'?'shared':'order',fields:[],upstream:[],version:0,dirty:true,sourceDirty:true,target:'retail_'+layer.toLowerCase(),dialect:'MYSQL',revision:1,published:[]};if(layer==='DIM'){m.fields=[whField('customer_key','客户代理键','LONG'),...whModel('ods-customers').fields.map(f=>({...clone(f),source:'ods_customers.'+f.id}))];m.businessKey='customer_id';m.surrogateKey='customer_key';m.scd='SCD1';m.tracked=[];m.upstream=['ods-customers'];}else if(layer==='DWD'){m.fields=whModel('ods-order_items').fields.map(f=>({...clone(f),role:['quantity','line_paid_amount','discount_amount'].includes(f.id)?'度量':'属性',source:'ods_order_items.'+f.id}));m.keys=['order_id','line_id'];m.grain='一个订单中的一条商品明细';m.factMode='事务事实';m.upstream=['ods-order_items'];m.dimRefs=[];}else if(layer==='DWS'){Object.assign(m,{period:'1d',dimensions:['order_date_key','product_key'],upstream:['fact-order'],upstreamLayer:'DWD',measures:[{id:'paid_amount',name:'实付金额',output:'paid_amount_sum',func:'SUM',included:true}]})}else{Object.assign(m,{period:'1d',dimensions:['order_date_key','product_key','channel_key'],upstream:['dws-product-day'],upstreamLayer:'DWS',appCode:code,appName:name,appGoal:'定义本应用需要的分析结果',measures:[{id:'paid_amount_sum',name:'实付金额',output:'paid_amount',func:'SUM',included:true}]})}wh().models.push(m);closeDialog();whOpen(id);toast('已创建独立的内存设计草稿')}
function whAddField(m){openDialog(m.layer==='DIM'?'添加维度属性':'添加事实字段',`<div class="stack"><div class="formfield"><label>字段名称</label><input id="wh-field-id" placeholder="例如 region_code"></div><div class="formfield"><label>业务名称</label><input id="wh-field-name" placeholder="例如 区域编码"></div><div class="formfield"><label>逻辑类型</label><select id="wh-field-type">${['STRING','INTEGER','LONG','DECIMAL','DATE','TIMESTAMP'].map(t=>`<option>${t}</option>`).join('')}</select></div></div>`,`<button class="btn primary" data-wh="add-field-apply">带入字段草稿</button>`)}
function whAddMeasure(m){const fields=whCandidateFields(m);openDialog('从上游选择度量',`<div class="stack"><div class="formfield"><label>来源字段</label><select id="wh-measure-id">${fields.map(f=>`<option value="${f.id}">${esc(f.name)} · ${esc(f.parentCode)}.${esc(f.id)}</option>`).join('')}</select></div><div class="formfield"><label>聚合函数</label><select id="wh-measure-func">${['SUM','COUNT','COUNT_DISTINCT','MAX','MIN','AVG'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="formfield"><label>结果字段名称</label><input id="wh-measure-output" placeholder="例如 customer_count"></div>${note('已有分组字段改作度量时，会从分组中移除；这是粒度变化，需要重新预览。')}</div>`,`<button class="btn primary" data-wh="add-measure-apply">带入度量草稿</button>`)}
function whStandard(m,id){const field=modelFields(m).find(f=>f.id===id);openDialog('核对标准 · '+esc(field.name),`<div class="stack"><span class="mono">${esc(field.id)}</span><p class="fieldvalue">标准归 Semantic，模型仅保存稳定标准字段 ID。</p>${[['1006','实付金额 / CNY','明细实付金额，金额类型 DECIMAL，单位人民币'],['1005','商品数量','业务数量，可加性需结合粒度确认'],['1003','客户编号','统一客户业务标识'],['1004','商品编号','统一 SKU 业务标识'],['1009','自然日期','自然日历日期'],['','暂不绑定','保留治理提醒，不新增发布硬门禁']].map(([v,n,d])=>`<label class="optioncard"><input name="wh-standard" type="radio" value="${v}" ${String(field.stdFieldId||'')===v?'checked':''}><div><strong>${n}</strong><p>${d} · 演示候选</p></div></label>`).join('')}${note('名称相似不证明含义一致，需核对单位与口径。候选只进入草稿，保存结构后生效。')}</div>`,`<button class="btn primary" data-wh="standard-apply" data-id="${id}">带入标准引用</button>`,true)}
function whFieldSource(m,id){const field=modelFields(m).find(f=>f.id===id),parents=m.upstream.map(whModel).filter(Boolean);openDialog('确认字段来源 · '+esc(field.name),`<div class="stack"><p class="fieldvalue">选择上游模型和来源列。多模型的同名列用稳定模型 ID 区分。</p><div class="formfield"><label>模型 / 来源字段</label><select id="wh-field-source">${parents.map(p=>`<optgroup label="${esc(p.name)} / ${p.layer}">${modelFields(p).filter(f=>!f.technical).map(f=>`<option value="${p.id}|${f.id}" ${m.sourceChoices?.[id]?.modelId===p.id&&m.sourceChoices?.[id]?.column===f.id?'selected':''}>${p.code}.${f.id} · ${esc(f.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>${note('这是当前字段映射设计；选择来源不代表 JOIN 已验证。DIM/DWD 的实际数据源定位由目标库配置解析，DWS/ADS 使用已有分层映射。')}</div>`,`<button class="btn primary" data-wh="field-source-apply" data-id="${id}">带入来源草稿</button>`)}
function whOptions(m){const fields=modelFields(m);openDialog('物理结构 · 键、索引与分区',`<div class="stack"><div><span class="fieldlabel">当前主键</span><div class="wh-tags" style="margin-top:7px">${whStructure(m).primaryKey.map(k=>pill(k,'blue')).join('')||'<span class="muted tiny">当前无主键</span>'}</div></div><div class="formfield"><label>演示查询索引（可选，保留当前已有结构）</label><select id="wh-index-field"><option value="">不新增索引</option>${fields.map(f=>`<option>${esc(f.id)}</option>`).join('')}</select></div><div class="formfield"><label>分区设计（需按方言复核）</label><select id="wh-partition-type"><option value="">不设分区</option>${['HASH','RANGE'].map(v=>`<option ${m.partition?.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="formfield"><label>分区字段</label><select id="wh-partition-field">${fields.map(f=>`<option ${m.partition?.columns?.includes(f.id)?'selected':''}>${esc(f.id)}</option>`).join('')}</select></div>${note('这里只演示基本结构选项。正式界面由后端方言目录控制支持范围，RANGE 边界与表属性需使用既有完整合同。')}</div>`,`<button class="btn primary" data-wh="structure-options-apply">带入结构草稿</button>`)}
function whExport(){download('full-warehouse-modeling-prototype.json',JSON.stringify({artifact:'DRAFT_THROWAWAY_FULL_WAREHOUSE_PROTOTYPE',dataIsSimulated:true,productionE2E:'PENDING',date:'2026-10-14',design:s,limitations:['No business APIs or browser persistence','Version snapshots contain physical structure, not frozen mappings','Typed dimensional metadata is a proposal','Cross-model version refs are current review context only','Deployment and runtime evidence not available']},null,2),'application/json;charset=utf-8')}
document.addEventListener('click',e=>{const button=e.target.closest('[data-wh]');if(!button||button.disabled)return;const act=button.dataset.wh,id=button.dataset.id,m=whModel();switch(act){
 case 'overview':case 'catalog':case 'shared':whOverviewState(act);break;
 case 'overview-dialog':closeDialog();whOverviewState();break;
 case 'open':whOpen(id);break;
 case 'open-dialog-model':closeDialog();whOpen(id);break;
 case 'tab':wh().tab=button.dataset.tab;s.lastAction='查看 '+m.layer+' / '+wh().tab;render();break;
 case 'clear-filter':wh().layerFilter='ALL';wh().processFilter='all';wh().query='';render();break;
 case 'view-layer':wh().layerFilter=button.dataset.layer;wh().processFilter='order';whOverviewState('catalog');break;
 case 'coverage-filter':wh().layerFilter=button.dataset.layer;wh().processFilter=button.dataset.process;whOverviewState('catalog');break;
 case 'guide':wh().guide=Number(button.dataset.index);render();break;
 case 'guide-prev':wh().guide=Math.max(0,wh().guide-1);render();break;
 case 'guide-next':wh().guide=Math.min(4,wh().guide+1);render();break;
 case 'journey-help':whHelp();break;
 case 'contract':whContract();break;
 case 'dependency-overview':whDependencyOverview();break;
 case 'impact':whImpact(whModel(id)||m);break;
 case 'ack-references':whRecordReferences(whModel(id)||m);closeDialog();render();toast('已核对当前引用版本，历史绑定仍未知');break;
 case 'simulate-version':{const target=whModel(id)||m;wh().models.forEach(x=>{if(whAffected(target.id).some(a=>a.id===x.id)&&!x.referenceReads)whRecordReferences(x)});if(target.id==='fact-order'){target.mockProviderVersion=modelVersion(target)+1;}else{target.version++;target.published=target.published||[];target.published.push({no:target.version,structure:clone(target.saved||whStructure(target)),simulated:true});}closeDialog();s.lastAction='模拟 '+target.name+' 新版本；下游草稿保持';render();toast('已模拟上游新版本，下游检查显示待复核');break;}
 case 'upstreams':whOpenUpstreams(m);break;
 case 'upstreams-apply':m.upstream=[...document.querySelectorAll('input[name="wh-upstream"]:checked')].map(el=>el.value);whMark(m);m.sourceDirty=true;closeDialog();render();break;
 case 'preview':whPreview(m);break;
 case 'preview-open-physical':closeDialog();wh().tab='physical';render();break;
 case 'save':whSave(m,wh().tab==='sources');break;
 case 'save-sources':whSave(m,true);break;
 case 'merge-conflict':s.saveConflict=false;m.revision++;closeDialog();render();toast('模拟合并新基线，当前草稿仍待保存');break;
 case 'publish':whPublish(m);break;
 case 'publish-confirm':m.version++;m.published=m.published||[];m.published.push({no:m.version,structure:clone(m.saved),simulated:true,deployment:'UNKNOWN',runtime:'NO_EVIDENCE'});closeDialog();wh().tab='delivery';s.lastAction='模拟发布 '+m.layer+' v'+m.version;render();toast('设计版本已模拟发布，部署与运行待核对');break;
 case 'versions':whVersions(m);break;
 case 'ddl':whDDL(m);break;
 case 'download-ddl':download((m.tableName||m.code)+'-prototype.sql',m.ddlPreview||'','text/plain;charset=utf-8');break;
 case 'handoff':whHandoff(m);break;
 case 'check':s.lastAction='运行 '+m.layer+' 演示检查';render();toast('设计检查完成；没有执行数据验证');break;
 case 'export':whExport();break;
 case 'import':whImport();break;
 case 'import-confirm':whImportConfirm();break;
 case 'source-evidence':whSourceEvidence(m);break;
 case 'source-drift':m.sourceDrift=!m.sourceDrift;whSourceEvidence(m);render();break;
 case 'ods-confirm':whOdsConfirm(m);break;
 case 'ods-confirm-apply':{const selected=[...document.querySelectorAll('input[name="wh-ods-column"]:checked')].map(el=>el.value);if(!selected.length){toast('至少确认一个字段');break}if(s.saveConflict){toast('模拟保存冲突，草稿保留；在状态窗口关闭冲突后重新核对');break}m.fields=whSourceColumns(m).filter(f=>selected.includes(f[0])).map(f=>whField(...f,m.sourceTable+'.'+f[0]));m.keys=(m.keys||[]).filter(k=>selected.includes(k));m.saved=whStructure(m);m.currentMappings=m.fields.map(f=>({targetColumn:f.id,source:f.source}));m.dirty=false;m.sourceDirty=false;m.revision++;closeDialog();s.lastAction='ODS 结构 / 来源 / 映射确认回执';render();toast('已模拟保存来源导入，发布快照没有改变');break;}
 case 'new':whNew(button.dataset.layer);break;
 case 'new-apply':whNewApply();break;
 case 'add-field':whAddField(m);break;
 case 'add-field-apply':{const fid=document.getElementById('wh-field-id').value.trim(),name=document.getElementById('wh-field-name').value.trim();if(!name||!/^[a-z][a-z0-9_]*$/i.test(fid)||m.fields.some(f=>f.id.toLowerCase()===fid.toLowerCase())){toast('请填写名称和不重复的合法字段名');break}m.fields.push(whField(fid,name,document.getElementById('wh-field-type').value));whMark(m);m.sourceDirty=true;closeDialog();render();break;}
 case 'add-measure':whAddMeasure(m);break;
 case 'add-measure-apply':{const fid=document.getElementById('wh-measure-id').value,field=whCandidateFields(m).find(f=>f.id===fid),output=document.getElementById('wh-measure-output').value.trim();if(!field||!/^[a-z][a-z0-9_]*$/i.test(output)){toast('请选择来源和合法结果字段名');break}if(m.measures.some(f=>f.output.toLowerCase()===output.toLowerCase())){toast('结果字段名称已存在');break}m.dimensions=m.dimensions.filter(id=>id!==fid);m.measures.push({id:fid,name:field.name,output,func:document.getElementById('wh-measure-func').value,included:true});whMark(m);m.sourceDirty=true;closeDialog();render();break;}
 case 'field-source':whFieldSource(m,id);break;
 case 'field-source-apply':{const selection=document.getElementById('wh-field-source').value;if(!selection){toast('请先选择来源');break}const [modelId,column]=selection.split('|');m.sourceChoices=m.sourceChoices||{};m.sourceChoices[id]={modelId,column};if(['DWS','ADS'].includes(m.layer)){const measure=m.measures.find(f=>f.output===id);if(measure)measure.id=column;}else{const field=m.fields.find(f=>f.id===id);if(field)field.source=whModel(modelId).code+'.'+column;}whMark(m,'sources');if(['DWS','ADS'].includes(m.layer))m.dirty=true;closeDialog();render();toast('已带入明确来源，核对标准和粒度后保存');break;}
 case 'standard':whStandard(m,id);break;
 case 'standard-apply':{const selected=document.querySelector('input[name="wh-standard"]:checked');if(!selected){toast('请先选择标准');break}m.standardRefs=m.standardRefs||{};m.standardRefs[id]=selected.value?Number(selected.value):null;whMark(m);closeDialog();render();toast('标准引用进入结构草稿，尚未保存');break;}
 case 'structure-options':whOptions(m);break;
 case 'structure-options-apply':{const field=document.getElementById('wh-index-field').value,pType=document.getElementById('wh-partition-type').value,pField=document.getElementById('wh-partition-field').value;if(field){m.indexes=m.indexes||[];const name='idx_'+field;if(!m.indexes.some(i=>i.name===name))m.indexes.push({name,columns:[field],unique:false})}m.partition=pType?{type:pType,columns:[pField]}:null;whMark(m);closeDialog();render();break;}
}});
document.addEventListener('change',e=>{const el=e.target,key=el.dataset.whInput;if(!key)return;const m=whModel();if(['layerFilter','processFilter'].includes(key)){wh()[key]=el.value;render();return}if(key==='import-table'){wh().importSelection=el.checked?[...new Set([...wh().importSelection,el.value])]:wh().importSelection.filter(t=>t!==el.value);whImport();return}if(key==='import-fail'){wh().importFail=el.checked;return}if(key==='new-layer'){const l=el.value;document.getElementById('wh-new-code').value=l.toLowerCase()+'_new_'+(wh().models.length+1);document.getElementById('wh-new-name').value={ODS:'',DIM:'客户属性维度',DWD:'订单事实设计',DWS:'销售汇总设计',ADS:'经营应用设计'}[l];return}if(key==='provider'){m.provider=el.value;s.lastAction='来源目录 '+el.value;render();return}if(key==='track'){m.tracked=el.checked?[...new Set([...m.tracked,el.dataset.id])]:m.tracked.filter(x=>x!==el.dataset.id);whMark(m);render();return}if(key==='dimension'){m.dimensions=el.checked?[...new Set([...m.dimensions,el.dataset.id])]:m.dimensions.filter(x=>x!==el.dataset.id);whMark(m);m.sourceDirty=true;render();return}if(key.startsWith('measure-')){const f=m.measures[Number(el.dataset.index)];if(key==='measure-included')f.included=el.checked;if(key==='measure-func')f.func=el.value;if(key==='measure-output')f.output=el.value.trim();whMark(m);m.sourceDirty=true;render();return}if(key==='upstreamLayer'){if(el.value===m.upstreamLayer)return;const next=el.value;openDialog('切换 ADS 上游数据层',`<div class="stack"><p class="fieldvalue">从 ${m.upstreamLayer} 改为 ${next}，将重选上游模型并重建字段候选。当前应用名称与目标保留。</p>${note('当前分组与度量可能失效。确认后按新层候选建立草稿，重新核对结果粒度。','warn')}</div>`,`<button class="btn primary" data-wh="ads-switch-apply" data-layer="${next}">确认切换并重建字段</button>`);render();return}if(key==='attribute-name'||key==='attribute-type'){m.fields.find(f=>f.id===el.dataset.id)[key==='attribute-name'?'name':'type']=el.value;whMark(m);render();return}if(key==='fact-role'){m.fields.find(f=>f.id===el.dataset.id).role=el.value;whMark(m);render();return}if(key==='fact-key'){m.keys=el.checked?[...new Set([...(m.keys||[]),el.dataset.id])]:(m.keys||[]).filter(k=>k!==el.dataset.id);whMark(m);render();return}if(['businessKey','surrogateKey','scd','period','dateBucket','appCode','appName','appGoal','tableName','dialect','grain','factMode'].includes(key)){m[key]=el.value;whMark(m);if(['scd','period'].includes(key))m.sourceDirty=true;render()}});
document.addEventListener('click',e=>{const button=e.target.closest('[data-wh="ads-switch-apply"]');if(!button)return;const m=whModel(),layer=button.dataset.layer,parent=wh().models.find(p=>p.layer===layer&&p.process==='order');m.upstreamLayer=layer;m.upstream=parent?[parent.id]:[];m.dimensions=['order_date_key','product_key','channel_key'].filter(id=>parent&&modelFields(parent).some(f=>f.id===id));m.measures=parent?(layer==='DWD'?[{id:'paid_amount',name:'实付金额',output:'paid_amount',func:'SUM',included:true},{id:'order_id',name:'订单编号',output:'order_count',func:'COUNT_DISTINCT',included:true}]:[{id:'paid_amount_sum',name:'实付金额',output:'paid_amount',func:'SUM',included:true}]):[];m.standardRefs={};whMark(m);m.sourceDirty=true;closeDialog();render();toast('已按新上游重建字段草稿，请核对粒度与聚合')});
document.addEventListener('input',e=>{if(e.target.dataset.whInput==='query'){wh().query=e.target.value;const start=e.target.selectionStart;render();const input=document.querySelector('[data-wh-input="query"]');input?.focus();input?.setSelectionRange(start,start)}});
const unboundModelFields=modelFields;modelFields=function(m){const fields=unboundModelFields(m).map(f=>({...f,source:m.sourceChoices?.[f.id]?whModel(m.sourceChoices[f.id].modelId)?.code+'.'+m.sourceChoices[f.id].column:f.source,stdFieldId:m.standardRefs&&Object.prototype.hasOwnProperty.call(m.standardRefs,f.id)?m.standardRefs[f.id]:f.stdFieldId}));if(['DWS','ADS'].includes(m.layer)&&m.dateBucket!=='DAY'){const date=fields.find(f=>f.id==='order_date_key');if(date){date.name='统计周期日期键';date.transformProposal=m.period+' 周期起始日期键转换（开发待办）';}}for(const [id,name] of [['process_time','数据处理时间'],['event_time','业务事件时间']])if(!fields.some(f=>f.id===id))fields.push({...whField(id,name,'TIMESTAMP'),role:'技术列',technical:true,nullable:true});return fields;};
openHelp=whHelp;openScope=whContract;
initial.view='overview';initial.warehouse=clone(warehouseSeed);s.view='overview';s.warehouse=clone(warehouseSeed);whRecordReferences(whModel('fact-order'));initial.warehouse=clone(s.warehouse);render();
