function getChecks(){const checks=[];const risky=s.fields.find(f=>f.risk);if(risky)checks.push({level:'error',title:'订单总额与明细粒度不一致',text:'同一订单金额会在多条商品明细中重复。移除此字段，或在数据开发中明确分摊口径。',act:'locate-risk',area:'logical'});if(!s.grain.trim())checks.push({level:'error',title:'业务粒度尚未声明',text:'请明确一行数据代表什么。',act:'grain',area:'logical'});if(s.relation==='MANY_TO_MANY')checks.push({level:'error',title:'客户与事实存在多对多关系',text:'需要明确桥接或分摊设计，直接连接可能扩行。此项为设计提案检查。',act:'relation',area:'logical'});checks.push({level:'pass',title:'业务标识已声明',text:`${s.keys.join(' + ')} · 唯一性尚需真实数据验证。`,act:'grain',area:'logical'});const missing=s.fields.filter(f=>!f.source);checks.push({level:missing.length?'warn':'pass',title:missing.length?`${missing.length} 个字段尚未指定来源`:'直接来源已指定',text:missing.length?missing.map(f=>f.name).join('、'):'来源对应是设计信息，尚未运行数据加工。',act:'map-first',area:'sources'});const unstd=s.fields.filter(f=>!f.standard);checks.push({level:unstd.length?'warn':'pass',title:unstd.length?`${unstd.length} 个业务字段待引用标准`:'业务字段标准已选择',text:unstd.length?`${unstd.map(f=>f.name).join('、')} · 标准覆盖提醒不作为新增发布门禁。`:'演示引用已齐备；生产保存需要核验实际 ID、状态和版本。',act:'standard-first',area:'sources'});if(s.sourceState!=='READY')checks.push({level:'warn',title:s.sourceState==='FORBIDDEN'?'来源目录无权读取':'来源目录暂时不可用',text:'保留当前设计，来源存在性和类型无法重新核对。',act:'source-status',area:'sources'});if(s.scd!=='SCD2')checks.push({level:'warn',title:'客户历史策略与复用版本不同',text:'已有客户维度 v2 为 SCD2。当前拟采用 SCD1，需要到维度所属模型复核；不能改变只读引用。',act:'dimension-detail',area:'logical'});checks.push({level:'warn',title:'维度键与历史查找交给数据开发',text:s.scd==='SCD2'?'客户键按订单事件时间查找有效版本；需实现代理键、有效区间及未知成员策略。':'需实现代理键查找和未知成员策略。',act:'handoff',area:'review'});checks.push({level:s.physical?'pass':'warn',title:s.physical?'物理草稿已准备':'尚未准备物理模型',text:s.physical?`${physicalTables().length} 个落地对象（1 新建，其余复用） · ${s.dialect} · ${s.tableName}`:'逐实体形成物理设计；真实一键多表生成需要补充契约。',act:'physical',area:'physical'});return checks}
function save(){const area=draftArea();if(s.saveConflict){openConflict();return}if(area==='physical'&&!s.physical){toast('请先准备物理草稿');return}s.dirty[area]=false;if(area==='logical')s.revision++;if(area==='physical')s.savedPhysical={dialect:s.dialect,tables:clone(physicalTables())};s.lastAction=`${area} 草稿模拟保存完成`;render();toast(area==='logical'?`逻辑草稿模拟保存 · revision ${s.revision}`:area==='sources'?'映射与标准草稿模拟保存；生产接口需逐项回执':'物理结构模拟保存完成')}
function header(){const area=draftArea();return `<div class="pagehead"><div class="breadcrumb"><button data-act="home">模型工作台</button><span>›</span><span>交易域</span><span>›</span><span>订单交易</span></div><div class="flex between"><div><div class="headtitle"><h1>订单交易分析</h1>${pill(s.tab==='logical'?'逻辑设计':s.tab==='sources'?'来源与标准':'物理设计','blue')}${s.published?pill(`物理设计 v${s.published.no}`,'green'):pill('草稿')}</div><div class="subtitle">按商品明细分析交易金额，复用统一的客户、商品与日期维度。</div></div><div class="head-actions"><span class="savehint">${area==='physical'&&!s.physical?'物理草稿尚未准备':s.dirty[area]?'<span class="dot" style="color:#d7a24e"></span> 有未保存变更':'✓ 此区草稿已模拟保存'}</span><button class="btn" data-act="save">${icon('save')}保存${area==='logical'?'逻辑':area==='sources'?'映射':'物理'}草稿</button><button class="btn primary" data-act="review">${icon('check')}检查与交付</button></div></div></div>`}
function tabs(){return `<div class="tabs">${[['logical','逻辑设计','cube'],['sources','来源与标准','link'],['physical','物理设计','layers'],['review','检查与交付','shield']].map(([id,name,ico])=>`<button class="tab ${s.tab===id?'active':''}" data-act="tab" data-tab="${id}">${icon(ico)}${name}${id==='sources'?`<span class="tabcount">${s.fields.filter(f=>!f.source||!f.standard).length}</span>`:''}</button>`).join('')}<div class="spacer"></div><button class="textbtn" data-act="state">查看演示状态</button></div>`}
function objectStrip(){return `<div class="object-strip"><button class="${s.selected==='sales'?'active':''}" data-act="select" data-id="sales">◇ 订单明细事实</button>${s.dims.map(id=>`<button data-act="select" data-id="${id}" class="${s.selected===id?'active':''}">◫ ${library.find(d=>d.id===id).name}</button>`).join('')}<button data-act="dims">＋ 引用维度</button></div>`}
function logical(){return `<div class="workspace"><div>${objectStrip()}<div class="card"><div class="grainbar"><div class="grainicon">${icon('grid')}</div><div class="spacer"><strong>一行代表：${esc(s.grain)||'尚未声明'}</strong><div class="muted">${esc(s.mode)}<span style="margin:0 8px">·</span>业务标识：<span class="mono">${s.keys.join(' + ')}</span></div></div><button class="textbtn" data-act="grain">编辑粒度</button></div><div class="toolbar"><div class="seg"><button data-act="graph" data-mode="canvas" class="${s.graphMode==='canvas'?'active':''}">${icon('cube')} 关系图</button><button data-act="graph" data-mode="table" class="${s.graphMode==='table'?'active':''}">${icon('table')} 字段表格</button></div><div class="spacer"></div><button class="textbtn" data-act="add-field">${icon('plus')}添加度量</button><span class="divider"></span><button class="iconbtn" data-act="undo" title="撤销业务编辑" aria-label="撤销业务编辑">${icon('undo')}</button><button class="iconbtn" data-act="layout" title="自动排列" aria-label="自动排列">${icon('grid')}</button></div>${s.graphMode==='canvas'?canvas():fieldTable()}<div class="belowcanvas"><span>${s.dims.length+1} 个实体 · ${s.dims.length} 条关系 <span style="margin-left:12px">${s.fields.filter(f=>f.role==='度量').length} 项度量</span></span><span>点击查看属性 · 双击卡片编辑字段</span></div></div>${s.frozen?`<div class="snapshot flex between"><span>逻辑快照 v${s.logicalVersion} · ${logicalMatchesSnapshot()?'当前字段与粒度匹配':'当前设计已变更，需重新冻结'} · DRAFT</span><button class="textbtn" data-act="freeze">重新冻结</button></div>`:''}${note('设计关系表达业务意图；源数据唯一性和连接扩行需要在数据开发中验证。')}</div>${inspector()}</div>`}
function entityCard(id,pos){const isFact=id==='sales',d=library.find(x=>x.id===id);const name=isFact?'订单明细事实':d.name,code=isFact?'fact_order_item':d.code;const rows=isFact?s.fields.filter(f=>['order_id','line_id','customer_key','quantity','paid_amount','discount_amount'].includes(f.id)||f.risk).slice(0,7):d.attrs.slice(0,3).map(([id,name,type])=>({id,name,type}));return `<div class="entity ${isFact?'fact':''} ${s.selected===id?'selected':''}" data-entity="${id}" role="button" tabindex="0" aria-label="选择${name}" style="left:${pos.x}%;top:${pos.y}px"><div class="entityhead"><div class="entityicon">${icon(isFact?'cube':'table')}</div><div><strong>${name}</strong><small class="mono">${code}</small></div></div><div class="entitybody">${rows.map((f,i)=>`<div class="entityrow"><span class="keytag ${f.role==='维度引用'?'fk':f.role==='度量'?'num':''}">${isFact?(s.keys.includes(f.id)?'BK':f.role==='维度引用'?'FK':'∑'):i===0?'PK':'○'}</span><span class="mono">${esc(f.id)}</span><div class="spacer"></div>${f.risk?'<span style="color:#d98c42">!</span>':f.id==='paid_amount'&&!f.source?'<span style="color:#d6a057">●</span>':''}</div>`).join('')}</div><div class="entityfoot"><span>${isFact?`${s.fields.length} 个字段 · ${s.mode}`:id==='customer'&&s.scd!==d.history?d.history+' · 拟 '+s.scd:d.history}</span><span>${isFact?'DWD':`已发布 v${d.version}`}</span></div></div>`}
function canvas(){const defaults={sales:{x:37,y:128},date:{x:5,y:32},customer:{x:69,y:32},product:{x:5,y:275},channel:{x:69,y:275},store:{x:37,y:440}};const positions={...defaults,...s.positions};const lines=s.dims.map(id=>{const p=positions[id];return `<path class="edgepath" d="M ${p.x+12} ${p.y+76} L 51 236"/><text class="edgelabel" x="${(p.x+12+51)/2}" y="${(p.y+76+236)/2-7}">${id==='customer'&&s.relation==='MANY_TO_MANY'?'N:N':'1:N'}</text>`});return `<div class="canvas-scroll"><div class="canvas"><svg class="edges" viewBox="0 0 100 468" preserveAspectRatio="none">${s.dims.map(id=>{const p=positions[id],x=p.x+12,y=p.y+72;return `<path class="edgepath" vector-effect="non-scaling-stroke" d="M${x} ${y} L51 236"/>`}).join('')}</svg>${s.dims.map(id=>{const p=positions[id];return `<span class="tiny" style="position:absolute;left:${(p.x+12+51)/2}%;top:${(p.y+72+236)/2-12}px;color:#90a0bb">${id==='customer'&&s.relation==='MANY_TO_MANY'?'N:N':'1:N'}</span>`}).join('')}${['sales',...s.dims].map(id=>entityCard(id,positions[id])).join('')}<div class="canvaslegend"><span><b>BK</b> 业务标识</span><span><b>FK</b> 维度引用</span><span><b>∑</b> 度量</span></div><div class="zoom"><button data-act="zoom" data-delta="-10" aria-label="缩小">−</button><span>${s.zoom}%</span><button data-act="zoom" data-delta="10" aria-label="放大">＋</button><button data-act="layout" aria-label="复位画布">⊞</button></div></div></div>`}
function fieldTable(){if(s.selected!=='sales'){const d=library.find(x=>x.id===s.selected);return `<div class="tablewrap"><table class="gridtable"><thead><tr><th>属性名称</th><th>业务名称</th><th>逻辑类型</th><th>引用版本</th></tr></thead><tbody>${d.attrs.map(([id,name,type])=>`<tr><td class="mono">${id}</td><td>${name}</td><td>${type}</td><td>${pill(`v${d.version}`,'blue')}</td></tr>`).join('')}</tbody></table></div><div class="callout-row">${icon('info')}这是已有公共维度的只读引用。修改定义需要回到维度所属模型。</div>`}return `<div class="tablewrap"><table class="gridtable"><thead><tr><th>字段名称</th><th>业务名称</th><th>角色</th><th>逻辑类型</th><th>数据标准</th><th>操作</th></tr></thead><tbody>${s.fields.map(f=>`<tr class="${s.focusField===f.id?'focusrow':''} ${f.risk?'riskrow':''}" data-row="${esc(f.id)}"><td class="mono">${esc(f.id)}${s.keys.includes(f.id)?' <span class="keytag">BK</span>':''}</td><td><input aria-label="${esc(f.id)}业务名称" value="${esc(f.name)}" data-input="field-name" data-id="${esc(f.id)}"></td><td>${pill(f.role,f.role==='度量'?'green':'')}</td><td><select aria-label="${esc(f.id)}逻辑类型" data-input="field-type" data-id="${esc(f.id)}">${['STRING','INTEGER','LONG','DECIMAL','DATE','TIMESTAMP'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></td><td><button class="textbtn" data-act="standard" data-id="${esc(f.id)}">${f.standard?esc(f.standard):'<span style="color:#bd9049">＋ 引用标准</span>'}</button></td><td><button class="iconbtn" data-act="field-detail" data-id="${esc(f.id)}" aria-label="编辑${esc(f.name)}">${icon('settings')}</button>${!s.keys.includes(f.id)&&f.role!=='维度引用'?`<button class="iconbtn" data-act="remove-field" data-id="${esc(f.id)}" aria-label="删除${esc(f.name)}">${icon('trash')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function inspector(){const isFact=s.selected==='sales',d=library.find(x=>x.id===s.selected);const missing=s.fields.filter(f=>!f.standard).length;return `<aside class="card inspector"><div class="inspector-head"><div class="flex between"><span class="eyebrow" style="margin:0">${isFact?'事实属性':'维度引用'}</span>${pill(isFact?'逻辑设计':`已有模型 v${d.version}`,'blue')}</div><h3>${isFact?'订单明细事实':d.name}</h3><div class="mono muted tiny" style="margin-top:3px">${isFact?'fact_order_item':d.code}</div></div><div class="inspector-body">${isFact?`<div><span class="fieldlabel">业务过程</span><div class="fieldvalue flex between">交易域 / 订单交易<button class="textbtn" data-act="context" data-context="业务过程">↗</button></div></div><div><span class="fieldlabel">事实模式</span><div class="fieldvalue">${s.mode}</div></div><div><span class="fieldlabel">业务粒度</span><div class="fieldvalue">${esc(s.grain)}</div><button class="textbtn" data-act="grain" style="margin-top:5px">调整粒度声明</button></div><div><span class="fieldlabel">业务标识</span><div class="chips">${s.keys.map(k=>`<span class="chip mono">${k}</span>`).join('')}</div></div><div class="inspector-divider"></div><div><div class="minirow"><span>业务字段标准覆盖</span><strong>${Math.round((s.fields.length-missing)/s.fields.length*100)}%</strong></div><div class="bar"><i style="width:${(s.fields.length-missing)/s.fields.length*100}%"></i></div><div class="muted tiny" style="margin-top:8px">${missing?`${missing} 个字段待关联 · 不含技术字段`:'当前业务字段均已选择标准'}</div></div>${note(''+(s.fields.find(f=>f.id==='paid_amount')?.source?'实付金额来源已指定；':'实付金额来源尚需核对；')+'代理键查找在数据开发中实现。','warn')}<button class="btn" data-act="freeze">${icon('clock')}冻结逻辑快照</button>`:`<div><span class="fieldlabel">业务含义</span><div class="fieldvalue">${d.description}</div></div><div><span class="fieldlabel">代理键</span><div class="chips"><span class="chip mono">${d.key}</span></div></div><div><span class="fieldlabel">拟采用历史策略</span>${s.selected==='customer'?`<div class="seg"><button class="${s.scd==='SCD1'?'active':''}" data-act="scd" data-scd="SCD1">SCD1 覆盖</button><button class="${s.scd==='SCD2'?'active':''}" data-act="scd" data-scd="SCD2">SCD2 保留历史</button></div>`:`<div class="fieldvalue">${d.history}</div>`}</div><div><span class="fieldlabel">事实侧连接角色</span><div class="fieldvalue">${s.selected==='customer'?esc(s.relationRole):s.selected==='date'?'下单日期':d.name.replace('维度','')} · ${s.selected==='customer'&&s.relation==='MANY_TO_MANY'?'N:N':'1:N'}</div><button class="textbtn" data-act="relation">编辑关系</button></div><div class="inspector-divider"></div><div class="minirow"><span>被业务过程引用</span><strong>${d.used} 个</strong></div>${note(s.selected==='customer'&&s.scd==='SCD2'?'事实需按事件时间命中客户历史版本。有效区间和未知成员仍待开发实现。':'引用现有维度身份，标准与业务定义不在此复制。') }<button class="btn" data-act="dimension-detail" data-id="${d.id}">${icon('eye')}查看维度定义</button>`}</div></aside>`}
function sources(){const missing=s.fields.filter(f=>!f.source).length,unstd=s.fields.filter(f=>!f.standard).length,isStandard=s.variant==='B'&&s.step===3;return `<div class="statgrid"><div class="statcard"><div class="statlabel">直接来源与转换</div><div class="number">${s.fields.length-missing}<span style="font-size:12px;color:#a1aec1;font-weight:400"> / ${s.fields.length}</span></div><div class="muted tiny">来源关系为设计声明</div></div><div class="statcard"><div class="statlabel">业务字段标准覆盖</div><div class="number">${Math.round((s.fields.length-unstd)/s.fields.length*100)}<span style="font-size:13px">%</span></div><div class="muted tiny">${unstd?`${unstd} 个字段待核对`:'已选择全部业务字段标准'}</div></div><div class="statcard"><div class="statlabel">来源目录证据</div><div class="number" style="font-size:16px;line-height:1.7;color:${s.sourceState==='READY'?'#269a78':'#c08c48'}">${s.sourceState==='READY'?'演示目录可读':s.sourceState==='FORBIDDEN'?'无权读取':'暂时不可用'}</div><button class="textbtn" data-act="source-status">切换异常场景 ↗</button></div></div><div class="sourceslayout"><div class="stack"><div class="card"><div style="padding:15px 14px;border-bottom:1px solid var(--line)">${sectionTitle('业务过程来源','Semantic 维护来源绑定')}<div class="flex tiny muted">${icon('layers')}Retail ERP / sales</div></div>${[['order_items','订单商品明细','DETAIL · 12 个源字段'],['orders','订单主表','MAIN · 16 个源字段'],['customers','客户主表','DIM · 8 个源字段']].map(([id,name,desc])=>`<button class="sourceitem ${s.sourceTable===id?'active':''}" data-act="source-table" data-id="${id}"><div class="flex">${icon('table')}<strong>${name}</strong></div><small class="mono">${id}</small><small>${desc}</small></button>`).join('')}<div style="padding:11px 14px"><button class="textbtn" data-act="context" data-context="数据源">查看数据源详情 ↗</button></div></div>${note('业务过程已关联 ODS 来源。客户、商品等代理键需要先查找维度。')}</div><div class="stack"><div class="card"><div class="progressline">${sectionTitle(isStandard?'引用统一标准':'字段来源与标准对齐','逐项确认业务含义；同名候选不自动保存。',`<button class="btn small" data-act="map-first">${icon('link')}处理待映射</button>`)}</div>${s.sourceState!=='READY'?`<div style="padding:16px">${note(s.sourceState==='FORBIDDEN'?'当前模拟为来源目录无权限。保留已知映射，不能重新选择源字段。':'当前模拟为来源目录不可用。保留已知映射，来源校验无法完成。','warn')}</div>`:''}<div class="tablewrap"><table class="gridtable"><thead><tr><th>目标业务字段</th>${isStandard?'':'<th>来源 / 转换方式</th>'}<th>数据标准</th><th>处理</th></tr></thead><tbody>${s.fields.map(f=>`<tr class="${s.focusField===f.id?'focusrow':''}"><td><strong style="font-size:11px">${esc(f.name)}</strong><div class="mono muted tiny">${esc(f.id)}</div></td>${isStandard?'':`<td>${f.source?`<span class="mono">${esc(f.source)}</span>${f.source.includes('查找')?'<div class="tiny muted">待数据开发实现</div>':''}`:pill('尚未映射','orange')}</td>`}<td>${f.standard?`<button class="textbtn" data-act="standard" data-id="${esc(f.id)}">${esc(f.standard)}</button>`:pill('待引用','orange')}</td><td><button class="textbtn" data-act="${isStandard?'standard':'mapping'}" data-id="${esc(f.id)}">${isStandard?'选择标准':'编辑映射'}</button></td></tr>`).join('')}</tbody></table></div><div class="callout-row">${icon('info')}结构变更与映射分别保存；生产环境应显示逐项回执和未执行项。</div></div><div class="tourcard"><div><h3>标准不只是字段名称</h3><p>类型、单位、码值、口径和安全等级通过 Semantic 的标准 ID 引用。</p></div><button class="btn small" data-act="standard-first">${icon('plus')}处理标准缺口</button></div></div></div>`}
function physicalType(type){const catalog={MYSQL:{STRING:'VARCHAR(128)',INTEGER:'INT',LONG:'BIGINT',DECIMAL:'DECIMAL(18,2)',DATE:'DATE',TIMESTAMP:'DATETIME'},POSTGRESQL:{STRING:'VARCHAR(128)',INTEGER:'INTEGER',LONG:'BIGINT',DECIMAL:'NUMERIC(18,2)',DATE:'DATE',TIMESTAMP:'TIMESTAMP'},DORIS:{STRING:'VARCHAR(128)',INTEGER:'INT',LONG:'BIGINT',DECIMAL:'DECIMAL(18,2)',DATE:'DATE',TIMESTAMP:'DATETIME'}};return catalog[s.dialect][type]||type}
function physicalTables(){return [{id:'sales',name:'订单明细事实',table:s.tableName,action:'新建物理模型',layer:s.layer,dialect:s.dialect,keys:clone(s.keys),fields:[...s.fields.map(f=>({...f,physicalType:physicalType(f.type)})),{id:'etl_time',name:'处理时间',role:'技术字段',type:'TIMESTAMP',physicalType:physicalType('TIMESTAMP'),nullable:false,source:'加工时间',standard:''}]},...s.dims.map(id=>{const d=library.find(x=>x.id===id);return {id,name:d.name,table:d.code,action:'引用已有模型',layer:'DIM',dialect:'MYSQL',version:d.version,keys:[d.key],fields:[...d.attrs.map(([id,name,type])=>({id,name,type,physicalType:({STRING:'VARCHAR(128)',INTEGER:'INT',LONG:'BIGINT',DATE:'DATE'})[type]||type,nullable:false})),...(id==='customer'&&d.history==='SCD2'?[{id:'valid_from',name:'有效起始',physicalType:'DATETIME',nullable:false},{id:'valid_to',name:'有效截止',physicalType:'DATETIME',nullable:false},{id:'is_current',name:'当前版本',physicalType:'TINYINT',nullable:false}]:[])]}})]}
function physical(){if(!s.physical)return `<div class="card"><div class="empty-panel"><div class="empty-icon">${icon('layers')}</div><h2>把业务设计转成可复核的表结构</h2><p>一张事实表引用 ${s.dims.length} 个公共维度。先明确目标分层、数据库与方言，再检查字段类型和维度连接。</p><div class="flex" style="justify-content:center;margin-bottom:18px">${pill(s.frozen?`逻辑 DRAFT 快照 v${s.logicalVersion}`:'逻辑快照尚未冻结',s.frozen?'green':'orange')}${pill('1 张事实表 + 复用已有维度','blue')}</div><button class="btn primary" data-act="prepare-physical">${icon('layers')}准备物理草稿</button></div><div style="padding:0 24px 24px">${note('原型演示物理设计方案。当前接口可逐表创建/编辑；逻辑物理预览仅为人工复核，可靠一键生成需补充契约。')}</div></div>`;const tables=physicalTables(),t=tables.find(x=>x.id===s.physicalSelected)||tables[0],reuse=t.id!=='sales';return `<div class="physical-layout"><div class="stack"><div class="card physical-nav"><div style="padding:14px;font-size:11px;color:#8f9eb1">落地对象 · 1 新建 / ${s.dims.length} 复用</div>${tables.map(t=>`<button data-act="physical-select" data-id="${t.id}" class="${s.physicalSelected===t.id?'active':''}">${icon(t.id==='sales'?'cube':'table')}<div>${t.name}<small class="mono">${esc(t.table)}</small></div></button>`).join('')}</div>${note('公共维度引用已有发布版本，不因事实建模复制一套定义。')}</div><div class="stack"><div class="card card-pad">${sectionTitle(reuse?'复用现有维度模型':'物理表设置',reuse?`已发布 v${t.version} · 只读引用`:'调整结构不会自动建表或执行加工。',pill(t.action,reuse?'green':'blue'))}<div class="formgrid"><div class="formfield"><label>目标分层</label><select data-input="layer" ${reuse?'disabled':''}>${[reuse?'DIM':'DWD',...(reuse?[]:['DWS','ADS'])].map(l=>`<option ${t.layer===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="formfield"><label>数据库方言</label><select data-input="dialect" ${reuse?'disabled':''}>${['MYSQL','POSTGRESQL','DORIS'].map(d=>`<option ${t.dialect===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="formfield"><label>物理表名</label><input value="${esc(t.table)}" data-input="table-name" ${reuse?'disabled':''}></div><div class="formfield"><label>目标数据源 / 数据库</label><input value="${t.dialect==='MYSQL'?'Retail DW MySQL':`DW-${t.dialect}`} / dw_retail（演示）" disabled></div></div>${s.dialect!=='MYSQL'?`<div style="margin-top:14px">${note('已复用维度属于 MySQL 目标。跨目标库/方言的部署和键查找需重新设计，不能直接视为可执行连接。','warn')}</div>`:''}</div><div class="card"><div style="padding:16px;border-bottom:1px solid var(--line)">${sectionTitle('字段与物理类型',`${t.fields.length} 个字段 · 主键 ${t.keys.join(' + ')}`,reuse?'':`<button class="textbtn" data-act="structure-options">${icon('settings')}键、索引与分区</button>`)}</div><div class="tablewrap"><table class="gridtable"><thead><tr><th>物理字段</th><th>业务名称</th><th>目标类型</th><th>可空</th><th>字段角色</th></tr></thead><tbody>${t.fields.map(f=>`<tr><td class="mono">${esc(f.id)}${t.keys.includes(f.id)?' <span class="keytag">PK</span>':''}</td><td>${esc(f.name)}</td><td class="mono">${esc(f.physicalType)}</td><td>${f.nullable?'是':'否'}</td><td>${pill(f.role||'维度属性',f.role==='技术字段'?'':'blue')}</td></tr>`).join('')}</tbody></table></div><div class="callout-row">${icon('info')}${reuse?'引用对象定义由所属模型维护；历史策略变化不会自动修改该发布版本。':'保存只更新物理设计草稿，不会创建物理表。字段类型需符合目标数据库。'}</div></div><div class="flex between">${pill(s.dirty.physical?'物理草稿未保存':'物理草稿已模拟保存',s.dirty.physical?'orange':'green')}<div class="flex"><button class="btn" data-act="ddl">${icon('code')}查看 DDL</button><button class="btn primary" data-act="save">${icon('save')}保存物理草稿</button></div></div></div></div>`}
function review(){const checks=getChecks(),errors=checks.filter(c=>c.level==='error').length,warnings=checks.filter(c=>c.level==='warn').length;return `<div class="statgrid"><div class="statcard"><div class="statlabel">设计检查</div><div class="number" style="color:${errors?'#cd6565':'#28a07d'}">${s.checked?(errors?`${errors} 项需修正`:'可继续复核'):'尚未检查'}</div><div class="muted tiny">前端设计提醒 · 非真实数据验证</div></div><div class="statcard"><div class="statlabel">交付待办</div><div class="number">${warnings}<span style="font-size:13px"> 项</span></div><div class="muted tiny">来源、标准与加工任务分别核对</div></div><div class="statcard"><div class="statlabel">物理设计发布版本</div><div class="number">${s.published?`v${s.published.no}`:'未发布'}</div><div class="muted tiny">发布快照不会随草稿编辑漂移</div></div></div><div class="reviewlayout"><div class="stack"><div class="card"><div style="padding:16px;border-bottom:1px solid var(--line)">${sectionTitle('检查清单','每个问题都能定位到对象；运行证据在下游获取。',`<button class="btn small primary" data-act="run-checks">${icon('refresh')}运行演示检查</button>`)}</div>${checks.map(c=>`<div class="checkitem ${c.level==='warn'?'warn':c.level==='error'?'error':''}"><div class="checkdot">${icon(c.level==='pass'?'check':'warn')}</div><div class="checkinfo"><strong>${c.title}</strong><p>${c.text}</p></div><button class="textbtn" data-act="${c.act}">${c.level==='pass'?'查看':'处理'}</button></div>`).join('')}</div><div class="card card-pad">${sectionTitle('版本与变更','保存、冻结逻辑快照、发布物理设计分别操作。')}<div class="flex between" style="margin-bottom:12px"><span class="fieldvalue">逻辑快照</span>${pill(s.frozen?`v${s.logicalVersion} · DRAFT`:'未冻结',s.frozen?'blue':'orange')}</div><div class="flex between" style="margin-bottom:12px"><span class="fieldvalue">物理设计快照</span>${pill(s.published?`v${s.published.no} · 演示发布`:'未发布',s.published?'green':'')}</div>${s.published?`<div class="note ${JSON.stringify(s.published.design.fields)!==JSON.stringify(designFieldsForVersion())?'warn':'green'}">${icon('clock')}<div>${JSON.stringify(s.published.design.fields)!==JSON.stringify(designFieldsForVersion())?'当前字段与已发布版本不同，编辑只影响草稿。':'已发布版本保留当时的物理结构。'}<button class="textbtn" data-act="version" style="display:block;margin-top:4px">查看精确快照</button></div></div>`:note('首次发布形成不可变物理结构版本；后续编辑与重新发布是独立动作。')}</div></div><div class="stack"><div class="card card-pad">${sectionTitle('交付进展','区分设计与实际运行结果。')}<div class="delivery-step ${s.published?'done':''}"><strong>设计版本</strong><p>${s.published?`模拟已发布 v${s.published.no}`:'待保存并发布物理设计'}</p>${s.published?pill('设计已发布','green'):pill('尚未发布')}</div><div class="delivery-step"><strong>建表脚本</strong><p>从已保存的物理结构生成文本。</p><button class="textbtn" data-act="ddl">查看 / 导出 DDL</button></div><div class="delivery-step"><strong>物理部署</strong><p>尚无真实目标表证据。</p>${pill('待部署核对','orange')}</div><div class="delivery-step"><strong>数据开发与运行</strong><p>代理键查找、SCD、加载及数据验证待实现。</p><button class="textbtn" data-act="handoff">查看开发交接单 ↗</button></div></div><div class="card card-pad"><h3>交付这份设计</h3><p class="muted tiny" style="margin:8px 0 16px">标准提醒不新增硬发布门禁；原型检查不替代生产权限、结构校验和审批。</p><button class="btn primary" data-act="publish" style="width:100%;margin-bottom:10px">${icon('shield')}模拟发布物理设计</button><button class="btn" data-act="export" style="width:100%">${icon('download')}导出设计说明 JSON</button></div></div></div>`}
function grainStep(){return `<div class="workspace"><div class="stack"><div class="card card-pad">${sectionTitle('先说清楚一行数据代表什么','粒度是业务声明，不由表名或主键自动决定。')}<div class="formgrid"><div class="formfield wide"><label>业务过程</label><input value="交易域 / 订单交易 · PROC_ORDER（演示）" disabled></div><div class="formfield wide"><label>一行数据代表</label><textarea data-input="grain">${esc(s.grain)}</textarea></div><div class="formfield wide"><label>业务标识</label><div class="chips">${s.keys.map(k=>`<span class="chip mono">${k}</span>`).join('')}</div></div></div><div class="factmode">${['事务事实','周期快照','累积快照','无事实事实'].map(m=>`<button data-act="fact-mode" data-mode="${m}" class="${s.mode===m?'active':''}">${icon(m==='事务事实'?'cube':'clock')}${m}</button>`).join('')}</div></div>${note(s.mode==='事务事实'?'订单总额属于订单粒度，不能作为每条商品明细的可加度量。':'当前演示字段仍来自订单明细。切换事实模式只改设计声明，需重新核对粒度、时间和度量。','warn')}<div class="card card-pad">${sectionTitle('设计目标','用户要回答的业务问题')}<div class="chips"><span class="chip">各商品卖了多少？</span><span class="chip">不同渠道的实付金额？</span><span class="chip">不同客户等级的购买表现？</span></div></div></div>${inspector()}</div>`}
function matrix(){const rows=[{name:'订单交易',desc:'一条订单商品明细',dims:s.dims,measures:s.fields.filter(f=>f.role==='度量').length,act:'matrix-edit'},{name:'退款处理',desc:'一条退款商品明细',dims:['date','customer','product','channel'],measures:2,act:'process-refund'},{name:'库存快照',desc:'每日 / 门店 / SKU',dims:['date','product','store'],measures:2,act:'process-inventory'}];return `<div class="matrixintro"><div><div class="eyebrow">业务过程 × 公共维度</div><h2>先看复用，再进入细节</h2><p>相同维度身份连接多个业务过程；矩阵是设计视图，不是独立维度注册库。</p></div><button class="btn primary" data-act="matrix-edit">${icon('arrow')}继续订单交易设计</button></div><div class="card matrix"><div class="tablewrap"><table class="gridtable"><thead><tr><th>业务过程 / 事实粒度</th>${library.map(d=>`<th><button data-act="dimension-detail" data-id="${d.id}">${d.name}<div class="mono tiny muted">${d.code}</div></button></th>`).join('')}<th>度量</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button data-act="${r.act}" style="padding:0;text-align:left"><strong>${r.name} ↗</strong><div class="tiny muted" style="margin-top:5px">${r.desc}</div></button></td>${library.map(d=>`<td>${r.dims.includes(d.id)?`<button data-act="dimension-detail" data-id="${d.id}" aria-label="${r.name}引用${d.name}"><span class="matrixdot">✓</span></button>`:'<span style="color:#ccd5e1">—</span>'}</td>`).join('')}<td>${r.measures} 项</td></tr>`).join('')}</tbody></table></div><div class="matrixfoot"><span>✓ 使用同一维度身份</span><span>— 未引用</span><span>语义一致性仍需人工确认</span></div></div><div class="statgrid" style="margin-top:18px"><div class="statcard"><div class="statlabel">规划中的业务过程</div><div class="number">3</div><div class="muted tiny">事务与快照粒度分别设计</div></div><div class="statcard"><div class="statlabel">公共维度定义</div><div class="number">5</div><div class="muted tiny">均引用既有模型身份</div></div><div class="statcard"><div class="statlabel">跨过程规划共享维度</div><div class="number">${library.filter(d=>rows.filter(r=>r.dims.includes(d.id)).length>1).length}</div><div class="muted tiny">${library.filter(d=>rows.filter(r=>r.dims.includes(d.id)).length>1).map(d=>d.name.replace('维度','')).join('、')}</div></div></div><div class="tourcard"><div><h3>从订单明细设计开始体验</h3><p>关系画布、字段表格、来源标准、物理设计与交付都在同一上下文中。</p></div><button class="btn" data-act="matrix-edit">进入工作台 ${icon('arrow')}</button></div>`}
function home(){return `<div class="pagehead"><div class="breadcrumb">模型工作台 / 零售数仓</div><div class="flex between"><div><h1>设计列表</h1><p class="subtitle">围绕业务过程组织设计，从需求到物理结构。</p></div><button class="btn primary" data-act="new-design">${icon('plus')}新建设计</button></div></div><div class="content"><div class="flex between" style="margin-bottom:17px"><div class="flex">${pill('交易域','blue')}${pill('当前项目')}<span class="tiny muted">3 个演示设计</span></div><div class="inline-search">${icon('search')}<input placeholder="搜索业务过程或设计" aria-label="搜索设计" data-input="home-search"></div></div><div class="card" id="design-list">${[['订单交易分析','订单商品明细 · 事务事实 · 4 个公共维度','workspace'],['退款处理分析','退款商品明细 · 事务事实 · 4 个公共维度','process-refund'],['库存快照分析','每日 / 门店 / SKU · 周期快照 · 3 个公共维度','process-inventory']].map(([name,desc,act])=>`<div class="listrow" data-design-name="${name}"><div class="titleicon">${icon('cube')}</div><div class="grow"><h3>${name}</h3><p>${desc}</p></div>${pill(name==='订单交易分析'?'可交互演示':'规划示例',name==='订单交易分析'?'blue':'')}<button class="btn small" data-act="${act}">${name==='订单交易分析'?'继续编辑':'查看说明'} ${icon('arrow')}</button></div>`).join('')}</div><div class="tourcard"><div><h3>从业务问题出发，而不是先选数据库</h3><p>选择过程与粒度 → 组织事实与维度 → 对齐来源和标准 → 物理设计与交付。</p></div><button class="textbtn" data-act="help">查看体验路线</button></div></div>`}
function render(){const matrixView=s.variant==='C'&&!s.matrixOpen&&s.view==='editor';let content;if(s.view==='home'){content=home()}else{content=header();if(s.variant==='B'){content+=`<div class="steps">${stepNames.map((n,i)=>`<button class="step ${s.step===i?'active':''}" data-act="step" data-step="${i}"><span class="stepnum">${i+1}</span>${n}</button>`).join('')}</div>`}else if(!matrixView){content+=tabs()}content+='<div class="content">';if(matrixView)content+=matrix();else{if(s.variant==='C')content+=`<button class="textbtn" data-act="matrix-back" style="margin-bottom:15px">${icon('back')}返回公共维度矩阵</button>`;if(s.variant==='B')content+=`<div class="guidehead"><div><div class="eyebrow">STEP ${s.step+1} / 6</div><h2>${stepNames[s.step]}</h2><p>${['明确业务过程和一行数据的业务含义。','先复用维度，再声明符合粒度的度量。','确认来源字段和需要加工的转换。','逐项核对标准含义，再带入当前草稿。','准备物理表结构与公共维度引用。','理解设计结果、待办和下一步交付。'][s.step]}</p></div><button class="btn small" data-act="help">体验提示</button></div>`;content+=s.variant==='B'&&s.step===0?grainStep():({logical,sources,physical,review}[s.tab])();if(s.variant==='B')content+=`<div class="guidefooter"><button class="btn" data-act="step-prev" ${s.step===0?'disabled':''}>${icon('back')}上一步</button><span>步骤只是当前操作位置，保存与发布由对象事实决定。</span><button class="btn primary" data-act="step-next" ${s.step===5?'disabled':''}>继续 ${icon('arrow')}</button></div>`}content+='</div>'}document.getElementById('main').innerHTML=content;document.getElementById('switcher').innerHTML=`<button data-act="variant-prev" aria-label="前一种布局">←</button><span class="label"><small>方案 ${s.variant}</small>${variantNames[s.variant]}</span><button data-act="variant-next" aria-label="后一种布局">→</button><button class="info" data-act="help">说明</button>`;const canvasEl=document.querySelector('.canvas');if(canvasEl){if(s.dims.includes('store'))canvasEl.style.height='620px';canvasEl.querySelectorAll('.entity').forEach(el=>{el.style.transform=`scale(${s.zoom/100})`;el.style.transformOrigin='top left'})}}
function goTab(tab){s.view='editor';s.matrixOpen=true;s.tab=tab;if(s.variant==='B')s.step={logical:1,sources:2,physical:4,review:5}[tab];s.lastAction=`查看 ${tab}`;render()}
function setVariant(delta){const order=['A','B','C'];s.variant=order[(order.indexOf(s.variant)+delta+3)%3];s.matrixOpen=s.variant!=='C';if(s.variant==='B')s.step={logical:1,sources:2,physical:4,review:5}[s.tab];const url=new URL(location.href);url.searchParams.set('variant',s.variant);history.replaceState(null,'',url);render()}
function openDialog(title,body,footer='',drawer=false){const modal=document.getElementById('modal');if(modal.open)modal.close();modal.className=drawer?'drawer':'';modal.innerHTML=`<div class="modalhead"><h2 style="font-size:17px">${title}</h2><button class="iconbtn" data-act="close" aria-label="关闭">${icon('close')}</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn" data-act="close">关闭</button>${footer}</div>`;modal.showModal()}
function closeDialog(){document.getElementById('modal').close()}
function openGrain(){openDialog('声明业务粒度',`<div class="stack"><div class="formfield"><label for="grain-edit">一行数据代表什么？</label><textarea id="grain-edit">${esc(s.grain)}</textarea></div><div class="formfield"><label for="mode-edit">事实模式</label><select id="mode-edit">${['事务事实','周期快照','累积快照','无事实事实'].map(m=>`<option ${s.mode===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="formfield"><label>业务标识</label><div class="chips">${s.keys.map(k=>`<span class="chip mono">${k}</span>`).join('')}</div></div>${note('确认业务含义后，仍需检查来源唯一性、维度基数和度量粒度。')}</div>`,`<button class="btn primary" data-act="grain-apply">带入逻辑草稿</button>`)}
function openDims(){openDialog('复用公共维度',`<p class="muted" style="margin-bottom:15px;font-size:12px">从当前项目已有模型中引用，优先保留统一的业务键、标准和发布版本。</p>${library.map(d=>`<div class="optioncard"><div class="titleicon">${icon('table')}</div><div style="flex:1"><strong>${d.name}</strong><div class="mono tiny muted">${d.code} · 已发布 v${d.version}</div><p>${d.description}</p><div class="chips" style="margin-top:7px"><span class="chip">${d.history}</span><span class="chip">${d.used} 个过程引用</span></div></div><button class="btn small ${s.dims.includes(d.id)?'':'soft'}" data-act="dim-add" data-id="${d.id}" ${s.dims.includes(d.id)?'disabled':''}>${s.dims.includes(d.id)?'已引用':'引用'}</button></div>`).join('')}${note('已有维度版本只读。SCD 策略更改属于新的设计请求，需要到维度所属模型复核。')}`,'',true)}
function openMapping(id){const f=s.fields.find(x=>x.id===id);if(!f)return;const lookup=f.role==='维度引用';const choices=lookup?[['维度键查找','按业务编号查找维度代理键'],['日期键转换','从业务日期转换日历键']]:f.id==='paid_amount'?[['order_items.line_paid_amount','明细实付金额'],['orders.total_amount','订单总额（需分摊，粒度不一致）']]:[['order_items.'+f.id,'订单商品明细对应字段'],['orders.'+f.id,'订单主表对应字段']];openDialog(`来源映射 · ${esc(f.name)}`,`<div class="stack"><div class="flex between">${pill(f.id,'blue')}<span class="mono muted">${esc(f.type)}</span></div><div class="formfield"><label>当前来源目录</label><input value="Retail ERP / sales / ${s.sourceTable}（演示）" disabled></div><div class="formfield"><label for="mapping-source">${lookup?'设计转换方式':'来源字段'}</label><select id="mapping-source" ${s.sourceState==='READY'?'':'disabled'}><option value="">请选择来源</option>${choices.map(([v,n])=>`<option value="${esc(v)}" ${f.source===v?'selected':''}>${n} · ${v}</option>`).join('')}</select></div><div class="formfield"><label>转换说明</label><textarea id="mapping-note" placeholder="记录需要开发实现的转换，原型不生成可执行加载 SQL">${lookup?'代理键查找需要开发实现；客户 SCD2 按订单事件时间命中有效区间。':''}</textarea></div>${note(lookup?'现有单列来源映射不能完整承载维度键查找。这项在原型中是交接说明，不冒充已持久化的加工规则。':'同名字段不保证含义相同；核对来源粒度和金额口径。','warn')}${s.sourceState!=='READY'?note('当前目录无法读取，不能确认新的来源字段。','error'):''}</div>`,`<button class="btn primary" data-act="mapping-apply" data-id="${esc(id)}" ${s.sourceState==='READY'?'':'disabled'}>带入映射草稿</button>`,true)}
function openStandard(id){const f=s.fields.find(x=>x.id===id);if(!f)return;const monetary=f.type==='DECIMAL'&&f.id!=='quantity';const standards=monetary?[['金额（CNY）','STD_AMOUNT_CNY','DECIMAL(18,2) · CNY · 金额类统一单位'],['金额（USD）','STD_AMOUNT_USD','DECIMAL(18,2) · USD · 需要明确汇率换算']]:[[f.standard||f.name,`STD_${f.id.toUpperCase()}`,'当前项目的启用标准字段（演示）']];openDialog(`引用标准 · ${esc(f.name)}`,`<div class="stack"><div class="flex between">${pill(f.id,'blue')}<span class="tiny muted">候选进入草稿，人工保存后生效</span></div><div><span class="fieldlabel">当前引用</span><span class="fieldvalue">${esc(f.standard)||'尚未引用标准'}</span></div>${standards.map(([name,code,desc],i)=>`<label class="optioncard ${i===0?'selected':''}"><input type="radio" name="standard-option" value="${esc(name)}" ${i===0?'checked':''}><div><strong>${name}</strong><div class="mono tiny muted">${code} · v2 · ENABLED（演示）</div><p>${desc}</p></div></label>`).join('')}${note('生产实现引用 Semantic 的真实 ID 并重读状态/版本；标准停用或变化时不能静默覆盖模型。')}<button class="textbtn" data-act="context" data-context="数据标准">查看标准所属模块 ↗</button></div>`,`<button class="btn primary" data-act="standard-apply" data-id="${esc(id)}">采纳所选标准</button>`,true)}
function openAddField(){openDialog('添加度量字段',`<div class="stack"><div class="formgrid"><div class="formfield"><label for="new-field-id">字段名称</label><input id="new-field-id" value="order_total"></div><div class="formfield"><label for="new-field-name">业务名称</label><input id="new-field-name" value="订单总额"></div><div class="formfield"><label for="new-field-type">逻辑类型</label><select id="new-field-type"><option>DECIMAL</option><option>INTEGER</option><option>LONG</option></select></div><div class="formfield"><label for="new-field-additive">可加性</label><select id="new-field-additive"><option>完全可加</option><option>时间不可加</option><option>不可加</option></select></div></div><label class="flex tiny"><input id="new-field-risk" type="checkbox" checked>此度量来自订单级，与当前明细粒度不同</label>${note('试试加入订单总额，再到检查清单定位粒度问题。可加性与粒度是不同约束。','warn')}</div>`,`<button class="btn primary" data-act="field-add-apply">添加到逻辑草稿</button>`)}
function openRelation(){const d=s.selected==='sales'?library.find(x=>x.id==='customer'):library.find(x=>x.id===s.selected);openDialog('编辑维度关系',`<div class="stack"><div class="flex between">${pill(d.name,'blue')}${icon('arrow')}${pill('订单明细事实')}</div><div class="formgrid"><div class="formfield"><label>维度连接键</label><input value="${d.key}" disabled></div><div class="formfield"><label>事实引用字段</label><input value="${d.id==='date'?'order_date_key':d.key}" disabled></div><div class="formfield"><label for="relation-role">关系角色</label><input id="relation-role" value="${d.id==='customer'?esc(s.relationRole):d.id==='date'?'下单日期':d.name.replace('维度','')}"></div><div class="formfield"><label for="relation-cardinality">维度 → 事实基数</label><select id="relation-cardinality"><option value="ONE_TO_MANY" ${s.relation!=='MANY_TO_MANY'?'selected':''}>1:N 多条事实引用一个维度成员</option><option value="MANY_TO_MANY" ${s.relation==='MANY_TO_MANY'?'selected':''}>N:N 需要桥接/分摊设计</option></select></div></div>${note('当前 API 可存实体端点与基数；关系角色、字段对和 SCD 时间查找需补充契约。原型用于讨论，不宣称已保存。')}</div>`,`<button class="btn primary" data-act="relation-apply" data-id="${d.id}">带入关系设计</button>`)}
function openDimension(id){const d=library.find(x=>x.id===id);if(!d)return;openDialog(d.name,`<div class="stack"><div class="flex between"><span class="mono">${d.code}</span>${pill(`已发布 v${d.version}`,'green')}</div><p class="fieldvalue">${d.description}</p><div class="tablewrap"><table class="gridtable"><thead><tr><th>属性</th><th>业务含义</th><th>逻辑类型</th></tr></thead><tbody>${d.attrs.map(([id,name,type])=>`<tr><td class="mono">${id}</td><td>${name}</td><td>${type}</td></tr>`).join('')}</tbody></table></div>${note(`历史策略：${d.history}。本窗口展示已有定义的演示投影。当前事实设计中的策略修改不会改变此版本。`)}</div>`,s.dims.includes(id)?'':`<button class="btn primary" data-act="dim-add" data-id="${id}">引用这个维度</button>`,true)}
function openSourceStatus(){openDialog('模拟来源目录状态',`<p class="muted" style="margin-bottom:15px">只影响来源目录证据；保留已有模型结构和本地草稿。</p>${[['READY','目录可读','可选择来源字段；演示元数据，不含真实数据行。'],['UNAVAILABLE','暂时不可用','目录 provider 故障，不能把结果显示为空。'],['FORBIDDEN','无权读取','当前用户无来源访问权限，不能读取或确认新映射。']].map(([v,n,d])=>`<label class="optioncard"><input type="radio" name="source-state" value="${v}" ${s.sourceState===v?'checked':''}><div><strong>${n}</strong><p>${d}</p></div></label>`).join('')}`,`<button class="btn primary" data-act="source-status-apply">切换场景</button>`)}
function openConflict(){openDialog('保存冲突：其他人已更新模型',`<div class="stack">${note('模拟服务端拒绝过期版本保存。当前本地草稿完整保留，不自动覆盖他人修改。','warn')}<div class="formgrid"><div class="card card-pad"><span class="fieldlabel">你的编辑基线</span><strong>revision ${s.revision}</strong></div><div class="card card-pad"><span class="fieldlabel">服务端新版本（模拟）</span><strong>revision ${s.revision+1}</strong><p class="muted tiny">客户业务说明发生变化</p></div></div><p class="tiny muted">本场景只演示冲突处理入口。正式实现应读取最新结构，展示逐项差异并人工合并。</p></div>`,`<button class="btn primary" data-act="conflict-resolve">模拟核对并保留本地草稿</button>`)}
function ddlText(){if(!s.savedPhysical)return '';const t=s.savedPhysical.tables.find(t=>t.id==='sales');const quoted=id=>s.savedPhysical.dialect==='MYSQL'?'`'+id+'`':'"'+id+'"';return `-- 交互原型示例，未执行。\n-- 使用本次模拟保存的结构；公共维度引用已有模型，不重复建表。\n-- 代理键查找、SCD 区间和数据加载仍待数据开发实现。\nCREATE TABLE ${quoted(t.table)} (\n${t.fields.map(f=>`  ${quoted(f.id)} ${f.physicalType}${f.nullable?'':' NOT NULL'}`).join(',\n')},\n  PRIMARY KEY (${t.keys.map(quoted).join(', ')})\n);\n-- 物理部署和任务运行状态：尚无证据。\n`}
function openDDL(){if(!s.physical){goTab('physical');toast('请先准备物理草稿');return}if(!s.savedPhysical||s.dirty.physical){goTab('physical');toast('先保存物理草稿，再查看对应 DDL');return}openDialog('已保存物理结构 · DDL 示例',`<div class="stack"><div class="flex between">${pill(s.savedPhysical.dialect,'blue')}${pill('脚本文本 · 未执行','orange')}</div><pre class="codebox">${esc(ddlText())}</pre>${note('生产环境使用后端 DDL 生成器。此示例来自原型的模拟保存快照，不是生产建表结果。')}</div>`,`<button class="btn primary" data-act="download-ddl">${icon('download')}下载 .sql</button>`)}
function openPublish(){if(!s.physical||!s.savedPhysical||s.dirty.physical){goTab('physical');toast('请先准备并保存物理草稿');return}const errors=getChecks().filter(x=>x.level==='error');if(errors.length){goTab('review');s.checked=true;render();toast('请先处理演示设计中的粒度或关系问题');return}const warnings=getChecks().filter(x=>x.level==='warn');openDialog('模拟发布物理设计',`<div class="stack"><div class="flex between"><strong>${esc(s.tableName)}</strong>${pill(`新版本 v${(s.published?.no||0)+1}`,'blue')}</div><p class="fieldvalue">把当前已保存物理结构冻结为设计版本，后续编辑仍只影响草稿。</p>${note(`仍有 ${warnings.length} 项交付提醒。标准覆盖不足按现有合同提示；加工待办留给数据开发。`,'warn')}<div class="chips">${warnings.map(c=>`<span class="chip">${c.title}</span>`).join('')}</div>${note('发布不会执行 DDL、部署物理表或启动数据任务。生产行为仍由原权限、结构校验与审批合同裁决。')}</div>`,`<button class="btn primary" data-act="publish-confirm">确认模拟发布设计</button>`)}
function openHandoff(){openDialog('数据开发交接单',`<div class="stack"><div class="flex between"><strong>订单交易分析</strong>${pill(s.published?`物理版本 v${s.published.no}`:'物理版本尚未发布',s.published?'blue':'orange')}</div><div><span class="fieldlabel">设计来源</span><div class="fieldvalue">Retail ERP / sales / orders + order_items</div><div class="tiny muted">订单与明细通过 order_id 对应；连接唯一性待真实验证。</div></div><div><span class="fieldlabel">加工待办</span><div class="stack" style="gap:9px">${['确定维度代理键生成与未知成员策略',s.scd==='SCD2'?'客户按业务编号和订单事件时间查找有效版本；处理区间重叠及迟到数据':'客户按业务编号查找当前维度成员',`明确实付金额来源：${s.fields.find(f=>f.id==='paid_amount')?.source||'尚未映射'}`,'实现增量/重算和幂等加载，不能仅凭事实主键假定已完成','验证明细唯一性、连接前后行数、金额对账与物理部署'].map(t=>`<div class="flex tiny"><span style="color:#a8b6cc">○</span>${esc(t)}</div>`).join('')}</div></div>${note('交接检查不是任务创建授权。正式前往数据开发需携带真实模型/版本 ID，由目标页重新读取权限和定义。')}<div class="flex between">${pill('物理部署：待核对','orange')}${pill('任务运行：暂无证据','orange')}</div></div>`,`<button class="btn primary" data-act="export">导出演示设计与待办</button>`,true)}
function openHelp(){openDialog('如何体验这份原型',`<div class="stack"><p class="fieldvalue">推荐从方案 A 开始。底部箭头或键盘 ← / → 切换三种结构，设计在内存中保持。</p><div class="optioncard"><div><strong>A · 专业工作台</strong><p>持续编辑：对象选择、关系图/表格、右侧属性面板，适合日常建模。</p></div></div><div class="optioncard"><div><strong>B · 分步引导</strong><p>六步完成逻辑到物理交付，适合首次使用者；随时返回前一步。</p></div></div><div class="optioncard"><div><strong>C · 公共维度矩阵</strong><p>先比较过程间的维度复用，再进入订单设计，适合架构规划。</p></div></div><p class="fieldvalue">建议试：添加订单总额度量 → 运行检查并定位 → 移除；为实付金额选择明细来源；为优惠金额绑定 CNY 标准；复用门店维度；保存逻辑草稿并冻结；准备并保存物理草稿；查看 DDL；模拟发布并查看开发交接单。</p>${note('原型不连接后端、不存入浏览器持久化。刷新复位；导出 JSON 可保留讨论结果。')}</div>`,`<button class="btn" data-act="state">查看完整演示状态</button><button class="btn primary" data-act="close">开始体验</button>`)}
function openScope(){openDialog('设计提案与现有接口边界',`<div class="stack"><div><h3>优先复用现有接口</h3><p class="fieldvalue" style="margin-top:7px">逻辑实体/属性/基数、DRAFT 快照、物理全量结构保存、标准引用、单列来源映射、方言校验、模型版本与 DDL。</p></div><div><h3>需要最小契约增补</h3><p class="fieldvalue" style="margin-top:7px">结构化业务粒度/可加性、角色与键字段对、可靠的逻辑到多表生成和持久追溯。当前 logical physical 接口仅用于预览和人工复核。</p></div><div><h3>由数据开发实现</h3><p class="fieldvalue" style="margin-top:7px">代理键查找、SCD2 历史加工、桥接、增量加载及真实数据验证。模型发布只保存设计版本。</p></div>${note('本文件是 DRAFT 交互探索，未改生产实现，未执行真实系统 E2E。所有按钮操作仅为模拟。')}</div>`,`<button class="btn" data-act="state">查看演示状态</button>`)}
function openState(){openDialog('演示状态与最近动作',`<div class="stack"><div class="flex between">${pill(`方案 ${s.variant}`,'blue')}<span class="tiny muted">最近动作：${esc(s.lastAction)}</span></div><p class="tiny muted">业务对象、局部保存状态、快照、检查和 provider 状态分别表达。以下为完整内存演示状态。</p><pre class="statebox">${esc(JSON.stringify({...s,history:`${s.history.length} 次撤销记录`},null,2))}</pre><div class="flex between"><span class="fieldvalue">模拟并发保存冲突</span><button class="btn small" data-act="toggle-conflict">${s.saveConflict?'关闭场景':'启用场景'}</button></div>${note('结构化粒度和关系角色属于提案；没有对应真实后端写入。')}</div>`,`<button class="btn danger" data-act="reset">重置演示</button><button class="btn primary" data-act="export">导出 JSON</button>`)}
function openContext(name){const details={'数据接入':'数据源拥有连接与授权目录；源表可先逆向导入 ODS，再结合业务过程准备模型。','数据源':'来源：Retail ERP · MYSQL · sales。目录仅展示结构；读取时刻与权限由来源提供方负责。当前页面为演示投影。','数据标准':'Semantic 拥有域、过程、标准字段、单位、口径及分层。建模保存稳定 ID 引用，不复制标准定义。','业务过程':'交易域 / 订单交易（演示 processId: 101）。来源主表 orders、明细 order_items；真实域与过程由 Semantic 维护。','数据开发':'数据开发拥有加工定义、发布和运行。建模传递精确物理设计版本与待办，任务保存和运行由目标域裁决。','资产治理':'Asset 聚合治理上下文，Modeling 仍拥有模型结构。登记血缘需要原合同中的用户确认。','数据消费':'实际分析通过 Dataset / Data Service 的受治理契约完成；模型设计和指标定义本身不代表数据运行结果。'};openDialog(`跨模块上下文 · ${name}`,`<div class="stack"><p class="fieldvalue">${details[name]||details['数据标准']}</p>${note('独立原型没有真实对象 deep-link。正式页面携带稳定 ID 与项目上下文，目标页重新核验权限并提供回链。')}</div>`)}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast(`已导出 ${name}`)}
// Interaction dispatcher: all mutations are local to this throwaway prototype.
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act,id=el.dataset.id;
switch(act){
 case 'close':closeDialog();break;
 case 'wh-impact':whImpact(whModel('fact-order'));break;
 case 'tab':goTab(el.dataset.tab);break;
 case 'workspace':s.view='editor';s.matrixOpen=true;render();break;
 case 'home':s.view='home';render();break;
 case 'review':goTab('review');break;
 case 'physical':goTab('physical');break;
 case 'select':s.selected=id;render();break;
 case 'graph':s.graphMode=el.dataset.mode;render();break;
 case 'save':save();break;
 case 'grain':openGrain();break;
 case 'grain-apply':{const value=document.getElementById('grain-edit').value.trim();if(!value){toast('请填写业务粒度');break}remember();s.grain=value;s.mode=document.getElementById('mode-edit').value;mark();closeDialog();render();toast('粒度声明已带入逻辑草稿');break}
 case 'fact-mode':remember();s.mode=el.dataset.mode;mark();render();break;

  return [...m.dimensions.map(id=>{const f=candidates.find(f=>f.id===id);return {...whField(id,f?.name||id,f?.type||'STRING'),stdFieldId:f?.stdFieldId||null,source:parents.find(p=>modelFields(p).some(f=>f.id===id))?.code+'.'+id,role:'分组维度'}}),...m.measures.filter(f=>f.included).map(f=>{const src=candidates.find(c=>c.id===f.id);return {...whField(f.output,f.name,f.func.startsWith('COUNT')?'LONG':src?.type||'DECIMAL'),stdFieldId:f.func.startsWith('COUNT')?null:src?.stdFieldId||null,source:parents.find(p=>modelFields(p).some(c=>c.id===f.id))?.code+'.'+f.id,role:'度量',func:f.func}})];
 }
 const fields=clone(m.fields||[]).filter(f=>f.included);
 if(m.layer==='DIM'&&m.scd==='SCD2')for(const [id,name,type] of [['start_time','生效时间','TIMESTAMP'],['end_time','失效时间','TIMESTAMP'],['is_current','当前标记','INTEGER']])if(!fields.some(f=>f.id===id))fields.push({...whField(id,name,type),role:'历史约定',technical:true});

function whStructure(m){const fields=modelFields(m),dialect=m.dialect||'MYSQL';return {modelId:m.id,modelCode:m.code,layerCode:m.layer,tableName:m.tableName||m.code,target:m.target,dialect,fields:fields.map(({source,func,transform,transformProposal,role,included,...f})=>({...f,physicalType:whType(f.type,dialect)})),primaryKey:m.layer==='DWS'?clone(m.dimensions):m.layer==='ADS'?[]:m.layer==='DIM'?[m.surrogateKey]:(m.keys||[]),indexes:clone(m.indexes||[]),partition:clone(m.partition||null)}}
function whType(type,dialect){const types={MYSQL:{STRING:'VARCHAR(128)',INTEGER:'INT',LONG:'BIGINT',DECIMAL:'DECIMAL(18,2)',DATE:'DATE',TIMESTAMP:'DATETIME'},POSTGRESQL:{STRING:'VARCHAR(128)',INTEGER:'INTEGER',LONG:'BIGINT',DECIMAL:'NUMERIC(18,2)',DATE:'DATE',TIMESTAMP:'TIMESTAMP'}};return types[dialect]?.[type]||'VARCHAR(128)'}

function whFiltered(){return wh().models.filter(m=>(wh().layerFilter==='ALL'||m.layer===wh().layerFilter)&&(wh().processFilter==='all'||m.process===wh().processFilter||m.process==='shared')&&(`${m.name} ${m.code} ${layerNames[m.layer]}`.toLowerCase().includes(wh().query.toLowerCase())))}

function whTabs(m){return `<div class="tabs">${[['design',{ODS:'来源确认',DIM:'维度设计',DWD:'事实设计',DWS:'聚合设计',ADS:'应用设计'}[m.layer],'cube'],['sources','来源与标准','link'],['physical','物理结构','table'],['delivery','检查与交付','shield']].map(([id,name,ico])=>`<button class="tab ${wh().tab===id?'active':''}" data-wh="tab" data-tab="${id}">${icon(ico)}${name}</button>`).join('')}</div>`}
function whSide(m){const refs=whReferences(m),consumers=whConsumers(m.id),version=modelVersion(m);return `<aside class="wh-side"><div class="card"><h3>设计上下文</h3><span class="fieldlabel">设计版本</span><div class="flex" style="margin:7px 0 13px">${pill(whLabel(m),version?'green':'orange')}${version?'<button class="textbtn" data-wh="versions">查看版本</button>':''}</div><span class="fieldlabel">上游与共享引用</span>${refs.map(r=>`<div class="wh-ref"><button class="textbtn" data-wh="open" data-id="${r.id}">${esc(r.name)}</button><p>${r.layer} · ${modelVersion(r)?'v'+modelVersion(r):'未发布'} · ${esc(r.code)}</p></div>`).join('')||`<p class="tiny muted" style="margin:8px 0">${m.layer==='ODS'?'外部来源 / Retail ERP':m.layer==='DIM'?'日历生成规则由数据开发实现':'尚未选择上游'}</p>`}<button class="textbtn" data-wh="impact" data-id="${m.id}">查看完整依赖与影响 ${icon('arrow')}</button></div><div class="card"><h3>数据流通</h3><div class="stack"><div><span class="fieldlabel">标准与分层</span><p class="fieldvalue">引用 Semantic 的标准字段与分层配置。</p><button class="textbtn" data-act="context" data-context="数据标准">查看数据标准上下文</button></div><div><span class="fieldlabel">下游声明</span><p class="fieldvalue">${consumers.length} 个直接模型引用，${whAffected(m.id).length} 个可能受影响的下游。</p></div><div><span class="fieldlabel">部署与运行</span><p class="fieldvalue">待部署核对 · 暂无运行证据</p></div></div></div></aside>`}
function whOdsDesign(m){const fresh=whSourceColumns(m),known=modelFields(m).filter(f=>!f.technical),diff=whOdsDiff(m);return `<div class="card wh-cardbody">${sectionTitle('先确认来源，再确认目标结构','ODS 保留来源含义；清洗与业务重组在后续层完成。',`<button class="btn small" data-wh="source-evidence">核对当前来源</button>`)}<div class="wh-grainform"><div class="formfield"><label>来源数据源</label><input value="Retail ERP / MYSQL" readonly></div><div class="formfield"><label>来源定位</label><input value="sales.${esc(m.sourceTable)}" readonly></div><div class="formfield"><label>目标层 / 目标库</label><input value="ODS / ${esc(m.target)}" readonly></div><div class="formfield"><label>来源目录状态</label><select data-wh-input="provider">${[['READY','可读取（演示）'],['UNAVAILABLE','暂时不可用'],['FORBIDDEN','无权读取']].map(([v,n])=>`<option value="${v}" ${m.provider===v?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="wh-selectedgrain">来源记录粒度：${esc(m.grain)} · 字段选择与映射确认后再保存；导入结构不会创建接入任务。</div>${m.provider==='READY'?`<div class="flex between" style="margin-bottom:12px">${pill(`${fresh.length} 个当前来源字段`,'blue')}${pill(diff.length?`${diff.length} 个来源结构差异`:'当前演示结构一致',diff.length?'orange':'green')}</div>`:note(m.provider==='FORBIDDEN'?'无权读取当前目录。已保存的设计仍可查看，不能判断源结构现在是否一致。':'来源目录暂时不可用。保留现有结构与映射，稍后重试。','warn')}<div class="tablewrap"><table class="gridtable"><thead><tr><th>目标字段</th><th>业务名称</th><th>来源字段</th><th>逻辑类型</th><th>标准</th></tr></thead><tbody>${known.map(f=>`<tr><td class="mono">${esc(f.id)}</td><td>${esc(f.name)}</td><td class="mono">${esc(f.source)}</td><td>${esc(f.type)}</td><td>${f.stdFieldId?pill('已关联','green'):pill('待关联','orange')}</td></tr>`).join('')}</tbody></table></div><div class="wh-bottom"><span>结构、来源定位、已确认单列映射使用 ODS 专用命令保存。</span><button class="btn small" data-wh="ods-confirm">预览并确认导入映射</button></div></div>`}
function whDimDesign(m){const fixed=m.scd==='固定日历';return `<div class="card wh-cardbody">${sectionTitle('明确维度的身份和历史含义','同一个维度模型可以被多个业务过程复用。')}<div class="wh-grainform"><div class="formfield"><label>业务键</label><select data-wh-input="businessKey">${m.fields.map(f=>`<option value="${f.id}" ${m.businessKey===f.id?'selected':''}>${f.id} · ${f.name}</option>`).join('')}</select></div><div class="formfield"><label>代理键</label><select data-wh-input="surrogateKey">${m.fields.map(f=>`<option value="${f.id}" ${m.surrogateKey===f.id?'selected':''}>${f.id} · ${f.name}</option>`).join('')}</select></div><div class="formfield wide"><label>属性历史策略</label><div class="wh-tags">${(fixed?['固定日历']:['SCD1','SCD2']).map(v=>`<label><input type="radio" name="dim-scd" data-wh-input="scd" value="${v}" ${m.scd===v?'checked':''}>${v} · ${v==='SCD1'?'覆盖更新':v==='SCD2'?'保留属性历史':'使用统一日历'}</label>`).join('')}</div></div></div><div class="wh-selectedgrain">${m.scd==='SCD2'?'一行代表一个维度成员在一个有效时间区间内的属性版本。':fixed?'一行代表一个自然日期。':'一行代表一个维度成员的当前属性。'}</div>${sectionTitle('属性与历史跟踪','历史跟踪的勾选属于设计提案；当前派生接口只承载 SCD 类型和结构约定。',`<button class="btn small" data-wh="add-field">添加属性</button>`)}<div class="tablewrap"><table class="gridtable"><thead><tr><th>属性</th><th>业务名称</th><th>类型</th><th>键角色</th><th>跟踪历史</th></tr></thead><tbody>${m.fields.map(f=>`<tr><td class="mono">${esc(f.id)}</td><td><input aria-label="${esc(f.id)} 业务名称" data-wh-input="attribute-name" data-id="${f.id}" value="${esc(f.name)}" class="wh-editable-code"></td><td><select aria-label="${esc(f.id)} 逻辑类型" data-wh-input="attribute-type" data-id="${f.id}">${['STRING','INTEGER','LONG','DECIMAL','DATE','TIMESTAMP'].map(v=>`<option ${f.type===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${f.id===m.businessKey?pill('业务键'):f.id===m.surrogateKey?pill('代理键','blue'):'属性'}</td><td><input type="checkbox" aria-label="跟踪 ${esc(f.name)} 历史" data-wh-input="track" data-id="${f.id}" ${m.tracked.includes(f.id)?'checked':''} ${m.scd!=='SCD2'||[m.businessKey,m.surrogateKey].includes(f.id)?'disabled':''}></td></tr>`).join('')}</tbody></table></div>${m.scd==='SCD2'?`<div class="wh-ref"><strong class="tiny">物理结构会补充历史约定列</strong><div class="wh-tags" style="margin:9px 0">${['start_time','end_time','is_current'].map(x=>`<span class="pill mono">${x}</span>`).join('')}</div><p>生效 / 失效时间与当前标记仅构成结构设计。代理键生成、区间不重叠、事件时间查找和迟到成员处理交给数据开发。</p></div>`:note(fixed?'日历的生成范围、节假日与财年规则由业务确认后交给数据开发。':'SCD1 会覆盖旧属性，历史报表将看到当前属性；请确认这符合业务需求。')}${note('业务键、跟踪属性与未知成员规则需要 Modeling 最小元数据补充。原型可交互，但不会写入已有接口的隐藏描述或标签。')}<div class="wh-bottom"><span>当前有 ${whConsumers(m.id).length} 个模型声明引用此维度。</span><button class="btn small" data-wh="impact" data-id="${m.id}">检查变更影响</button></div></div>`}
function whCandidateFields(m){return m.upstream.map(whModel).filter(Boolean).flatMap(p=>modelFields(p).map(f=>({...f,parent:p.id,parentCode:p.code}))).filter(f=>!f.technical).filter((f,i,a)=>a.findIndex(x=>x.id===f.id)===i)}
function whAggregateDesign(m){const ads=m.layer==='ADS',candidates=whCandidateFields(m),dimensionCandidates=candidates.filter(f=>!['度量'].includes(f.role)&&!m.measures.some(x=>x.id===f.id));return `<div class="card wh-cardbody">${sectionTitle(ads?'从应用需要的结果反推设计':'声明新的汇总粒度',ads?'应用绑定复用已有 appCode / appName，不建立新的应用定义库。':'分组维度 + 统计周期 + 聚合口径，共同决定每行的含义。',`<button class="btn small" data-wh="upstreams">选择上游模型</button>`)}${ads?`<div class="wh-grainform"><div class="formfield"><label>应用编码</label><input data-wh-input="appCode" value="${esc(m.appCode)}"></div><div class="formfield"><label>应用名称</label><input data-wh-input="appName" value="${esc(m.appName)}"></div><div class="formfield wide"><label>应用分析目标</label><textarea data-wh-input="appGoal">${esc(m.appGoal)}</textarea></div><div class="formfield wide"><label>上游数据层</label><div class="wh-tags">${['DWS','DWD'].map(l=>`<label><input type="radio" name="ads-upstream" data-wh-input="upstreamLayer" value="${l}" ${m.upstreamLayer===l?'checked':''}>${l} · ${l==='DWS'?'复用公共汇总':'使用明细事实'}</label>`).join('')}</div></div></div>`:''}<div class="wh-ref"><span class="fieldlabel">已选上游</span><div class="wh-tags" style="margin-top:8px">${m.upstream.map(whModel).filter(Boolean).map(p=>`<button class="textbtn" data-wh="open" data-id="${p.id}">${p.layer} / ${esc(p.name)} · ${modelVersion(p)?'v'+modelVersion(p):'未发布'}</button>`).join('')||'<span class="muted">尚未选择</span>'}</div></div><div class="wh-grainform"><div class="formfield"><label>统计周期</label><select data-wh-input="period">${[['1h','小时'],['1d','自然日'],['1w','自然周'],['1m','自然月'],['ALL','全部期间']].map(([v,n])=>`<option value="${v}" ${m.period===v?'selected':''}>${n} / ${v}</option>`).join('')}</select></div><div class="formfield"><label>日期分组方式</label><select data-wh-input="dateBucket"><option value="PERIOD" ${m.dateBucket!=='DAY'?'selected':''}>按周期起始日期键分组</option><option value="DAY" ${m.dateBucket==='DAY'?'selected':''}>保留明细日期（按日分组）</option></select></div></div><div style="margin-top:18px">${sectionTitle('选择分组维度','取消一个维度会改变结果粒度；不是简单隐藏展示列。')}<div class="wh-tags">${dimensionCandidates.map(f=>`<label><input type="checkbox" data-wh-input="dimension" data-id="${f.id}" ${m.dimensions.includes(f.id)?'checked':''}>${esc(f.name)} <span class="mono muted">${esc(f.id)}</span></label>`).join('')||'<span class="muted tiny">请先选择上游模型</span>'}</div></div><div class="wh-selectedgrain">一行代表：${whGrain(m)}<br><span class="tiny muted">${ads?'ADS 默认不设主键；分组是查询设计，不等于数据唯一性验证。':'DWS 的默认主键由全部分组维度组成；无维度时只给出提醒。'}</span></div>${sectionTitle('度量与聚合函数','选择字段含义匹配的函数；比率与去重计数需要单独核对。',`<button class="btn small" data-wh="add-measure">添加度量</button>`)}<div class="wh-fieldrow tiny muted"><span>选</span><span>来源度量</span><span>聚合</span><span>结果字段</span></div>${m.measures.map((f,i)=>`<div class="wh-fieldrow"><input type="checkbox" aria-label="纳入 ${esc(f.name)}" data-wh-input="measure-included" data-index="${i}" ${f.included?'checked':''}><div><strong class="tiny">${esc(f.name)}</strong><div class="mono muted">${esc(f.id)}</div></div><select aria-label="${esc(f.name)} 聚合函数" data-wh-input="measure-func" data-index="${i}">${['SUM','COUNT','COUNT_DISTINCT','MAX','MIN','AVG'].map(v=>`<option ${f.func===v?'selected':''}>${v}</option>`).join('')}</select><input type="text" aria-label="${esc(f.name)} 结果字段名" data-wh-input="measure-output" data-index="${i}" value="${esc(f.output)}"></div>`).join('')}${ads&&m.upstreamLayer==='DWS'?note('SUM 仅适用于可加总度量且分组不会造成重复。订单去重计数、比率和均值通常不能从已汇总结果直接再求和；需要回到明细或引用指标口径。','warn'):note('多上游表不默认 UNION 或 JOIN。连接粒度、键和连接前后行数需要在数据开发确认。')}<div class="wh-bottom"><span>字段角色、聚合函数与周期复用现有派生合同。</span><button class="btn primary small" data-wh="preview">预览${ads?'应用':'汇总'}结构</button></div></div>`}
function whGrain(m){const dateBucket=m.dateBucket!=='DAY',names=m.dimensions.filter(id=>!(dateBucket&&id==='order_date_key')).map(id=>whCandidateFields(m).find(f=>f.id===id)?.name||id);return esc(({ '1h':'每小时','1d':'每日','1w':'每周','1m':'每月',ALL:'全部期间'}[m.period]||m.period)+' × '+(names.join(' × ')||'全局汇总')+(dateBucket&&m.dimensions.includes('order_date_key')?'（日期按周期起始日分桶）':''))}
function whFactDesign(m){return `<div class="card wh-cardbody">${sectionTitle('明确事实的业务粒度','这个模型是独立物理表；可复用已有 ODS 与 DIM。',`<button class="btn small" data-wh="upstreams">选择 ODS 上游</button>`)}<div class="formfield"><label>一行代表什么？</label><textarea data-wh-input="grain">${esc(m.grain||'')}</textarea></div><div class="formfield" style="margin:15px 0"><label>事实模式</label><select data-wh-input="factMode">${['事务事实','周期快照','累积快照','无事实事实'].map(v=>`<option ${m.factMode===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="wh-selectedgrain">业务识别字段：${esc((m.keys||[]).join(' + ')||'待声明')}。主键声明不能证明源数据唯一。</div>${sectionTitle('字段与度量','先选符合粒度的字段，再建立标准关联。',`<button class="btn small" data-wh="add-field">添加字段</button>`)}<div class="tablewrap"><table class="gridtable"><thead><tr><th>字段</th><th>名称</th><th>类型</th><th>角色</th><th>业务识别</th></tr></thead><tbody>${m.fields.map(f=>`<tr><td class="mono">${esc(f.id)}</td><td>${esc(f.name)}</td><td>${f.type}</td><td><select data-wh-input="fact-role" data-id="${f.id}">${['属性','业务标识','维度引用','度量','退化维度'].map(v=>`<option ${f.role===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input type="checkbox" aria-label="${esc(f.name)} 作为业务识别" data-wh-input="fact-key" data-id="${f.id}" ${(m.keys||[]).includes(f.id)?'checked':''}></td></tr>`).join('')}</tbody></table></div>${note('结构化粒度、角色、可加性与关系需要最小契约补充。完整星型画布体验可从订单明细事实样例进入。')}<button class="textbtn" data-wh="open" data-id="fact-order">打开订单星型设计</button></div>`}
function whSources(m){const fields=modelFields(m),unbound=fields.filter(f=>!f.technical&&!f.stdFieldId).length;return `<div class="card wh-cardbody">${sectionTitle('来源和标准逐字段对齐',m.layer==='ODS'?'来源定位由 ODS 导入命令保存。':m.layer==='DWS'||m.layer==='ADS'?'上游是模型；字段来源由分层映射承载，不能塞入数据源单列映射。':'物理字段映射与标准引用各有自己的保存命令。')}<div class="flex between" style="margin-bottom:15px">${pill(`${fields.length} 个字段`,'blue')}${pill(`${unbound} 个业务字段待标准核对`,unbound?'orange':'green')}</div><div class="tablewrap"><table class="gridtable"><thead><tr><th>目标字段 / 含义</th><th>当前来源设计</th><th>转换 / 聚合</th><th>标准字段引用</th><th>操作</th></tr></thead><tbody>${fields.map(f=>`<tr><td><span class="mono">${esc(f.id)}</span><div class="tiny muted">${esc(f.name)}</div></td><td class="mono">${f.technical?'结构约定，由开发填充':esc(f.source||'尚未确认')}</td><td>${esc(f.func||f.transformProposal||f.transform||'—')}</td><td>${f.technical?'不计入业务治理':f.stdFieldId?pill('STD #'+f.stdFieldId,'green'):pill('待关联','orange')}</td><td>${!f.technical?`<div class="stack" style="gap:5px"><button class="textbtn" data-wh="standard" data-id="${f.id}">核对标准</button>${m.layer!=='ODS'?`<button class="textbtn" data-wh="field-source" data-id="${f.id}">选择来源</button>`:''}</div>`:''}</td></tr>`).join('')}</tbody></table></div>${note('标准展示与覆盖基于当前引用，不是历史标准快照，也不作为新增发布门禁。标准定义回到 Semantic 修改。')}<div class="wh-bottom"><span>保存映射不会发布结构；修改标准后仍需保存结构。</span><button class="btn small" data-wh="save-sources">保存${['DWS','ADS'].includes(m.layer)?'分层':'来源'}映射草稿</button></div></div>`}
function whPhysical(m){const fields=modelFields(m),struct=whStructure(m);return `<div class="card wh-cardbody">${sectionTitle('一张表，一个物理模型','全量结构替换，保留字段、主键、索引、分区与标准引用。',`<button class="btn small" data-wh="structure-options">键 / 索引 / 分区</button>`)}<div class="wh-grainform"><div class="formfield"><label>落地表名（与稳定模型编码分开）</label><input data-wh-input="tableName" value="${esc(m.tableName||m.code)}"></div><div class="formfield"><label>目标分层 / 库</label><input readonly value="${m.layer} / ${esc(m.target)}"></div><div class="formfield"><label>目标方言</label><select data-wh-input="dialect">${['MYSQL','POSTGRESQL'].map(v=>`<option ${m.dialect===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="formfield"><label>当前主键</label><input readonly value="${esc(struct.primaryKey.join(' + ')||'未设置')}"></div></div><div class="flex between" style="margin:19px 0 12px">${pill(`${fields.length} 个落地字段`,'blue')}<span class="tiny muted">类型目录在正式实现中由后端提供</span></div><div class="tablewrap"><table class="gridtable"><thead><tr><th>字段名</th><th>业务含义</th><th>物理类型</th><th>键 / 属性</th><th>标准</th></tr></thead><tbody>${struct.fields.map(f=>`<tr><td class="mono">${esc(f.id)}</td><td>${esc(f.name)}</td><td class="mono">${f.physicalType}</td><td>${struct.primaryKey.includes(f.id)?pill('主键','blue'):pill(f.technical?'约定列':f.role||'属性')}</td><td>${f.stdFieldId?'#'+f.stdFieldId:'—'}</td></tr>`).join('')}</tbody></table></div><div class="wh-bottom"><span>${m.saved?'上次保存结构已保留，后续编辑不会修改它。':'物理结构尚未模拟保存。'}</span><div class="wh-controls"><button class="btn small" data-wh="ddl">查看已保存 DDL</button><button class="btn primary small" data-wh="save">保存结构草稿</button></div></div></div>`}
function whChecks(m){const fields=modelFields(m),checks=[];if(['DWS','ADS'].includes(m.layer)){if(m.period!=='1d'&&m.period!=='ALL'&&m.dimensions.includes('order_date_key')&&m.dateBucket==='DAY')checks.push({level:'warn',title:'声明周期与日期分组不一致',text:'当前仍按明细日期分组，不能称为完整周/月汇总；确认日期分桶。'});if(m.dimensions.includes('order_date_key')&&m.dateBucket!=='DAY')checks.push({level:'todo',title:'周期日期转换需要加工实现',text:'按所选周期生成起始日期键；确认时区、周起点与截点。周期配置不代表 SQL 已完成。'});const ranks={ '1h':1,'1d':2,'1w':3,'1m':4,ALL:5 };if(m.layer==='ADS'&&m.upstreamLayer==='DWS'&&m.upstream.map(whModel).some(p=>p&&ranks[p.period]>ranks[m.period]))checks.push({level:'warn',title:'上游周期比应用需要的周期更粗',text:'汇总数据无法还原更细周期，请换用更细的 DWS 或 DWD。'});} const add=(level,title,text)=>checks.push({level,title,text});if(!fields.length)add('error','没有可落地字段','至少保留一个字段。');if(!/^[a-z][a-z0-9_]*$/i.test(m.tableName||m.code))add('error','落地表名不合法','演示标识符仅使用字母、数字和下划线。');const ids=fields.map(f=>f.id.toLowerCase());if(new Set(ids).size!==ids.length)add('error','结果字段名称重复','各结果列需要独立且合法的名称。');if(fields.some(f=>!/^[a-z][a-z0-9_]*$/i.test(f.id)))add('error','字段名称不合法','请检查结果字段名称。');if(m.layer==='DIM'&&(!m.fields.some(f=>f.id===m.businessKey)||!m.fields.some(f=>f.id===m.surrogateKey)))add('error','维度键引用不存在','业务键与代理键必须在当前字段中。');if(m.layer==='DWS'||m.layer==='ADS'){
 if(!m.upstream.length)add('error','尚未选择上游模型','先选择模型，再核对候选字段。');const sourceIds=whCandidateFields(m).map(f=>f.id);if([...m.dimensions,...m.measures.filter(f=>f.included).map(f=>f.id)].some(id=>!sourceIds.includes(id)))add('error','结果字段不属于当前上游','切换上游后需要重新确认字段。');if(!m.dimensions.length)add('warn','全局汇总没有分组维度','确认结果是否只有每周期一行；DWS 不设主键。');if(m.upstream.length>1)add('warn','多上游加工待设计','需明确连接键、基数、重复处理和指标口径，不能默认拼接。');if(m.measures.some(f=>f.included&&['SUM','AVG'].includes(f.func)&&!['DECIMAL','INTEGER','LONG'].includes(whCandidateFields(m).find(c=>c.id===f.id)?.type)))add('warn','聚合函数与来源类型需核对','SUM/AVG 应用于非数值或未知类型字段时，应重新选择来源和口径。');if(m.measures.some(f=>f.included&&f.func==='AVG'))add('warn','均值的再次汇总需要分子与分母','平均值不能简单再次取平均得到正确总口径。');if(m.layer==='ADS'&&(!m.appCode.trim()||!m.appName.trim()))add('warn','应用绑定待确认','应用编码和名称应关联实际应用需求。');if(m.layer==='ADS'&&m.upstreamLayer==='DWS'&&m.measures.some(f=>f.included&&/count|rate|avg/i.test(f.id)&&f.func==='SUM'))add('warn','去重计数 / 比率重聚合风险','商品或渠道去重订单数存在交叉，跨组 SUM 会重复计算；改用明细或在指标模块确认口径。');
 }
 const missing=fields.filter(f=>!f.technical&&!f.stdFieldId).length;if(missing)add('warn',`${missing} 个业务字段待标准核对`,'标准缺口是提醒，不新增发布硬门禁。');if(m.layer==='ODS'&&m.provider!=='READY')add('warn','当前来源无法核对',m.provider==='FORBIDDEN'?'来源目录无权读取。':'来源目录暂时不可用。');if(m.layer==='ODS'&&whOdsDiff(m).length&&m.provider==='READY')add('warn','当前来源与模型存在结构差异','只提示变化，不自动修改已保存结构或发布版本。');if(m.layer==='DIM'&&m.scd==='SCD2')add('todo','SCD2 历史加工仍待开发','确定属性变化、有效区间、代理键生成与事实查找。');if(m.layer==='DWD')add('todo','事实与维度连接待数据验证','确认明细唯一性、关联不扩行、金额对账与迟到维度。');if(m.upstream?.some(id=>!modelVersion(whModel(id))))add('warn','存在尚未发布的上游设计','当前来源是设计上下文；版本未知时不能声称精确历史依赖。');const drift=whVersionDrift(m);if(drift.length)add('warn','上游设计版本已有变化',drift.map(r=>whModel(r.id)?.name+`：v${r.version||'未知'} → v${modelVersion(whModel(r.id))||'未知'}`).join('；')+'。当前草稿不会自动改动。');add('todo','部署与运行证据待核对','设计发布不代表建表、接入、加工或数据验证已完成。');return checks}
function whDelivery(m){const checks=whChecks(m);return `<div class="card wh-cardbody">${sectionTitle('检查设计，交付精确结构版本','保存、设计发布、物理部署与任务运行分别表达。',`<button class="btn small" data-wh="check">重新检查</button>`)}<div class="flex" style="margin-bottom:15px">${pill(checks.filter(c=>c.level==='error').length+' 个结构错误',checks.some(c=>c.level==='error')?'red':'green')}${pill(checks.filter(c=>c.level==='warn').length+' 个设计提醒','orange')}${pill(checks.filter(c=>c.level==='todo').length+' 个交付待办')}</div>${checks.map(c=>`<div class="wh-check"><span class="dot" style="color:${c.level==='error'?'var(--red)':c.level==='warn'?'var(--orange)':'#9aabc3'}"></span><div class="spacer"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>${pill({error:'结构错误',warn:'提醒',todo:'开发待办'}[c.level],c.level==='error'?'red':c.level==='warn'?'orange':'')}</div>`).join('')}<div class="wh-ref" style="margin-top:18px"><strong class="tiny">当前可交付内容</strong><p>已保存物理结构 / 不可变设计版本 / 当前来源与标准上下文 / 加工待办。当前映射没有历史快照，不能作为历史来源证明。</p></div><div class="wh-bottom"><span>${modelVersion(m)?'当前精确设计版本 v'+modelVersion(m):'模型尚未发布设计版本'}</span><div class="wh-controls"><button class="btn small" data-wh="versions">版本与比较</button><button class="btn primary small" data-wh="handoff">查看交接单</button></div></div></div>`}
function whEditor(){const m=whModel();return whHeader(m)+whTabs(m)+`<div class="content"><div class="wh-editor"><div class="wh-main-shell">${wh().tab==='design'?({ODS:whOdsDesign,DIM:whDimDesign,DWD:whFactDesign,DWS:whAggregateDesign,ADS:whAggregateDesign}[m.layer])(m):wh().tab==='sources'?whSources(m):wh().tab==='physical'?whPhysical(m):whDelivery(m)}</div>${whSide(m)}</div>${whStateMini()}</div>`}
function whSourceColumns(m){const fields=clone(sourceCatalog.find(t=>t.table===m.sourceTable)?.fields||[]);if(m.sourceDrift){fields.push(['coupon_code','优惠券编码','STRING']);if(fields[0])fields[0][2]='LONG'}return fields}
function whOdsDiff(m){if(m.provider!=='READY')return [];const src=whSourceColumns(m),fields=modelFields(m),diff=[];for(const [id,name,type] of src){const known=fields.find(f=>f.id===id);if(!known)diff.push({kind:'新增来源字段',id,current:type});else if(known.type!==type)diff.push({kind:'来源类型变化',id,saved:known.type,current:type})}for(const f of fields)if(!f.technical&&!src.some(src=>src[0]===f.id))diff.push({kind:'来源字段缺失',id:f.id,saved:f.type});return diff}
