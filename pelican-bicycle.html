<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · SVG 2D 动画</title>
<style>
  html, body { margin: 0; height: 100%; display: grid; place-items: center; background: #0e1420; }
  svg { width: min(96vw, 1100px); height: auto; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }

  /* 统一以自身几何中心旋转 */
  .spin { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 曲柄反向转，让脚看起来在蹬 */
  .crank { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite reverse; }

  /* 整车上下颠 */
  .rider { animation: bob .4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }

  /* 翅膀扑动 */
  .wing { transform-box: fill-box; transform-origin: 85% 15%; animation: flap .8s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(14deg); } }

  /* 腿蹬踏：绕髋部摆动 */
  .leg-a { transform-box: fill-box; transform-origin: 50% 8%; animation: pedal .8s ease-in-out infinite; }
  .leg-b { transform-box: fill-box; transform-origin: 50% 8%; animation: pedal .8s ease-in-out infinite .4s; }
  @keyframes pedal { 0%,100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }

  /* 喙囊随风鼓动 */
  .pouch { transform-box: fill-box; transform-origin: center top; animation: pouch .8s ease-in-out infinite; }
  @keyframes pouch { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.25); } }

  /* 云与地面反向移动 */
  .cloud-a { animation: drift 14s linear infinite; }
  .cloud-b { animation: drift 22s linear infinite; }
  @keyframes drift { from { transform: translateX(1150px); } to { transform: translateX(-250px); } }
  .dash { animation: slide .5s linear infinite; }
  @keyframes slide { to { transform: translateX(-140px); } }

  /* 围巾飘 */
  .scarf { transform-box: fill-box; transform-origin: 0 50%; animation: wave .6s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(4deg) skewX(0); } to { transform: rotate(-10deg) skewX(8deg); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<svg viewBox="0 0 1100 620" role="img" aria-label="一只鹈鹕骑着自行车的卡通动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed7f2"/><stop offset=".7" stop-color="#e8f7c8"/><stop offset="1" stop-color="#fdf6d8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6472"/><stop offset="1" stop-color="#3c434e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1100" height="620" fill="url(#sky)"/>
  <circle cx="920" cy="110" r="58" fill="#ffd75e"/>
  <circle cx="920" cy="110" r="72" fill="#ffd75e" opacity=".25"/>
  <g fill="#fff" opacity=".9">
    <g class="cloud-a"><ellipse cx="0" cy="120" rx="70" ry="24"/><ellipse cx="55" cy="108" rx="46" ry="20"/></g>
    <g class="cloud-b"><ellipse cx="0" cy="200" rx="52" ry="18"/><ellipse cx="42" cy="192" rx="34" ry="14"/></g>
  </g>
  <!-- 远山 -->
  <path d="M-20 470 L180 330 L360 470 Z" fill="#bfe3b0"/>
  <path d="M240 470 L470 300 L700 470 Z" fill="#a5d69a"/>
  <rect y="470" width="1100" height="60" fill="#8fd07a"/>
  <!-- 马路 -->
  <rect y="530" width="1100" height="90" fill="url(#road)"/>
  <g class="dash" stroke="#f4e9b2" stroke-width="10" stroke-dasharray="70 70">
    <line x1="-140" y1="575" x2="1240" y2="575"/>
  </g>

  <!-- 骑手整体（车+鹈鹕） -->
  <g class="rider" transform="translate(0,0)">

    <!-- ===== 自行车 ===== -->
    <g stroke="#1d1f27" stroke-width="8" stroke-linecap="round" fill="none">
      <!-- 后轮 -->
      <g>
        <circle class="spin" cx="330" cy="470" r="86" stroke="#1d1f27" stroke-width="10" fill="#dfe6ee"/>
        <g class="spin" transform="translate(330,470)">
          <g stroke="#8b95a5" stroke-width="5">
            <line x1="-70" y1="0" x2="70" y2="0"/><line x1="0" y1="-70" x2="0" y2="70"/>
            <line x1="-50" y1="-50" x2="50" y2="50"/><line x1="-50" y1="50" x2="50" y2="-50"/>
          </g>
        </g>
        <circle cx="330" cy="470" r="12" fill="#1d1f27"/>
      </g>
      <!-- 前轮 -->
      <g>
        <circle class="spin" cx="760" cy="470" r="86" stroke="#1d1f27" stroke-width="10" fill="#dfe6ee"/>
        <g class="spin" transform="translate(760,470)">
          <g stroke="#8b95a5" stroke-width="5">
            <line x1="-70" y1="0" x2="70" y2="0"/><line x1="0" y1="-70" x2="0" y2="70"/>
            <line x1="-50" y1="-50" x2="50" y2="50"/><line x1="-50" y1="50" x2="50" y2="-50"/>
          </g>
        </g>
        <circle cx="760" cy="470" r="12" fill="#1d1f27"/>
      </g>
      <!-- 车架 -->
      <path d="M330 470 L470 360 L640 360 L760 470" stroke="#e2574c"/>
      <path d="M330 470 L500 470 L470 360" stroke="#e2574c"/>
      <path d="M500 470 L640 360" stroke="#e2574c"/>
      <path d="M700 330 L760 470" stroke="#e2574c"/>
      <!-- 车座与把手 -->
      <path d="M448 352 L492 352" stroke="#1d1f27" stroke-width="14"/>
      <path d="M690 322 Q712 300 738 312" stroke="#1d1f27" stroke-width="10"/>
      <!-- 曲柄+脚踏 -->
      <g class="crank" transform="translate(500,470)">
        <line x1="-46" y1="0" x2="46" y2="0" stroke="#1d1f27" stroke-width="9"/>
        <rect x="-66" y="-8" width="34" height="12" rx="5" fill="#1d1f27" stroke="none"/>
        <rect x="34" y="-4" width="34" height="12" rx="5" fill="#1d1f27" stroke="none"/>
      </g>
      <circle cx="500" cy="470" r="16" fill="#1d1f27" stroke="none"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g>
      <!-- 腿（蹬踏） -->
      <g stroke="#f2a63b" stroke-width="13" stroke-linecap="round" fill="none">
        <path class="leg-a" d="M520 330 Q505 400 466 452"/>
        <path class="leg-b" d="M540 330 Q560 400 542 462"/>
      </g>
      <!-- 尾巴 -->
      <path d="M420 300 L368 286 L412 330 Z" fill="#c9d4de"/>
      <!-- 身体 -->
      <ellipse cx="510" cy="300" rx="105" ry="62" fill="#f4f7fa" stroke="#c9d4de" stroke-width="4"/>
      <!-- 翅膀（扑动） -->
      <g class="wing">
        <path d="M470 280 Q560 250 610 300 Q545 330 480 315 Z" fill="#dbe4ec" stroke="#b7c4d1" stroke-width="4"/>
        <path d="M500 296 Q550 288 588 302" stroke="#b7c4d1" stroke-width="3" fill="none"/>
      </g>
      <!-- 围巾 -->
      <g class="scarf">
        <path d="M590 236 Q540 226 476 246 L480 264 Q548 246 596 256 Z" fill="#4fa3e3" opacity=".95"/>
      </g>
      <path d="M586 238 Q610 250 600 272 L574 258 Z" fill="#3d84bd"/>
      <!-- 脖子 -->
      <path d="M585 262 Q612 210 640 188" stroke="#f4f7fa" stroke-width="30" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="656" cy="176" r="34" fill="#f4f7fa" stroke="#c9d4de" stroke-width="4"/>
      <!-- 大眼睛 -->
      <circle cx="664" cy="166" r="9" fill="#1d1f27"/>
      <circle cx="667" cy="163" r="3" fill="#fff"/>
      <!-- 头顶小冠羽 -->
      <path d="M640 148 Q648 128 664 140" stroke="#c9d4de" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- 大喙 + 喙囊 -->
      <g>
        <path d="M682 168 L800 178 Q806 184 796 190 L688 200 Z" fill="#f2a63b"/>
        <path class="pouch" d="M686 196 Q744 236 794 190 L686 200 Z" fill="#ffcf7a"/>
        <line x1="700" y1="176" x2="788" y2="182" stroke="#d9862a" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- 前景草 -->
  <g stroke="#5f9e4f" stroke-width="5" stroke-linecap="round">
    <path d="M60 600 L60 570 M74 600 L70 578 M46 600 L52 580"/>
    <path d="M980 600 L980 570 M994 600 L990 578 M966 600 L972 580"/>
  </g>
</svg>

</body>
</html>
