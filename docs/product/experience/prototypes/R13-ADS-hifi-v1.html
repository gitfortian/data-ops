" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7m-3.5-3.5v7"/></svg> 数据开发</a><a class="dim"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7m-3.5-3.5v7"/></svg> 指标与语义</a><a class="dim"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7m-3.5-3.5v7"/></svg> 数据治理</a><div class="navfooter"><span class="avatar">田</span><div>原型评审账号<div class="mini">设计模拟 · 不连接后端</div></div></div></aside><div class="mainarea"><header class="topbar"><div class="crumb">数据建模 <span> / </span> <b>交易域</b> / <b>订单下单</b> / <b>应用数据建模</b></div><div class="righttop"><span class="chip">◇ 当前项目：交易分析项目</span><span>◉ 帮助</span><span class="avatar">研</span></div></header><div class="wrap"><div id="app"></div><div class="footerhint">R13 ADS · 全新专项高保真 v1 · 交互评审候选 · 仅固定合成数据、无真实查询/模型发布/消费授权</div></div></div></div><div id="overlay"></div><script>
(()=>{'use strict';
const K='r13-ads-hifi-review-v1',steps=['应用目标','来源与粒度','输出与验证','指标与时效','审核发布','交付回读'];

const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const F=(title,key,values)=>`<label class="field"><span>${title}</span>${values?`<select data-field="${key}" ${S.readOnly?'disabled':''}>${values.map(([v,t])=>`<option value="${E(v)}" ${S[key]===v?'selected':''}>${E(t)}</option>`).join('')}</select>`:`<input type="text" data-field="${key}" value="${E(S[key])}" ${S.readOnly?'disabled':''}/>`}</label>`;
const N=(content,type='')=>`<div class="notice ${type}">${content}</div>`;
const Head=(t,d,extra='')=>`<div class="panelhead"><div><h2>${t}</h2><p>${d}</p></div>${extra}</div>`;

function headerStatus(){return `<span class="status ${S.published?'good':'neutral'}">${S.published?'设计 V1 已发布（模拟）':'应用设计草稿 · R'+S.revision}</span>`}
function evidenceTable(){return `<div class="tablewrap"><table><thead><tr><th>验证层</th><th>状态</th><th>证据范围</th></tr></thead><tbody><tr><td>V0 设计静态</td><td>${issues().length?'STATIC_BLOCKED':'STATIC_PASS'}</td><td>输出键、已发布来源与敏感字段</td></tr><tr><td>V1 授权样本</td><td>${E(vstatus())}</td><td>仅固定合成数据</td></tr><tr><td>V2 运行后核对</td><td>NOT_EXECUTED</td><td>无 Runtime/Service 消费凭证</td></tr></tbody></table></div>`}
function validationDetail(){const v=vstatus();if(v==='NOT_RUN')return N('<strong>输出尚未验证</strong>点击「验证输出」以固定合成数据对比全部地区与上海过滤后的数据，支持发现重复键和同范围指标差异。');if(v==='STALE')return N('<strong>输出验证已过期 · STALE</strong>来源、输出字段、过滤、指标引用或草稿 Revision 变化。原结果不可沿用，请重新验证。','warn');if(v==='UNAVAILABLE')return N('<strong>不可验证 · UNAVAILABLE</strong>未发布/无权/受限数据或明细来源不可使用 DWS 汇总样本验证，不返回模拟的敏感数值。','bad');const ref=S.validation||{};return `<div class="row" style="margin-bottom:11px"><div><div class="smallcap">固定合成数据 / 业务日 2026-10-17</div><h3 style="margin:3px 0;font-size:14px">${v==='SAMPLE_WARNING'?'输出存在待核对差异':'输出和参考口径可解释'}</h3></div><span class="status ${v==='SAMPLE_WARNING'?'warn':'good'}">${v}</span></div><div class="metric"><div class="metricbox"><span>上游全部地区</span><strong>3 <span style="font-size:12px">单</span></strong><span>示例金额 570</span></div><div class="metricbox"><span>ADS 当前过滤范围</span><strong>${ref.orders===null?'—':ref.orders}</strong><span>示例金额 ${ref.amount===null?'不可计算':ref.amount}</span></div><div class="metricbox ${v==='SAMPLE_WARNING'?'bad':''}"><span>差异解释</span><strong style="font-size:16px">${ref.orders===null?'不可比较':S.filter==='sh'?'按上海过滤':'同范围核对'}</strong><span>${E(ref.scope||'')}</span></div></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>业务日期</th><th>地区</th><th>订单数</th><th>示例金额</th><th>是否输出</th></tr></thead><tbody><tr><td>2026-10-17</td><td>上海</td><td>2</td><td>450</td><td>${S.filter==='all'?'是':'sh'===S.filter?'是':'未计算'}</td></tr><tr><td>2026-10-17</td><td>北京</td><td>1</td><td>120</td><td>${S.filter==='all'?'是':'否'}</td></tr></tbody></table></div>${N('<strong>结果解释</strong>'+E(ref.reason||'')+'。来源全范围和 ADS 过滤后的差异不能不考虑过滤条件。',v==='SAMPLE_WARNING'?'warn':'good')}`}
function section(){switch(S.step){
 case 0:return `<div class="panel">${Head('先定义应用目标','先明确谁要使用、解决什么问题，再选来源表')}<div class="panelbody"><div class="segmented" style="max-width:510px;margin-bottom:16px">${[['report','经营报表'],['dataset','数据集'],['api','数据 API']].map(([k,n])=>`<button data-act="app:${k}" class="${S.appType===k?'selected':''}">${n}</button>`).join('')}</div><div class="fieldrow">${F('应用编码','code')}${F('应用名称','name')}${F('业务负责人','owner')}${F('预期消费者','audience')}</div>${F('应用用途与问题','purpose')}${N('这是 ADS 模型设计需求，不会自动创建 Dataset、Service、API 或批准消费者访问。')}</div></div>`;
 case 1:return `<div class="panel">${Head('选择应用行粒度与来源','汇总默认 DWS；明细要显式改选 DWD',`<span class="status">${E(sourceName())}</span>`)}<div class="panelbody"><div class="cardgrid"><button class="choicecard ${S.source==='DWS'?'selected':''}" data-act="source:DWS" ${S.readOnly?'disabled':''}><span class="badge">推荐 · 已发布 V2</span><h3 style="margin-top:11px">经营汇总数据 · DWS</h3><p>一行 = 业务日 × 城市；保留订单数、金额等按日报表口径。</p><span class="mini">来源模型 #810</span></button><button class="choicecard ${S.source==='DWD'?'selected':''}" data-act="source:DWD" ${S.readOnly?'disabled':''}><span class="badge">明细需求显式选择</span><h3 style="margin-top:11px">订单明细数据 · DWD</h3><p>一行 = 订单明细行；稳定键 order_id + item_id，不能沿用汇总指标。</p><span class="mini">来源模型 #701</span></button></div>${N('<strong>粒度变化不可静默处理</strong>从日报切到订单行时，输出字段、唯一键、Metric 与过滤都要重审。原草稿可保留，但不能被新事实悄悄覆盖。','warn')}${S.scenario==='unpublished'?N('当前 DWS 未发布。只能保留需求草稿或回到 DWS 模型审阅；不得自动降级为 DWD。','bad'):''}<div class="actions">${B('继续配置输出字段','goto:2','primary')}</div></div></div>`;
 case 2:return `<div class="panel">${Head('配置输出字段并验证结果','从消费者角度核对输出键、投影、过滤和同口径指标',`<span class="status warn">固定合成样本</span>`)}<div class="panelbody"><div class="row"><div class="sectiontitle" style="margin:0">字段输出合同</div><span class="subtle">来自 ${E(sourceName())}</span></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>选用</th><th>来源字段</th><th>业务含义</th><th>物理类型</th><th>安全</th></tr></thead><tbody>${opts[S.source].map(([key,name,type,risk])=>`<tr><td><input type="checkbox" aria-label="输出 ${E(key)}" data-column="${key}" ${S.fields.includes(key)?'checked':''} ${S.readOnly?'disabled':''}/></td><td><b>${E(key)}</b></td><td>${name}</td><td>${type}</td><td>${risk==='受限'?'<span class="status bad">受限</span>':'普通'}</td></tr>`).join('')}</tbody></table></div><div class="fieldrow" style="margin-top:15px">${F('唯一输出业务键','key')}${F('样本过滤范围','filter',[['all','全部地区（无过滤）'],['sh','仅上海（city_id = SH）'],['custom','自定义过滤（尚未解析）']])}</div><div class="divider"></div><div class="row"><div><div class="sectiontitle" style="margin:0">验证应用输出</div><div class="subtle">用明确时间与过滤范围比较汇总结果、主键和敏感字段</div></div>${B('↻ 验证输出','validate','primary',S.readOnly)}</div><div style="margin-top:14px">${validationDetail()}</div></div></div>`;
 case 3:return `<div class="panel">${Head('指标口径、时效与安全预检','业务需求不等于真实作业、服务或消费者授权已经生效')}<div class="panelbody"><div class="fieldrow">${F('指标引用（只读候选）','metric',[['order_count_v4','订单量 · 已发布 Metric V4'],['paid_amount_v2','支付金额 · 已发布 Metric V2'],['none','无指标（必须另审业务含义）']])}${F('刷新时效目标','freshness',[['D+1','次日可用（目标）'],['H+1','每小时（目标）'],['T+5m','5 分钟（未承诺）']])}</div><label class="checkline"><input type="checkbox" data-check="metricConfirmed" ${S.metricConfirmed?'checked':''} ${S.readOnly?'disabled':''}/>业务负责人已核对正式 Metric 版本与输出字段用途</label><label class="checkline"><input type="checkbox" data-check="securityConfirmed" ${S.securityConfirmed?'checked':''} ${S.readOnly?'disabled':''}/>已审阅预期消费者、字段敏感级别及访问范围（不等于正式授权）</label>${S.scenario==='metricdrift'?N('<strong>指标版本已变化</strong>当前合同仍指向旧 Metric，不得自动使用新口径发布。请返回 Metric 原域核对。','bad'):''}${N('刷新 SLA 为需求，不是 Runtime 已完成或 Service 可用承诺。消费者 READ、字段级/行级授权必须由安全及数据服务原域真实授予。')}</div></div>`;
 case 4:{const ps=issues();return `<div class="panel">${Head('审核并发布应用设计','确认消费合同、指标引用与独立数据验证证据，不在此开通 API')}<div class="panelbody"><div class="cardgrid"><div class="choicecard"><div class="smallcap">应用 / 消费方</div><h3 style="margin-top:8px">${E(S.name)}</h3><p>${E(S.audience)} · ${E(S.appType)}</p></div><div class="choicecard"><div class="smallcap">冻结来源 / 输出合同</div><h3 style="margin-top:8px">${E(sourceName())}</h3><p>业务键 ${E(S.key)} · ${S.fields.length} 个输出字段</p></div></div><div class="sectiontitle">V0 / V1 / V2 证据</div>${evidenceTable()}${ps.length?N('<strong>尚有 '+ps.length+' 项阻断</strong><ol style="padding-left:20px;margin:7px 0 0">'+ps.map(x=>'<li>'+E(x)+'</li>').join('')+'</ol>','bad'):N('设计静态风险已核对。本次仅能模拟模型设计发布，实际服务消费仍需独立授权。','good')}<div class="actions">${B('保存应用草稿','save','',S.readOnly)}${B('发布 ADS 模型设计（模拟）','publish','primary',!!ps.length)}</div></div></div>`}
 case 5:return `<div class="panel">${Head('回读版本和消费交接','模型设计证据与 Runtime / Dataset / Service 的真实可用性必须区分')}<div class="panelbody"><div class="timeline"><div class="timeitem"><strong>ADS 设计草稿 R${S.revision} · ${E(S.savedTime)}</strong><p>应用 #920 · ${E(S.code)}，可按同一对象恢复未完成编辑。</p></div><div class="timeitem"><strong>${S.published?'模型设计 V1 已发布（原型模拟）':'模型设计未发布'}</strong><p>当前引用 ${E(sourceName())}，版本不可静默替换。</p></div><div class="timeitem"><strong>DataDev / Runtime · 未配置</strong><p>没有真实建表、运行批次、刷新时间和目标数据质量证据。</p></div><div class="timeitem"><strong>Dataset / Service · 未授权</strong><p>没有真实发布回执，消费者尚不可调用。Usage 也没有合法调用证据。</p></div></div><div class="actions">${B('重开已保存应用草稿','reopen')}${B('返回输出核对','goto:2','primary')}</div></div></div>`;
 }}
function rail(){const ps=issues();return `<div class="panel">${Head('消费设计核对','数据来源与输出合同状态')}<div class="panelbody compact"><div class="kv"><span>应用对象</span><strong>#920 · R${S.revision}</strong></div><div class="kv"><span>消费场景</span><strong>${E(S.appType)}</strong></div><div class="kv"><span>来源粒度</span><strong>${S.source==='DWS'?'业务日×城市':'订单明细行'}</strong></div><div class="kv"><span>输出字段</span><strong>${S.fields.length} 个</strong></div><div class="kv"><span>V1 样本</span><span class="status ${vstatus()==='SAMPLE_WARNING'?'warn':'neutral'}">${E(vstatus())}</span></div><div class="kv"><span>V2 运行/消费</span><span class="status neutral">NOT_EXECUTED</span></div><div class="divider"></div><div class="smallcap">待处理事项 · ${ps.length}</div><div class="checks">${ps.length?ps.slice(0,4).map(x=>`<div class="checkrow bad"><span class="checkicon">!</span><p>${E(x)}</p></div>`).join(''):'<div class="checkrow good"><span class="checkicon">✓</span><p>静态必要项已满足（原型示例）</p></div>'}</div>${B('打开设计审核','goto:4','sm')}</div></div><div class="panel">${Head('评审情景','模拟用户可恢复的异常分支')}<div class="panelbody compact">${[['normal','恢复正常情景'],['mismatch','模拟同范围指标偏差'],['duplicate','模拟业务键重复'],['metricdrift','模拟 Metric 口径漂移'],['revoked','模拟来源权限撤销'],['unpublished','模拟 DWS 未发布'],['timeout','模拟保存结果未知'],['readonly','切换只读用户']].map(([k,t])=>B((S.scenario===k?'● ':'○ ')+t,'scenario:'+k,'sm')).join('')}</div></div><div class="panel">${Head('交付状态','需要独立 Owner 真实回执')}<div class="panelbody compact"><div class="kv"><span>ADS 模型设计</span><b>${S.published?'已发布模拟':'待发布'}</b></div><div class="kv"><span>DataDev / Runtime</span><b>未执行</b></div><div class="kv"><span>Dataset / Service</span><b>未授权</b></div><div class="kv"><span>Usage</span><b>无实际调用证据</b></div><p class="subtle">本文件为 UX-2 高保真评审候选，不是真实数据服务。</p></div></div>`}
function overlay(){const el=document.getElementById('overlay');if(!S.pending){el.innerHTML='';return}const next=S.pending;const lost=S.fields.filter(f=>!opts[next].some(x=>x[0]===f));el.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="switch-title"><div class="dialog"><div class="smallcap">来源版本与业务粒度变更</div><h2 id="switch-title">确认切换应用的来源粒度？</h2><p>将 <b>${S.source==='DWS'?'按业务日×城市汇总':'订单明细行'}</b> 改为 <b>${next==='DWS'?'按业务日×城市汇总':'订单明细行'}</b>，不能沿用旧指标和输出键。</p><div class="tablewrap"><table><thead><tr><th>受影响内容</th><th>变化说明</th></tr></thead><tbody><tr><td>业务键</td><td>${next==='DWS'?'order_day + city_id':'order_id + item_id'}</td></tr><tr><td>会失去的字段</td><td>${E(lost.join(', ')||'无')}</td></tr><tr><td>指标与权限</td><td>Metric 审核、敏感字段授权需重新确认</td></tr><tr><td>已有修改</td><td>${S.dirty?'有未保存的修改；建议先保存原草稿':'当前草稿已有保存修订'}</td></tr></tbody></table></div><div class="actions">${B('取消并保留原设计','cancel')}${B('保存原稿再切换','saveSwitch','',S.readOnly)}${B('确认切换并重审','confirm','primary',S.readOnly)}</div></div></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="headline"><div><div class="eyebrow"><strong>ADS / 应用建模</strong> <span>订单过程 · ADS #920</span> ${headerStatus()}</div><h1>订单经营数据应用</h1><p class="intro">以消费者目标为起点，明确输出合同、验证过滤后的指标，再交接受治理的数据服务。</p></div><div class="headerbtns">${B('保存应用草稿','save','',S.readOnly)}${B('审核发布设计','goto:4','primary')}</div></div><div class="stepbar" role="tablist" aria-label="ADS 六步工作流">${steps.map((t,i)=>`<button class="step ${S.step===i?'active':''}" role="tab" aria-selected="${S.step===i}" data-step="${i}"><span class="stepnum">${i+1}</span>${t}</button>`).join('')}</div>${S.message?N(E(S.message),S.message.includes('阻断')?'bad':''):''}<div class="columns"><div class="primarycol">${section()}<div class="panel" style="padding:12px 19px;display:flex;justify-content:space-between;align-items:center"><span class="subtle">步骤 ${S.step+1} / 6 · R13 专项高保真评审版</span><div class="row">${B('上一步','prev','sm',S.step===0)}${B(S.step===5?'返回第一步':'下一步','next','primary sm')}</div></div></div><aside class="rail">${rail()}</aside></div>`;overlay()}
function save(){if(S.readOnly){S.message='当前只有查看权限';return}S.revision++;S.dirty=false;S.savedTime='刚刚';S.message=S.scenario==='timeout'?'保存结果未知：按应用 #920 和草稿修订号回读核对':'草稿 R'+S.revision+' 已保存到浏览器本地模拟记录（非真实数据库）';localStorage.setItem(K,JSON.stringify({...S,scenario:'normal',pending:null,message:'',step:5}))}
function validate(){let status='SAMPLE_MATCH',scope='全部地区',orders=3,amount=570,reason='与同范围固定合成 DWS 示例一致，不能替代实际数据核验';if(S.source!=='DWS'||S.scenario==='unpublished'||S.scenario==='revoked'||S.scenario==='metricdrift'||S.fields.includes('customer_phone')){status='UNAVAILABLE';reason='未发布/受限/没有 READ 授权或 DWD 明细不可套用 DWS 汇总公式'}else if(S.filter==='sh'){scope='仅上海';orders=2;amount=450;reason='与全范围 3/570 相差订单 -1、金额 -120：由过滤范围变化产生'}else if(S.filter==='custom'){status='SAMPLE_WARNING';scope='未解析';orders=null;amount=null;reason='自定义过滤尚未解析，不能制造过滤后的结果'}if(S.scenario==='mismatch'&&status!=='UNAVAILABLE'&&orders!==null){status='SAMPLE_WARNING';orders++;reason='相同范围内 ADS 订单数多 1，疑似计算/字段口径差异'}if(S.scenario==='duplicate'&&status!=='UNAVAILABLE'){status='SAMPLE_WARNING';reason='输出存在两个相同业务键，违反唯一行设计合同'}if(S.key.split(',').some(k=>!S.fields.includes(k.trim()))){status='SAMPLE_WARNING';reason='输出业务键中的字段缺失，无法验证唯一性'}S.validation={status,scope,orders,amount,reason,signature:signature()};S.message='已用固定合成数据模拟计算，没有向真实来源发送查询。'}
function confirmSwitch(){if(S.readOnly||!S.pending)return;S.source=S.pending;S.pending=null;S.fields=S.source==='DWS'?['order_day','city_id','order_count','paid_amount']:['order_id','item_id','event_time','item_amount'];S.key=S.source==='DWS'?'order_day,city_id':'order_id,item_id';S.metricConfirmed=false;S.securityConfirmed=false;S.dirty=true;S.message='已切换来源并重建输出字段候选；请重新审核指标、业务键和安全权限。'}
function action(a){S.message='';if(a==='prev')S.step=Math.max(0,S.step-1);else if(a==='next')S.step=(S.step+1)%6;else if(a.startsWith('goto:'))S.step=Number(a.split(':')[1]);else if(a.startsWith('app:')){S.appType=a.split(':')[1];S.dirty=true}else if(a==='validate')validate();else if(a==='save')save();else if(a==='publish'){if(issues().length)S.message='设计仍有阻断项，请修复并重验';else{S.published=true;S.message='仅模拟发布 ADS 设计 V1；DataDev/Service 和消费者授权均未发生'}}else if(a==='reopen'){try{const v=JSON.parse(localStorage.getItem(K));if(v)S={...seed,...v,step:5,message:'已按 ADS #920 和草稿 Revision 重开本地模拟记录。'};else S.message='没有可回读的应用草稿';}catch{S.message='本地草稿不可读取'}}else if(a.startsWith('source:')){const n=a.split(':')[1];if(n!==S.source&&!S.readOnly)S.pending=n;}else if(a==='cancel')S.pending=null;else if(a==='saveSwitch'){save();confirmSwitch()}else if(a==='confirm')confirmSwitch();else if(a.startsWith('scenario:')){S.scenario=a.split(':')[1];S.readOnly=['readonly','revoked'].includes(S.scenario);S.message='已切换模拟场景，右侧审核证据和输出试算会显示影响';}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act],[data-step]');if(!el)return;if(el.dataset.step!==undefined){S.step=Number(el.dataset.step);render()}else action(el.dataset.act)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){S[el.dataset.field]=el.value;S.dirty=true;render()}else if(el.dataset.check){S[el.dataset.check]=el.checked;S.dirty=true;render()}else if(el.dataset.column){S.fields=el.checked?[...new Set([...S.fields,el.dataset.column])]:S.fields.filter(x=>x!==el.dataset.column);S.dirty=true;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.field&&e.target.tagName==='INPUT'){S[e.target.dataset.field]=e.target.value;S.dirty=true}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pending){S.pending=null;render()}});window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});render();
})();
</script></body></html>
