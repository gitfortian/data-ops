 switch(S.step){
 case 0:return `<div class="panel">${Head('设计对象与业务过程','先确认汇总设计要解决的业务问题') }<div class="panelbody"><div class="fieldrow">${F('模型编码','code')}${F('模型名称','name')}</div>${N('业务过程：订单下单（order_create） · 模型归属：交易分析项目 / DWS 层。业务过程与来源事实粒度属于有版本的治理证据。')}<div class="cardgrid"><div class="choicecard"><h3>原有设计</h3><p>DWS #810 · 草稿修订 R${S.revision} · 上次更新 ${E(S.savedTime)}</p>${B('继续当前设计','goto:1','sm')}</div><div class="choicecard"><h3>目标用途</h3><p>按业务日与城市汇总订单数量、支付金额，供运营报表和指标消费。</p><span class="badge">主题汇总模型</span></div></div></div></div>`;
 case 1:return `<div class="panel">${Head('选择可信上游','只选择同业务过程真实已发布的 DWD 版本',`<span class="status">${E(Src())}</span>`)}<div class="panelbody"><div class="cardgrid">${[['detail','订单明细事实','每行是一条订单明细 item','DWD #701 · 正式 V'+S.sourceVer],['header','订单头事实','每行是一笔订单','DWD #700 · 正式 V3']].map(([key,n,desc,tag])=>`<button class="choicecard ${S.source===key?'selected':''}" data-act="source:${key}" ${S.readOnly?'disabled':''}><span class="badge">${tag}</span><h3 style="margin-top:10px">${n}</h3><p>${desc}</p><span class="mini">业务键：${key==='detail'?'order_id + item_id':'order_id'}</span></button>`).join('')}</div>${S.scenario==='drift'?N(`<strong>版本变化需要确认</strong>来源已产生 V3。当前冻结 V${S.sourceVer}。直接切换可能影响时间类型、业务键和金额口径。<div class="row" style="margin-top:10px">${B('保持当前冻结版','keep','sm')}${B('切换到 V3 并重新审阅','adopt','sm primary')}</div>`,'warn'):''}${N('<strong>事实粒度提示</strong>订单明细 3 行不意味着 3 笔订单；按订单统计必须审阅业务键及聚合规则。','warn')}${F('目标模型一行代表什么','grain')}<div class="actions">${B('回到设计对象','goto:0')}${B('继续定义统计粒度','goto:2','primary')}</div></div></div>`;
 case 2:return `<div class="panel">${Head('定义统计时间与分组','让“一行代表什么”变得可见、可复核') }<div class="panelbody"><div class="fieldrow">${F('统计周期','period',[['1h','每小时'],['1d','每天'],['1w','每周'],['1m','每月'],['ALL','全量（需单独审核）']])}${F('统计时区（IANA）','zone')}${F('业务时间字段','time',[['event_time','event_time · 事件发生时间'],['paid_at','paid_at · 支付时间'],['none','无合适业务时间（阻断）']])}${F('周期桶字段','bucket',[['order_day','order_day · 业务日'],['order_hour','order_hour · 小时'],['order_week','order_week · 周']])}</div><div class="sectiontitle">分组维度（必须有治理标准）</div><div class="row" style="justify-content:flex-start;gap:23px">${[['order_day','业务日期'],['city_id','城市'],['channel_id','渠道']].map(([k,n])=>`<label class="checkline"><input type="checkbox" data-dim="${k}" ${S.dims.includes(k)?'checked':''} ${S.readOnly?'disabled':''}/> ${n} <span class="mini">${k}</span></label>`).join('')}</div><div class="notice good"><strong>当前行粒度示意</strong>每个 ${E(S.period)} 时间窗口 × ${E(S.dims.join(' × ')||'未选择维度')} → 一行。例如：2026-10-17 × 上海 → 1 行（原型设计示意）。</div>${N('跨时区/DST、周起点及迟到数据重算须由业务与 Runtime 策略明确，本次只审核设计口径。')}</div></div>`;
 case 3:return `<div class="panel">${Head('定义与验证聚合度量','逐项说明来源、业务键与口径，再通过示例发现异常',`<span class="status warn">固定合成样本</span>`)}<div class="panelbody"><div class="twocol"><div class="choicecard selected"><div class="row"><h3>订单数量 <span class="mini">order_count</span></h3><span class="status good">度量</span></div>${F('计算方法','countMethod',[['distinct','COUNT DISTINCT(order_id)'],['count','COUNT(*) · 仅明细行数']])}${F('去重业务键','countKey')}<label class="checkline"><input type="checkbox" data-check="countConfirmed" ${S.countConfirmed?'checked':''} ${S.readOnly?'disabled':''}/>已核对业务去重键和取消订单规则</label></div><div class="choicecard"><div class="row"><h3>支付金额 <span class="mini">paid_amount</span></h3><span class="status warn">需确认</span></div>${F('金额来源类型','amountSource',[['line','订单明细行金额'],['header','订单头总额（多行重复风险）']])}<div class="helper">明细 SUM=450 只是样例，不代表实付净额</div><label class="checkline"><input type="checkbox" data-check="amountConfirmed" ${S.amountConfirmed?'checked':''} ${S.readOnly?'disabled':''}/>确认退款、折扣、支付状态与来源粒度</label></div></div><div class="divider"></div><div class="row"><div><div class="sectiontitle" style="margin:0">数据验证 · 计算预演</div><div class="subtle">先用固定示例核查，不访问任何真实业务库</div></div>${B('↻ 验证当前计算','validate','primary',S.readOnly)}</div>${validationDetail()}</div></div>`;
 case 4:let er=issue();return `<div class="panel">${Head('设计审核与发布','逐项核对来源、粒度、指标与验证证据；这里只发布模型设计') }<div class="panelbody"><div class="cardgrid"><div class="choicecard"><div class="smallcap">来源版本</div><h3>${E(Src())}</h3><p>源事实行粒度：${S.source==='detail'?'订单明细行':'订单头'}</p></div><div class="choicecard"><div class="smallcap">目标粒度</div><h3>${E(S.period)} · ${E(S.zone)}</h3><p>${E(S.grain)} · ${E(S.dims.join(', '))}</p></div></div><h3 class="sectiontitle">独立验证状态</h3>${evidenceTable()}${er.length?N('<strong>尚有 '+er.length+' 项阻断</strong><ol style="margin:6px 0 0;padding-left:20px">'+er.map(x=>'<li>'+E(x)+'</li>').join('')+'</ol>','bad'):N('静态设计示例检查已满足。样本 MATCH 不是生产对账；无真实数据时也不得冒充样本已验证。','good')}<div class="actions">${B('保存设计草稿','save','',S.readOnly)}${B('提交模型设计发布（模拟）','publish','primary',!!er.length)}</div></div></div>`;
 case 5:return `<div class="panel">${Head('版本与恢复','回读同一对象与冻结版本，运行结果独立于建模发布') }<div class="panelbody"><div class="timeline"><div class="timeitem"><strong>草稿 R${S.revision} · ${E(S.savedTime)}</strong><p>项目 / 模型 #810 · 当前编辑基线。来源 ${E(Src())}。</p></div><div class="timeitem"><strong>已发布的设计版本</strong><p>${S.published?'V1（仅高保真原型模拟）':'暂无正式发布，发布操作只会模拟设计层状态'}</p></div><div class="timeitem"><strong>数据生产与质量</strong><p>未运行；无 Runtime ExecutionId、目标行数与分组对账回执。</p></div><div class="timeitem"><strong>下游 ADS / 服务消费</strong><p>无实际 Dataset / Service 交付授权或 Usage 证据。</p></div></div><div class="actions">${B('按模型 #810 重开已保存草稿','reopen')}${B('回到来源版本','goto:1','primary')}</div></div></div>`;
 }
}
function evidenceTable(){let vs=valstatus();return `<div class="tablewrap"><table><thead><tr><th>证据层</th><th>状态</th><th>含义</th></tr></thead><tbody><tr><td>V0 静态合同</td><td>${issue().length?'STATIC_BLOCKED':'STATIC_PASS'}</td><td>结构、版本与业务口径设计检查</td></tr><tr><td>V1 只读样本</td><td>${E(vs)}</td><td>仅固定合成数据；无真实查询授权</td></tr><tr><td>V2 运行后对账</td><td>NOT_EXECUTED</td><td>未取得真实执行/质量证据</td></tr></tbody></table></div>`}
function validationDetail(){let v=valstatus();if(v==='NOT_RUN')return N('<strong>还没有验证结果</strong>点击「验证当前计算」查看原始明细 3 行、订单去重 2 笔与示例金额 450。数据完全合成，不是真实试算。');if(v==='STALE')return N('<strong>验证证据已过期 · STALE</strong>来源、业务时间、粒度、度量或草稿修订发生变化。请重新验证。','warn');if(v==='UNAVAILABLE')return N('<strong>来源无权访问 · UNAVAILABLE</strong>演示时不提供样本。真实环境必须先具有来源 READ、脱敏和预算授权。','bad');return `<div class="divider"></div><div class="row"><div><div class="smallcap">模拟数据 / 2026-10-17 / 上海</div><h3 style="margin:4px 0">${v==='SAMPLE_WARNING'?'计算结果存在疑点':'计算样本对比一致'}</h3></div><span class="status ${v==='SAMPLE_WARNING'?'warn':'good'}">${v}</span></div><div class="metric" style="margin:13px 0"><div class="metricbox"><span>源明细行数</span><strong>3</strong><span>COUNT(*)</span></div><div class="metricbox"><span>参考订单数</span><strong>2</strong><span>COUNT DISTINCT(order_id)</span></div><div class="metricbox ${S.countMethod==='count'?'bad':''}"><span>当前设计订单数</span><strong>${S.countMethod==='count'?'3':'2'}</strong><span>${S.countMethod==='count'?'比业务参考 +1':'示例差异 0'}</span></div></div><div class="tablewrap"><table><thead><tr><th>订单</th><th>明细</th><th>行金额</th></tr></thead><tbody><tr><td>O001</td><td>01</td><td>100</td></tr><tr><td>O001</td><td>02</td><td>200</td></tr><tr><td>O002</td><td>01</td><td>150</td></tr><tr><td colspan="2">明细金额合计（非支付净额）</td><td>450</td></tr></tbody></table></div>${N(`<strong>原因定位</strong>${E(S.validation?.reason||'请核对当前粒度和业务键')}。样本对比不能替代全量分组及退款对账。`,v==='SAMPLE_WARNING'?'warn':'good')}</div>`}
function rail(){let problems=issue();return `<div class="panel">${Head('设计完整性','基于当前编辑上下文的动态审核')}<div class="panelbody compact"><div class="kv"><span>项目 / 模型</span><strong>交易分析 / #810</strong></div><div class="kv"><span>源版本</span><strong>${E(Src())}</strong></div><div class="kv"><span>草稿</span><strong>R${S.revision}${S.dirty?' · 有未保存更改':''}</strong></div><div class="kv"><span>V1 样本</span><span class="status ${valstatus()==='SAMPLE_WARNING'?'warn':'neutral'}">${E(valstatus())}</span></div><div class="kv"><span>V2 对账</span><span class="status neutral">NOT_EXECUTED</span></div><div class="divider"></div><div class="smallcap">待处理事项 · ${problems.length}</div><div class="checks">${problems.length?problems.slice(0,4).map(x=>`<div class="checkrow bad"><span class="checkicon">!</span><p>${E(x)}</p></div>`).join(''):'<div class="checkrow good"><span class="checkicon">✓</span><p>设计必要项已满足（原型模拟）</p></div>'}</div>${B('查看完整发布审核','goto:4','sm')}</div></div><div class="panel">${Head('评审情景','在高保真中直接操作异常路径')}<div class="panelbody compact">${[['normal','恢复正常情景'],['drift','模拟上游 V3 变化'],['duplicate','模拟金额重复计量'],['revoked','模拟来源权限撤销'],['timeout','模拟保存状态未知'],['readonly','切换只读权限']].map(([k,t])=>B((S.scenario===k?'● ':'○ ')+t,'scenario:'+k,'sm')).join('')}</div></div><div class="panel">${Head('当前边界','设计流程与执行事实分离')}<div class="panelbody compact"><p class="subtle">页面只做模拟交互，不执行 SQL、不批准指标、不写入数据库，也不能赋予 Dataset 或 Service 消费权限。</p><span class="status neutral">UX-2 · 待签收</span></div></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="headline"><div><div class="eyebrow"><strong>DWS / 汇总建模</strong> <span>订单过程 · DWS #810</span> ${badges()}</div><h1>订单经营日汇总模型</h1><p class="intro">先确定业务粒度和可信来源，再验证聚合计算，最后发布可追溯的模型设计。</p></div><div class="headerbtns">${B('保存草稿','save','',S.readOnly)}${B('审核与发布设计','goto:4','primary')}</div></div><div class="stepbar" role="tablist" aria-label="DWS 六步工作流">${steps.map((n,i)=>`<button role="tab" aria-selected="${S.step===i}" data-step="${i}" class="step ${S.step===i?'active':''}"><span class="stepnum">${i+1}</span>${n}</button>`).join('')}</div>${noticeState()}<div class="columns"><div class="primarycol">${section()}<div class="panel" style="padding:12px 19px;display:flex;justify-content:space-between;align-items:center"><span class="subtle">步骤 ${S.step+1} / 6 · R13 专项高保真评审版</span><div class="row">${B('上一步','prev','sm',S.step===0)}${B(S.step===5?'返回第一步':'下一步','next','primary sm')}</div></div></div><aside class="rail">${rail()}</aside></div>`}
function save(){if(S.readOnly){S.message='当前只有查看权限，禁止保存';return}S.revision++;S.savedTime='刚刚';S.dirty=false;S.message=S.scenario==='timeout'?'保存回执不确定：请按模型 ID 和修订号回读核对，勿重复创建':'设计草稿 R'+S.revision+' 已保存到浏览器本地模拟记录（非真实数据库）';localStorage.setItem(K,JSON.stringify({...S,scenario:'normal',message:'',step:5}));}
function validate(){let status='SAMPLE_MATCH',reason='COUNT DISTINCT 按 order_id 去重，样例 3 行中有 2 笔订单';if(S.source==='draft'||S.scenario==='revoked'||S.time==='none') {status='UNAVAILABLE';reason='无已发布来源或 READ 权限，禁止预演'}else if(S.countMethod!=='distinct'||S.countKey!=='order_id'){status='SAMPLE_WARNING';reason='当前 COUNT(*) 或业务键错误：误将 3 明细算为 3 订单'}else if(S.scenario==='duplicate'||S.amountSource==='header'){status='SAMPLE_WARNING';reason='SUM 订单头总额在明细行上会发生重复计量'}S.validation={status,reason,sig:sig()};S.message='仅使用固定合成样本完成演示核对；无真实数据源读取。';}
function click(act){S.message='';if(act==='next')S.step=(S.step+1)%6;else if(act==='prev')S.step=Math.max(0,S.step-1);else if(act.startsWith('goto:'))S.step=Number(act.split(':')[1]);else if(act==='save')save();else if(act==='validate')validate();else if(act==='publish'){if(issue().length)S.message='存在发布阻断，请修复并重新审查';else{S.published=true;S.message='已模拟发布建模设计 V1；Runtime、真实数据对账和 ADS 消费仍未配置。'}}else if(act==='reopen'){try{const v=JSON.parse(localStorage.getItem(K));if(v){S={...seed,...v,step:5,message:'已按模型 #810 和 Revision 重开已保存草稿（浏览器本地模拟）。'};}else S.message='没有可回读的草稿，请先保存';}catch{S.message='本地原型草稿不可读取'}}else if(act==='keep'){S.locked=true;S.dirty=true;S.message='已明确选择保留冻结上游版本，仍需重新审阅和保存。'}else if(act==='adopt'){S.sourceVer=3;S.scenario='normal';S.locked=false;S.countConfirmed=false;S.amountConfirmed=false;S.dirty=true;S.message='已选择 V3，清除原有指标确认。需重新验证和保存。'}else if(act.startsWith('source:')){if(S.readOnly)return;S.source=act.split(':')[1];S.countConfirmed=false;S.amountConfirmed=false;S.dirty=true;S.message='来源发生变化，原度量口径确认作废；请重新审阅。'}else if(act.startsWith('scenario:')){S.scenario=act.split(':')[1];S.readOnly=S.scenario==='readonly'||S.scenario==='revoked';S.locked=false;S.message='已切换原型评审情景；侧栏展示对应风险和恢复路径。'}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-step]');if(!b)return;if(b.dataset.step!==undefined){S.step=Number(b.dataset.step);render()}else click(b.dataset.act)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){S[el.dataset.field]=el.value;S.dirty=true;render()}else if(el.dataset.check){S[el.dataset.check]=el.checked;S.dirty=true;render()}else if(el.dataset.dim){S.dims=el.checked?[...new Set([...S.dims,el.dataset.dim])]:S.dims.filter(d=>d!==el.dataset.dim);S.dirty=true;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.field&&e.target.tagName==='INPUT'){S[e.target.dataset.field]=e.target.value;S.dirty=true}});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});render();
})();
</script></body></html>
