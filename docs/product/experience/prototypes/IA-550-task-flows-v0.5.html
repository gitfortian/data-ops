  security:{steps:["分级分类","访问策略","脱敏裁决","访问审计"],help:"安全分类不等于访问许可；策略与访问决策独立留证。",panels:["敏感字段的分类证据","权限请求及策略版本","脱敏算法与裁决结果","主体 / 资源 / 审计记录"]},
  lifecycle:{steps:["策略定义","生效绑定","TTL 观测","存储趋势"],help:"保存 TTL 策略不等于已在执行环境生效。",panels:["生命周期策略草稿","对象与生效范围","过期检查与异常","冷热存储趋势"]},
  mdm:{steps:["实体建模","匹配识别","清洗规则","变更审批"],help:"MDM 保留实体级身份、清洗前后版本及人工审批，不与 Asset 真相混用。",panels:["主数据实体建模","匹配、去重规则","清洗前后值对照","审批人和实际回执"]}
 }[id];
 const current=state.tab[id]||config.steps[0],index=config.steps.indexOf(current),item=v3Selected(id);
 const facts=item?'<div class="detailStrip"><strong>'+esc(item[0])+'</strong>'+badge(item[3])+'<span>'+esc(item[4])+'</span></div>':'<div class="resultPanel warn"><p>暂无符合条件的对象。</p></div>';
 const content=index===0?v3Filters()+v3Table(id):'<div class="cardBody">'+facts+'<h2>'+esc(config.panels[index])+'</h2><p>此视图展示具体任务应具有的输入、证据与处理反馈，与其他页签不是同一张列表。</p>'+
 (id==="quality"&&index===1?'<div class="itemFacts"><div class="factRow"><span>检查 ID</span><strong>DEMO-EXE-115</strong></div><div class="factRow"><span>冻结范围</span><strong>示例会员表 / 3 项规则</strong></div><div class="factRow"><span>结果状态</span><strong>UNKNOWN（不能视为已通过）</strong></div></div>':
 id==="security"&&index===2?'<div class="docGrid"><div class="factBox"><h3>请求值</h3><p>13800138000</p></div><div class="factBox"><h3>演示脱敏效果</h3><p>138****8000</p></div></div>':
 id==="lifecycle"&&index===1?'<div class="itemFacts"><div class="factRow"><span>待绑定对象</span><strong>ods_order_detail</strong></div><div class="factRow"><span>策略版本</span><strong>草稿 v1.0</strong></div><div class="factRow"><span>生效结果</span><strong>未确认</strong></div></div>':
 id==="mdm"&&index===2?'<div class="docGrid"><div class="factBox"><h3>原字段</h3><p>客户名称：张 三</p></div><div class="factBox"><h3>规范化预览</h3><p>客户名称：张三</p></div></div>':
 '<div class="softPanel">'+esc(config.help)+'</div>')+
 '<div class="resultPanel warn"><h3>独立功能样例 · 尚未关联当前对象</h3><p>此演示片段用于表达专业任务结构，示例对象不等于上方选择的业务对象。后续需按当前对象身份及其真实检查/策略/审批记录深化，不将示意内容当成实际结果。</p></div></div>';
 return pageHead(nameOf(id),descriptions[id],"",'<button class="btn" data-page="'+(id==="quality"?"qualityRun":id==="security"?"securityAudit":id==="lifecycle"?"metadata":"asset")+'">项目级专业入口 ↗</button>')+
 v3Ctx()+v3Steps(config.steps,index,"specialist")+
 '<div class="split medium v5ContentFirst"><section class="card"><div class="cardHead"><h2>'+esc(config.panels[index])+'</h2></div>'+content+'</section><section class="card"><div class="cardHead"><h2>任务说明 / 事实边界</h2></div><div class="cardBody">'+facts+'<p>'+esc(config.help)+'</p><div class="riskLine">当前原型不执行该领域真实规则配置、策略部署、主数据合并或生命周期运行。</div><div class="itemFacts"><div class="factRow"><span>当前步骤</span><strong>'+esc(current)+'</strong></div><div class="factRow"><span>所属 Owner</span><strong>'+esc(nameOf(id))+'</strong></div><div class="factRow"><span>正式证据</span><strong>尚未接入</strong></div></div></div></section></div>'+v3Review();
}
function v3StatePanel(){
 const data={
 empty:["没有符合条件的记录","当前请求成功，但所选范围确实没有内容。","清空筛选"],
 loading:["正在加载对象","保持当前操作上下文；不能提前展示成功结果。","返回正常演示"],
 error:["读取失败（示例）","无法获取实时数据。示例模式可恢复，不代表服务器重试成功。","退出异常预览"],
 forbidden:["无权限查看此项内容","不查询受限制接口；可返回有权入口或请求管理员授权。","返回可访问入口"],
 partial:["部分功能暂不可用","当前本地对象列表仍可浏览；缺失的质量/安全/元数据证据标记为未知，不推断结果成功。","退出异常预览"],
 unknown:["当前状态无法确认","当前仅有已知对象身份，执行/审批结果缺少证据。不能推断成功。","退出异常预览"]
 }[state.status]||["当前内容","仅显示静态数据","重试"];
 return '<div class="stateArea"><div class="glyph">◇</div><h3>'+data[0]+'</h3><p>'+data[1]+'</p><button class="btn" data-v3-action="state-retry">'+data[2]+'</button></div>';
}
function v3Run(){
 nav();
 dom("roleSwitch").value=state.role;
 const s=dom("statusFilter");if(s)s.value=state.filter;
 const id=state.page;
 const view=id==="semantic"||id==="standard"?v3Definition(id):
 id==="model"?v3Model():
 id==="metric"?v3Metric():
 id==="governance"?v3Governance():
 id==="asset"?v3Asset():
 ["quality","security","lifecycle","mdm"].includes(id)?v3Specialist(id):
 toolInfo[id]?toolPage(id):placeholderPage(id);
 dom("main").innerHTML=view;
 const f=dom("statusFilter");if(f)f.value=state.filter;
}
function renderMain(){v3Run()}
function statePanel(){return v3StatePanel()}
function chosen(){return v3Selected(state.page)}
function selectRow(i){
 if(!sample[state.page]||!sample[state.page][i])return;
 const id=state.page;
 if(["metric","model","governance"].includes(id))v4Switch(id,i,false,"manual");
 else state.select[id]=i;
 renderMain();
 if(id==="governance"&&typeof window.innerWidth==="number"&&window.innerWidth<=1060)dom("main").querySelector(".v4Workspace")?.scrollIntoView?.({behavior:"smooth",block:"start"})
}
function go(id,keepHistory){
 if(v3.editing && state.editDirty){v3.pending=id;v3DirtyDialog();return}
 if(v3.editing&&!state.editDirty){v3.editing=null;closeDialog()}
 v4SaveActive(state.page);
 if(!keepHistory){v3.scope=null;v4.trail=[];v4.pending=null}
 if(!keepHistory&&state.page!==id)state.history.push(state.page);
 state.page=id;state.status="ready";state.filter="all";state.query="";state.tree="";state.queue="all";
 /* explicit target selection: do not force existing ODS model */
 state.tool=toolInfo[id]?id:"";state.lastMenu=domainOf(id).id;
 v3CloseDrawer();renderMain();closeMobile();
 if(window.location.hash!=="#"+id)window.location.hash=id;
 if(typeof window.scrollTo==="function")window.scrollTo(0,0);
}
function v3OpenEdit(mode){
 const r=v3Selected(state.page);
 if(mode==="edit"&&!r){toast("无当前对象，无法编辑");return}
 if(!actionAllowed()){toast("只读画像无法写入");return}
 const key=mode==="create"?"new:"+state.page:state.page+":"+r[4],draft=v3.storedDrafts[key];
 v3.editing={mode,key,page:state.page,original:r?r[0]:"",name:draft?draft.name:mode==="edit"?r[0]:"",note:draft?draft.note:""};
 v3.editing.openedName=v3.editing.name;v3.editing.openedNote=v3.editing.note;state.editDirty=false;
 v3ShowEdit();
}
function v3ShowEdit(){
 const p=v3.editing;if(!p)return;
 state.dialogName="v3-edit";
 dom("dialog").innerHTML='<h2 id="dialogTitle">'+(p.mode==="create"?"新建":"编辑")+esc(nameOf(state.page))+' · 本地草稿</h2><p>新建不会带入旧对象，编辑会恢复本地未完成草稿。此原型没有生产 API。</p><label class="dlgfield">名称<input id="v3-edit-name" value="'+esc(p.name)+'" placeholder="请输入名称"></label><label class="dlgfield">变更说明<textarea id="v3-edit-note" placeholder="填写本次变更依据">'+esc(p.note)+'</textarea></label><div class="dlgfoot"><button class="btn" data-v3-edit="cancel">取消</button><button class="btn primary" data-v3-edit="save">保存本地草稿</button></div>';
 dom("dialogShade").classList.add("open");dom("dialogShade").setAttribute("aria-hidden","false");
}
function v3DirtyDialog(){
 if(!v3.editing)return;
 state.dialogName="v3-dirty";
 dom("dialog").innerHTML='<h2 id="dialogTitle">存在未保存的编辑内容</h2><p>继续编辑会恢复刚才的输入；保存草稿可以再次打开。放弃后原型不会修改对象。</p><div class="dlgfoot"><button class="btn" data-v3-edit="stay">继续编辑</button><button class="btn" data-v3-edit="discard">放弃并离开</button><button class="btn primary" data-v3-edit="saveleave">保存草稿并离开</button></div>';
 dom("dialogShade").classList.add("open");dom("dialogShade").setAttribute("aria-hidden","false");
}
function v3FinishEdit(leave){
 const p=v3.editing;if(!p)return;
 v3.storedDrafts[p.key]={name:p.name,note:p.note,at:"当前会话"};
 if(p.mode==="create"){
   const page=p.page||state.page,arr=v5.drafts[page]||(v5.drafts[page]=[]);
   const d={page,id:"LOCAL-"+page.toUpperCase()+"-"+(++v5.draftCounter),name:p.name,note:p.note,content:""};
   arr.push(d);v5.activeDraft=d;
 }
 state.editDirty=false;v3.editing=null;closeDialog();renderMain();
 toast("本地草稿已保存。可再次打开继续编辑；未调用生产接口。");
 if(leave&&v3.pending){const next=v3.pending;v3.pending=null;go(next)}
}
function v3HandleAction(a){
 const m=v3.metric,b=v3.build,allow=actionAllowed();
 if(a==="state-retry"){state.status="ready";renderMain();return}
 if(a==="new"){v3OpenEdit("create");return}
 if(a==="edit"){v3OpenEdit("edit");return}
 if(a==="process-next"){v5StageProcess();return}
 if(a==="standard-attach"){v5StageStandard();return}
 if(a==="model-open"){v3OpenDrawer("model");return}
 if(a==="model-check"){if(!allow)return;b.checked=false;b.checkRevision=-1;state.tab.model="校验记录";renderMain();return}
 if(a==="model-fix"){if(!allow)return;b.fixed=true;b.dirty=true;renderMain();return}
 if(a==="model-recheck"){if(!allow||!b.fixed)return;b.checked=true;b.checkRevision=b.rev;renderMain();return}
 if(a==="model-save"){if(!allow||!v4ValidModel(b))return;
  if(!b.savedVersions.some(x=>x.rev===b.rev)){
   const id="DEMO-MODEL-"+b.model+"-V2."+(b.savedVersions.length+1);
   b.savedVersions.push(Object.freeze({id,modelId:b.model,source:b.source,mapField:b.mapField,field:b.field,process:b.process,rev:b.rev,date:new Date().toLocaleString("zh-CN")}));
   b.version=id;
  }
  b.dirty=false;renderMain();return}
 if(a==="model-next-metric"){const r=v3Selected("model");if(r)v3Route("metric",{id:r[4],label:r[0],relation:"模型引用"});return}
 if(a==="metric-validate"){if(!allow)return;m.validationAttempted=true;
  const must=m.expected;
  const formulaOk=!!m.formula.trim()&&(m.id!=="MET-031"||m.formula.includes("NULLIF"));
  const filterOk=m.filter.replace(/\s+/g," ").toUpperCase().includes(must.replace(/\s+/g," ").toUpperCase());
  m.checked=!!(formulaOk&&filterOk);m.checkRevision=m.checked?m.rev:-1;m.impactSeen=false;m.impactRevision=-1;
  state.tab.metric="校验";renderMain();return}
 if(a==="metric-fix"){if(!allow)return;
  if(m.filter!==m.expected){m.filter=m.expected;v4InvalidMetric(m)}
  m.validationAttempted=false;state.tab.metric="定义口径";renderMain();return}
 if(a==="metric-impact"){if(!v4ValidMetric(m))return;state.tab.metric="引用与影响";renderMain();return}
 if(a==="metric-to-publish"){if(!allow||!v4ValidMetric(m))return;m.impactSeen=true;m.impactRevision=m.rev;state.tab.metric="版本与发布";renderMain();return}
 if(a==="metric-publish"){if(!allow||!v4ValidMetric(m)||!m.impactSeen||m.impactRevision!==m.rev)return;
  if(!m.receipts.some(x=>x.rev===m.rev)){
   const id="DEMO-METRIC-PUBLICATION-"+m.id+"-V"+(m.receipts.length+1),version="v1."+(2+m.receipts.length);
   m.receipts.push(Object.freeze({id,version,metricId:m.id,formula:m.formula,filter:m.filter,rev:m.rev,date:new Date().toLocaleString("zh-CN")}));
   m.version=version+" · 已发布";
   m.release=id;
  }
  m.published=true;m.dirty=false;renderMain();return}
 if(a==="metric-return"){state.tab.metric="定义口径";renderMain();return}
 if(a==="asset-drawer"){v3OpenDrawer("asset");return}
 if(a==="asset-queue"){const r=v3Selected("asset");if(r)v3Route("governance",{id:r[4],label:r[0],relation:"资产治理任务"});return}
 if(a==="queue-evidence"){v3.queueStep="evidence";v4SaveActive("governance");renderMain();return}
 if(a==="queue-resolve"){if(!allow){toast("只读画像不能开始处理或转交");return}v3.queueStep="resolve";v4SaveActive("governance");renderMain();return}
 if(a==="queue-review"){const issue=v4GuardQueue();if(issue){toast(issue);v3.queueStep="resolve";renderMain();return}v3.queueStep="submit";v4SaveActive("governance");renderMain();return}
 if(a==="queue-submit"){
  const issue=v4GuardQueue();if(issue){toast(issue);v3.queueStep="resolve";renderMain();return}
  const task=v3Selected("governance");if(!task)return;
  const q=v4StoreFor("governance",task[4]);const id="DEMO-GOV-RECEIPT-"+task[4]+"-"+(q.receipts.length+1);
  const rec=Object.freeze({id,taskId:task[4],subject:v3QueueInfo[task[4]].subject,decision:v3.decision,transferTo:v3.transferTo,note:v3.note,date:new Date().toLocaleString("zh-CN")});
  q.receipts.push(rec);q.dirty=false;v3.queueStep="receipt";v4SaveActive("governance");renderMain();return}
 if(a==="queue-next"){v3.queueStep="evidence";v4SaveActive("governance");renderMain();return}
}
document.addEventListener("click",function(ev){
 const el=ev.target.closest("button");if(!el)return;
 if(el.dataset.queue){return}
 if(el.dataset.model){return}
 if(el.dataset.v5Rel){
  if(el.dataset.v5Rel==="confirm")v5ApplyRelation();
  else{v5.relation=null;renderMain()}
  return;
 }
 if(el.dataset.v5Draft){
   const d=Object.values(v5.drafts).flat().find(x=>x.id===el.dataset.v5Draft);
   if(d){v5.activeDraft=d;renderMain()}
   return;
 }
 if(el.dataset.v5DraftClose){v5.activeDraft=null;renderMain();return}
 if(el.dataset.v5DraftSave){if(!actionAllowed())return;toast("当前会话草稿已保存，未写入生产服务");renderMain();return}
 if(el.dataset.v3Action){v3HandleAction(el.dataset.v3Action);return}
 if(el.dataset.v3Tab){state.tab[state.page]=el.dataset.v3Tab;renderMain();return}
 if(el.dataset.v3Step){
  const [kind,num]=el.dataset.v3Step.split(":"),n=Number(num);
  if(kind==="queue"){
    if(n===1&&!actionAllowed()){toast("只读角色只能查看历史和差异");return}
    if(n===2){const issue=v4GuardQueue();if(issue){toast(issue);v3.queueStep="resolve";renderMain();return}}
    if(n===3&&!v4StoreFor("governance",v3.queueId).receipts.length){toast("尚无此任务的处理记录");return}
  }
  if(kind==="metric"){state.tab.metric=["定义口径","校验","引用与影响","版本与发布"][n]}
  if(kind==="specialist"){state.tab[state.page]=({quality:["规则监控","检查执行","结果证据","失败恢复"],security:["分级分类","访问策略","脱敏裁决","访问审计"],lifecycle:["策略定义","生效绑定","TTL 观测","存储趋势"],mdm:["实体建模","匹配识别","清洗规则","变更审批"]})[state.page][n]}
  if(kind==="queue"){v3.queueStep=["evidence","resolve","submit","receipt"][n];v4SaveActive("governance")}
  renderMain();return
 }
 if(el.dataset.v4Backto!==undefined){v3Back(Number(el.dataset.v4Backto));return}
 if(el.dataset.v4Switch){v4ResolvePending(el.dataset.v4Switch);return}
 if(el.dataset.v3Back){v3Back();return}
 if(el.dataset.v3Close){v3CloseDrawer();return}
 if(el.dataset.v3Edit){
  const a=el.dataset.v3Edit;
  if(a==="save"){if(v3.editing&&!v3.editing.name.trim()){toast("请填写名称");return}v3FinishEdit(false);return}
  if(a==="saveleave"){if(v3.editing&&!v3.editing.name.trim()){toast("请填写名称");return}v3FinishEdit(true);return}
  if(a==="stay"){v3ShowEdit();return}
  if(a==="discard"){const next=v3.pending;v3.pending=null;v3.editing=null;state.editDirty=false;closeDialog();if(next)go(next);return}
  if(a==="cancel"){if(state.editDirty)v3DirtyDialog();else{v3.editing=null;closeDialog()}return}
 }
});
document.addEventListener("input",function(ev){
 const t=ev.target;if(t.id==="v3-edit-name"&&v3.editing){v3.editing.name=t.value;state.editDirty=v3.editing.name!==v3.editing.openedName||v3.editing.note!==v3.editing.openedNote}
 if(t.id==="v3-edit-note"&&v3.editing){v3.editing.note=t.value;state.editDirty=v3.editing.name!==v3.editing.openedName||v3.editing.note!==v3.editing.openedNote}
 if(t.id==="v3-formula"&&actionAllowed()){v4InvalidMetric(v3.metric);v3.metric.formula=t.value}
 if(t.id==="v3-condition"&&actionAllowed()){v4InvalidMetric(v3.metric);v3.metric.filter=t.value}
 if(t.id==="v3-mapfield"&&actionAllowed()){v4InvalidModel(v3.build);v3.build.mapField=t.value}
 if(t.id==="v3-queue-note"&&actionAllowed()){v3.note=t.value;v4QueueChanged()}
 if(t.id==="v5-attribute"&&v5.relation){v5.relation.attribute=t.value}
 if(t.id==="v5-draft-content"&&v5.activeDraft&&actionAllowed()){v5.activeDraft.content=t.value}
});
document.addEventListener("change",function(ev){
 const t=ev.target;
 if(t.id==="v5-target"&&v5.relation){v5.relation.target=t.value;renderMain();return}
 if(t.id==="v4-choose"){selectRow(Number(t.value));return}
 if(t.id==="v4-category"){state.tree=t.value;renderMain();return}
 if(t.id==="v3-queue-decision"&&actionAllowed()){v3.decision=t.value;if(t.value!=="transfer")v3.transferTo="";v4QueueChanged();renderMain()}
 if(t.id==="v3-transfer"&&actionAllowed()){v3.transferTo=t.value;v4QueueChanged()}
 if(t.id==="v3-source"&&actionAllowed()){if(v3.build.source!==t.value){v4InvalidModel(v3.build);v3.build.source=t.value}renderMain()}
});
dom("drawerShade").addEventListener("click",v3CloseDrawer);

var start=decodeURIComponent(window.location.hash.replace(/^#/,""));if(paths[start]||labels[start]||toolInfo[start]){state.page=start;state.lastMenu=domainOf(start).id}render();
})();
</script>
