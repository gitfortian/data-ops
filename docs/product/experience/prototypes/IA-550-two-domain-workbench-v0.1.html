function go(next,fromHistory){if(!screens[next])return;if(state.dirty&&!fromHistory){confirmDemo("未保存的示例编辑","此处展示离开确认规则。当前输入未提交任何服务，若继续切换，演示编辑将丢失。");state.pending=next;return}if(!fromHistory&&next!==state.screen)state.history.push(state.screen);state.screen=next;state.query="";state.mode="ready";state.tab="概览";state.dirty=false;render();window.scrollTo(0,0);closeSidebar()}
function back(){var last=state.history.pop();if(last)go(last,true);else toast("这是示例旅程的起点")}
function roleLabel(){return state.role==="builder"?"建模实施者":state.role==="steward"?"治理人员":"只读观察者"}
function statePanel(){
var config={
empty:["◇","成功但无结果","示例：已成功读取对象集合，但筛选没有匹配记录。","清空筛选并返回"],
unavailable:["!","读取失败 / 服务不可用","示例：Owner API 不可用。禁止清空原列表后显示‘没有数据’。应保留失败信息和重试。","模拟重试"],
forbidden:["⊘","没有当前能力授权","示例：本角色无法读取该视图。导航展示不代表能访问后端操作。","返回上一步"],
unknown:["?","状态未知 / 暂不能判断","示例：没有足够回执证明业务对象已完成当前动作。","查看需要的证据"],
partial:["◐","部分信息可用","示例：当前对象可见，但专业治理 Provider 无法返回风险摘要，不得推断‘无风险’。","继续查看已授权事实"]};
var d=config[state.mode];if(!d)return "";return '<div class="alt-state"><div class="symbol" aria-hidden="true">'+d[0]+'</div><h3>'+d[1]+'</h3><p>'+d[2]+'</p><button class="btn" data-state-reset="yes">'+d[3]+'</button></div>'
}
function table(){
if(state.mode!=="ready")return statePanel();
var arr=datasets[state.screen].filter(function(r){return (r.join(" ").toLowerCase().indexOf(state.query.toLowerCase())>=0)});
if(state.screen==="G1"&&state.assetView==="entity")arr=arr.filter(function(r){return r[1].indexOf("技术实体")>=0});
if(state.screen==="G1"&&state.assetView==="asset")arr=arr.filter(function(r){return r[1].indexOf("治理资产")>=0});
if(!arr.length)return statePanelEmpty();
var content=arr.map(function(r){var cls=/待|草稿|未处理|编目|核验/.test(r[2])?"pending":/已定义|已发现/.test(r[2])?"success":"";return '<tr><td><strong>'+esc(r[0])+'</strong><small>仅示例数据</small></td><td>'+esc(r[1])+'</td><td><span class="pill '+cls+'">'+esc(r[2])+'</span></td><td><button class="link" data-row="'+esc(r[3])+'">'+esc(r[3])+' →</button></td></tr>'}).join("");
return '<div class="table-wrap"><table><thead><tr><th>名称</th><th>类别 / 归属</th><th>演示状态</th><th>下一步</th></tr></thead><tbody>'+content+'</tbody></table></div><p style="margin-top:10px;color:#8a99a8;font-size:11px">共 '+arr.length+' 项 · 仅演示筛选与状态布局，不代表真实 Owner 返回。</p>'
}
function statePanelEmpty(){return '<div class="alt-state"><div class="symbol">◇</div><h3>没有匹配的样例结果</h3><p>可清除筛选恢复示例行。正式实现必须根据成功的响应与筛选条件区分空态和失败。</p><button class="btn" data-clear="yes">清空筛选</button></div>'}
function mainContent(s){
var t=state.screen==="D3"?["概览","逻辑模型","物理模型","来源映射","版本证据"]:state.screen==="D4"?["概览","定义与口径","校验","发布","反向影响"]:state.screen==="G2"?["概览","来源证据","质量与安全","治理历史"]:state.screen==="G3"?["概览","盘点上架","变更处理","对账记录"]:["概览","对象集合","关联证据"];
var tabs='<div class="tabs" role="tablist" aria-label="工作台视图">'+t.map(function(v){return '<button role="tab" aria-selected="'+(state.tab===v)+'" class="tab '+(state.tab===v?"active":"")+'" data-tab="'+esc(v)+'">'+esc(v)+'</button>'}).join("")+'</div>';
var switcher=state.screen==="G1"?'<div class="tabs" role="tablist" aria-label="对象类型"><button role="tab" aria-selected="'+(state.assetView==="asset")+'" class="tab '+(state.assetView==="asset"?"active":"")+'" data-view="asset">治理资产</button><button role="tab" aria-selected="'+(state.assetView==="entity")+'" class="tab '+(state.assetView==="entity"?"active":"")+'" data-view="entity">技术实体</button></div>':tabs;
var extra=state.tab!=="概览"&&state.screen!=="G1"?'<div class="stagebox"><strong>'+esc(state.tab)+' · 设计结构预演</strong><p>此处应展示当前 Owner 的独立版本/规则/执行/权限证据，不通过复制其他旧路由页面实现。静态原型只验证导航层与信息优先级。</p></div>':"";
return '<div class="panel section"><div class="section-head"><div><h2>'+esc(s.label)+'工作区</h2><small>先确认身份与状态，然后给出下一动作</small></div><span class="chip">当前项目 · 演示数据</span></div>'+switcher+'<div class="toolbar"><input id="search" class="search" type="search" placeholder="搜索当前对象 / 字段 / 状态" aria-label="示例表格搜索" value="'+esc(state.query)+'"><select class="filter" aria-label="演示范围"><option>全部范围</option><option>当前上下文</option></select></div>'+table()+extra+'</div>'
}
function render(){
var s=screens[state.screen];var progress=steps().map(function(id,i){var done=steps().indexOf(state.screen)>i;var here=id===state.screen;return '<button class="step '+(here?"active":done?"done":"")+'" data-screen="'+id+'"><strong>'+(i+1)+'</strong>'+screens[id].label+'</button>'}).join("");
document.querySelectorAll("[data-screen]").forEach(function(el){el.classList.toggle("active",el.dataset.screen===state.screen)});
var prev=state.history.length?'<button class="btn" data-back="yes">← 返回来源</button>':'';
var next=hasAnother()?'<button class="btn primary" data-next="yes">'+esc(s.action)+' →</button>':'<button class="btn primary" data-act="inspect">'+esc(s.action)+' ↗</button>';
var evidence='<div class="evidence"><div><span>对象身份</span><b>'+esc(s.entityId)+'</b></div><div><span>项目上下文</span><b>Retail Analytics（待核验）</b></div><div><span>当前角色</span><b>'+roleLabel()+'</b></div><div><span>版本 / Run</span><b>无真实回执</b></div><div><span>数据来源</span><b>本地演示对象</b></div></div>';
var actionHint=state.role==="reader"?'只读模拟角色不显示写入动作；实际授权须基于原菜单码和 Owner API。':'操作前必须读取真实权限和 Owner 最新状态；演示不执行服务调用。';
$("#app").innerHTML='<div class="crumb"><button data-root="'+(group()==="D"?"D1":"G1")+'">'+esc(s.domain)+'</button><span>／</span><span>'+esc(s.label)+'</span><span>／</span><span>工作台原型</span></div>'+
'<div class="heading"><div><div class="eyebrow">WORKSPACE · '+esc(state.screen)+'</div><h1>'+esc(s.title)+'</h1><p>'+esc(s.description)+'</p></div><div class="heading-actions">'+prev+next+'</div></div>'+
'<div class="journey" aria-label="当前示例旅程">'+progress+'</div>'+
'<div class="state-controls"><label for="previewState">演示状态</label><select id="previewState"><option value="ready">READY / 正常</option><option value="empty">EMPTY / 真实空</option><option value="unavailable">UNAVAILABLE / 读取失败</option><option value="forbidden">FORBIDDEN / 无权</option><option value="unknown">UNKNOWN / 未知</option><option value="partial">PARTIAL / 部分可用</option></select><span class="note">状态可切换，用于评审，不代表接口实测</span></div>'+
'<div class="panel identity"><div class="identity-icon">◈</div><div class="identity-main"><strong>'+esc(s.entity)+'</strong><span>示例 ID '+esc(s.entityId)+' · 来源与版本需由 Owner 重读</span></div><div class="identity-meta"><span class="chip warn">演示 · 未签收</span><span class="chip">权限独立核验</span></div></div>'+
'<div class="grid"><div class="main-col">'+mainContent(s)+'<div class="panel section"><div class="section-head"><h2>阶段与操作合同</h2><small>动作不是成功回执</small></div><div class="hint warn">'+esc(s.hint)+'</div><div class="stagebox"><strong>下一步为什么是这一步？</strong><p>'+esc(s.evidence)+'。主操作只做导航或展示交互规则；正式产品须经权限、版本与服务证据复核。</p></div><div class="toolbar" style="margin-top:14px"><button class="btn" data-act="edit" '+(!canWrite()?'disabled title="此预览角色没有写入能力"':'')+'>演示编辑与离开保护</button><button class="btn" data-act="evidence">查看证据要求</button></div></div></div>'+
'<div class="side-col"><div class="panel section"><div class="section-head"><h2>对象身份与证据</h2><small>可追溯</small></div>'+evidence+'</div><div class="panel section"><div class="section-head"><h2>下一步与专业工具</h2></div><p>'+actionHint+'</p><button class="side-action" data-act="owner">查看 Owner 事实边界 <span>↗</span></button><button class="side-action" data-tool="metadata">项目级技术元数据 <span>↗</span></button><button class="side-action" data-tool="impact">跨对象影响查询 <span>↗</span></button><button class="side-action" data-tool="quality">质量检查与诊断 <span>↗</span></button></div></div></div>'+
'<div class="footer-note">#550 · v0.1 页面结构演示。未接后端、未运行 RBAC 或浏览器 E2E；真实产品仍遵循独立 Truth Owner、菜单授权及项目隔离。</div>';
$("#previewState").value=state.mode;
}
function closeSidebar(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("open")}
document.addEventListener("click",function(ev){
var e=ev.target.closest("button");if(!e)return;
if(e.dataset.screen){go(e.dataset.screen);return}
if(e.dataset.root){go(e.dataset.root);return}
if(e.dataset.next){go(screens[state.screen].next);return}
if(e.dataset.back){back();return}
if(e.dataset.tab){state.tab=e.dataset.tab;render();return}
if(e.dataset.view){state.assetView=e.dataset.view;state.query="";render();return}
if(e.dataset.clear){state.query="";render();return}
if(e.dataset.stateReset){state.mode="ready";render();return}
if(e.dataset.row){var dest=state.screen==="G1"?"G2":state.screen==="D1"?"D2":state.screen==="D2"?"D3":state.screen==="D3"?"D4":state.screen==="G2"?"G3":null;if(dest)go(dest);else confirmDemo("查看演示对象",e.dataset.row+"：本静态原型未接后端，只提供正式页面应有的导航/回执要求。");return}
if(e.dataset.tool){confirmDemo("专业工具可发现性","“"+e.dataset.tool+"”为项目级专业入口位置示例。它必须保留独立权限和旧 URL；本轮原型不模拟其业务操作。");closeSidebar();return}
if(e.dataset.act){if(e.dataset.act==="edit"){state.dirty=true;confirmDemo("未保存编辑演示","演示已将当前工作台标记为 dirty。点击下一步会触发离开保护；没有任何内容被写入后端。")}else confirmDemo("证据与权限说明","此动作只展示正式实现要求：Owner ID、项目核验、独立授权、版本及 Run/Execution 证据；本静态样例不能替代真实业务动作。");return}
if(e.dataset.modal){if(e.dataset.modal==="ack"&&state.pending){var next=state.pending;state.pending=null;state.dirty=false;closeModal();go(next);return}state.pending=null;closeModal();return}
});
document.addEventListener("input",function(ev){if(ev.target.id==="search"){state.query=ev.target.value;var focus=ev.target.selectionStart;render();var input=$("#search");input.focus();input.setSelectionRange(focus,focus)}});
document.addEventListener("change",function(ev){if(ev.target.id==="previewState"){state.mode=ev.target.value;render()}if(ev.target.id==="role"){state.role=ev.target.value;state.mode="ready";state.dirty=false;render();toast("已切换演示画像："+roleLabel()+"（非真实授权）")}});
$("#menuBtn").addEventListener("click",function(){$("#sidebar").classList.add("open");$("#scrim").classList.add("open")});
$("#scrim").addEventListener("click",closeSidebar);
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){if($("#overlay").classList.contains("show")){state.pending=null;closeModal()}else closeSidebar()}});
render();
})();
</script>
</body></html>
