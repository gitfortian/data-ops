function v4DefaultMetric(id){
 const t=v4.metricTemplates[id]||v4.metricTemplates["MET-026"];
 return {id,formula:t.formula,filter:t.filter,prior:t.prior,checked:false,impactSeen:false,published:false,
 release:null,receipts:[],rev:0,checkRevision:-1,impactRevision:-1,dirty:false,
 version:"v1.2 · 草稿",unit:t.unit,period:t.period,dimension:t.dimension,expected:t.expected,problem:t.problem};
}
function v4DefaultModel(id){
 const t=v4.modelTemplates[id]||v4.modelTemplates["PM-701"];
 return {model:id,source:t.source,mapField:t.mapField,process:t.process,field:t.field,
 issue:t.issue,fixText:t.fixText,checked:false,fixed:false,version:null,savedVersions:[],rev:0,checkRevision:-1,dirty:false};
}
function v4DefaultQueue(id){
 return {id,queueStep:"evidence",decision:"",transferTo:"",note:"",receipts:[],dirty:false};
}
function v4StoreFor(page,id){
 const map=v4.store[page];
 return map[id]||(map[id]=page==="metric"?v4DefaultMetric(id):page==="model"?v4DefaultModel(id):v4DefaultQueue(id));
}
function v4SaveActive(page){
 const id=v4.active[page];if(!id)return;
 if(page==="metric")v4.store.metric[id]=v3.metric;
 if(page==="model")v4.store.model[id]=v3.build;
 if(page==="governance"){
  const q=v4StoreFor(page,id);
  Object.assign(q,{queueStep:v3.queueStep,decision:v3.decision,transferTo:v3.transferTo,note:v3.note,dirty:q.dirty});
 }
}
function v4Apply(page,index){
 const r=(sample[page]||[])[index];if(!r)return;
 const id=r[4],old=v4.active[page];
 if(old!==id){v4SaveActive(page);const obj=v4StoreFor(page,id);v4.active[page]=id;
   if(page==="metric")v3.metric=obj;
   if(page==="model")v3.build=obj;
   if(page==="governance"){v3.queueId=id;v3.queueStep=obj.queueStep;v3.decision=obj.decision;v3.transferTo=obj.transferTo;v3.note=obj.note}
 }
 state.select[page]=index;
}
function v4Dirty(page){
 if(page==="metric")return !!v3.metric.dirty;
 if(page==="model")return !!v3.build.dirty;
 if(page==="governance"){const q=v4.store.governance[v4.active.governance];return !!q?.dirty}
 return false;
}
function v4Switch(page,index,force=false){
 const rows=v3Rows(page);const next=(sample[page]||[])[index];if(!next)return;
 if(v4.active[page]===next[4]){state.select[page]=index;return}
 if(!force&&v4.active[page]&&v4Dirty(page)){
   v4.pending={page,from:v4.active[page],to:next[4],index,fromIndex:state.select[page]};
   return;
 }
 v4.pending=null;v4Apply(page,index);
}
function v4Prompt(){
 const p=v4.pending;if(!p||p.page!==state.page)return "";
 const r=sample[p.page].find(x=>x[4]===p.to);const old=sample[p.page].find(x=>x[4]===p.from);
 return '<div class="v4Notice" role="status"><strong>正在编辑的对象已离开当前筛选范围</strong>'+
 '<p>当前草稿属于 '+esc(old?.[0]||p.from)+' · '+esc(p.from)+'；新结果是 '+esc(r?.[0]||p.to)+' · '+esc(p.to)+'。不会自动把旧口径或处理说明带入新对象。</p>'+
 '<div class="actions"><button class="btn primary" data-v4-switch="keep">保留当前草稿并切换</button>'+
 '<button class="btn" data-v4-switch="discard">放弃当前修改并切换</button>'+
 '<button class="btn" data-v4-switch="stay">继续编辑原对象</button></div></div>';
}
function v4ResolvePending(mode){
 const p=v4.pending;if(!p)return;
 if(mode==="stay"){v4.pending=null;state.query="";state.filter="all";state.queue="all";state.tree="";renderMain();return}
 if(mode==="discard"){const prev=v4.store[p.page][p.from];
  if(p.page==="metric"){const history=prev?.receipts||[];v4.store.metric[p.from]={...v4DefaultMetric(p.from),receipts:history};}
  if(p.page==="model"){const history=prev?.savedVersions||[];v4.store.model[p.from]={...v4DefaultModel(p.from),savedVersions:history};}
  if(p.page==="governance"){const history=prev?.receipts||[];v4.store.governance[p.from]={...v4DefaultQueue(p.from),receipts:history};}
  v4.active[p.page]=null;
 }
 v4.pending=null;v4Apply(p.page,p.index);renderMain();
}
function v4InvalidMetric(m){

}
function v4ValidMetric(m){return m.checked&&m.checkRevision===m.rev}
function v4InvalidModel(b){
 b.rev++;b.checked=false;b.checkRevision=-1;b.fixed=false;b.dirty=true;
 // b.version and savedVersions remain historical; they do not validate current rev.
}
function v4ValidModel(b){return b.checked&&b.checkRevision===b.rev}

function v3Rows(id){
 let rows=(sample[id]||[]).map((r,i)=>({r,i}));
 if(id==="asset")rows=rows.filter(x=>state.view==="entity"?x.r[2]==="技术实体":x.r[2]==="治理资产");
 if(id==="governance"&&state.queue!=="all")rows=rows.filter(x=>x.r[1].includes(state.queue));
 if(id==="governance"&&v3.scope&&v3.scope.from==="asset")rows=rows.filter(x=>(v3QueueInfo[x.r[4]]||{}).subject?.includes(v3.scope.id));
 if(id==="governance")rows.sort((a,b)=>{const rank={P0:0,P1:1,P2:2};return rank[v3QueueInfo[a.r[4]].priority]-rank[v3QueueInfo[b.r[4]].priority]});
 const tree=state.tree||"";
 const treeFilter={
  "交易域":"订单|支付|退款","售后服务":"退款|退货","用户行为域":"浏览|会员","供应链域":"库存|商品",
  "交易与订单":"订单|支付","客户与会员":"会员|客户","商品管理":"商品|product",
  "基础标识":"编号|标识","交易订单":"订单|支付","金额计量":"金额","时间与日期":"时间",
  "订单主题":"订单|支付","交易指标":"订单|金额","金额指标":"金额","客户主题":"会员|客户"
 };
 if(treeFilter[tree]&&["semantic","standard","metric","asset"].includes(id))rows=rows.filter(x=>new RegExp(treeFilter[tree],"i").test(x.r.join(" ")));
 if(state.filter==="pending")rows=rows.filter(x=>/待|草稿|未|编目|仅已/.test(x.r[3]));
 if(state.filter==="done")rows=rows.filter(x=>/已保存|已定义|已上架|已执行|已配置/.test(x.r[3]));
 const q=(state.query||"").trim().toLowerCase();
 if(q)rows=rows.filter(x=>(x.r.join(" ")+(v3QueueInfo[x.r[4]]?JSON.stringify(v3QueueInfo[x.r[4]]):"")).toLowerCase().includes(q));
 return rows;
}

function v3HandleAction(a){

 if(a==="edit"){v3OpenEdit("edit");return}
 if(a==="process-next"){const r=v3Selected("semantic");if(!r)return;b.process=r[4];v3Route("standard",{id:r[4],label:r[0],relation:"业务过程"});return}
 if(a==="standard-attach"){const r=v3Selected("standard");if(!r)return;b.field=r[4];v3Route("model",{id:r[4],label:r[0],relation:"标准字段"});return}
 if(a==="model-open"){v3OpenDrawer("model");return}
 if(a==="model-check"){b.checked=false;state.tab.model="校验记录";renderMain();return}
 if(a==="model-fix"){b.fixed=true;renderMain();return}
 if(a==="model-recheck"){b.checked=!!b.fixed;renderMain();return}
 if(a==="model-save"){if(!b.checked)return; b.version="DEMO-MODEL-"+b.model+"-V2.1";renderMain();return}
 if(a==="model-next-metric"){const r=v3Selected("model");if(r)v3Route("metric",{id:r[4],label:r[0],relation:"模型引用"});return}
 if(a==="metric-validate"){m.checked=!!m.formula.trim()&&!!m.filter.trim();m.impactSeen=false;state.tab.metric="校验";renderMain();return}
 if(a==="metric-fix"){m.filter="status = PAID";m.checked=false;state.tab.metric="定义口径";renderMain();return}
 if(a==="metric-impact"){if(!m.checked)return;m.impactSeen=true;state.tab.metric="引用与影响";renderMain();return}
 if(a==="metric-to-publish"){if(!m.checked)return;m.impactSeen=true;state.tab.metric="版本与发布";renderMain();return}
 if(a==="metric-publish"){if(!(m.checked&&m.impactSeen))return;m.published=true;m.release="DEMO-METRIC-PUBLICATION-"+m.id+"-V1.2";renderMain();return}
 if(a==="metric-return"){state.tab.metric="定义口径";renderMain();return}
 if(a==="asset-drawer"){v3OpenDrawer("asset");return}
 if(a==="asset-queue"){const r=v3Selected("asset");if(!r)return;v3Route("governance",{id:r[4],label:r[0],relation:"治理记录"});return}
 if(a==="queue-evidence"){v3.queueStep="evidence";renderMain();return}
 if(a==="queue-resolve"){if(!actionAllowed())return;v3.queueStep="resolve";renderMain();return}
 if(a==="queue-review"){if(!v3.decision){toast("请选择处理或转交方式");return}if(v3.decision==="transfer"&&!v3.transferTo){toast("转交必须选择责任人");return}if(v3.note.trim().length<4){toast("请填写至少 4 字的处理依据");return}v3.queueStep="submit";renderMain();return}
 if(a==="queue-submit"){const task=v3Selected("governance");if(!task||!v3.decision)return;v3.receipts||={};v3.receipts[task[4]]="DEMO-GOV-RECEIPT-"+task[4]+"-01";v3.queueStep="receipt";renderMain();return}
 if(a==="queue-next"){v3.queueStep="evidence";v3.decision="";v3.note="";v3.transferTo="";renderMain();return}
}

  if(kind==="queue"){if(n===0)v3.queueStep="evidence";if(n===1)v3.queueStep="resolve";if(n===2&&v3.note&&v3.decision)v3.queueStep="submit";if(n===3&&v3.receipts&&v3.receipts[v3.queueId])v3.queueStep="receipt"}
  renderMain();return
 }
 if(el.dataset.v3Back){v3Back();return}
 if(el.dataset.v3Close){v3CloseDrawer();return}
 if(el.dataset.v3Edit){
  const a=el.dataset.v3Edit;
  if(a==="save"){if(v3.editing&&!v3.editing.name.trim()){toast("请填写名称");return}v3FinishEdit(false);return}
  if(a==="saveleave"){if(v3.editing&&!v3.editing.name.trim()){toast("请填写名称");return}v3FinishEdit(true);return}
  if(a==="stay"){v3ShowEdit();return}
  if(a==="discard"){const next=v3.pending;v3.pending=null;v3.editing=null;state.editDirty=false;closeDialog();if(next)go(next);return}
  if(a==="cancel"){v3DirtyDialog();return}
 }
});
document.addEventListener("input",function(ev){
 const t=ev.target;if(t.id==="v3-edit-name"&&v3.editing){v3.editing.name=t.value;state.editDirty=true}
 if(t.id==="v3-edit-note"&&v3.editing){v3.editing.note=t.value;state.editDirty=true}
 if(t.id==="v3-formula"){v3.metric.formula=t.value;v3.metric.checked=false;v3.metric.impactSeen=false;v3.metric.published=false}
 if(t.id==="v3-condition"){v3.metric.filter=t.value;v3.metric.checked=false;v3.metric.impactSeen=false;v3.metric.published=false}
 if(t.id==="v3-mapfield"){v3.build.mapField=t.value;v3.build.checked=false;v3.build.version=null}
 if(t.id==="v3-queue-note"){v3.note=t.value}
});
document.addEventListener("change",function(ev){
 const t=ev.target;
 if(t.id==="v3-queue-decision"){v3.decision=t.value;if(t.value!=="transfer")v3.transferTo="";renderMain()}
 if(t.id==="v3-transfer"){v3.transferTo=t.value}
 if(t.id==="v3-source"){v3.build.source=t.value;v3.build.checked=false;renderMain()}
});
dom("drawerShade").addEventListener("click",v3CloseDrawer);

var start=decodeURIComponent(window.location.hash.replace(/^#/,""));if(paths[start]||labels[start]||toolInfo[start]){state.page=start;state.lastMenu=domainOf(start).id}render();
})();
</script>
