function v4StoreFor(page,id){

function v4SaveActive(page){

function v4Apply(page,index){
 const r=(sample[page]||[])[index];if(!r)return;
 const id=r[4],old=v4.active[page];
 if(old!==id){if(old&&["metric","model"].includes(page))v4StoreFor(page,old).tab=state.tab[page];
  v4SaveActive(page);const obj=v4StoreFor(page,id);v4.active[page]=id;
  if(page==="metric"||page==="model")state.tab[page]=obj.tab||(page==="metric"?"定义口径":"来源映射");
   if(page==="metric")v3.metric=obj;
   if(page==="model")v3.build=obj;
   if(page==="governance"){v3.queueId=id;v3.queueStep=obj.queueStep;v3.decision=obj.decision;v3.transferTo=obj.transferTo;v3.note=obj.note}
 }
 state.select[page]=index;

function v4Dirty(page){

function v4Switch(page,index,force=false,reason="filter"){

 if(v4.active[page]===next[4]){state.select[page]=index;return}
 if(!force&&v4.active[page]&&v4Dirty(page)){
   v4.pending={page,from:v4.active[page],to:next[4],index,fromIndex:sample[page].findIndex(x=>x[4]===v4.active[page]),reason:v4.switchReason||reason};
   return;

function v4ResolvePending(mode){
 const p=v4.pending;if(!p)return;
 const prev=v4.store[p.page][p.from];
 if(mode==="stay"){
   v4.pending=null;state.select[p.page]=p.fromIndex;
   if(!v3Rows(p.page).some(x=>x.i===p.fromIndex)){state.query="";state.filter="all";state.queue="all";state.tree=""}
   v4.switchReason=null;renderMain();return;
 }
 if(mode==="discard"){
  if(p.page==="model"){
    const versions=prev?.savedVersions||[],saved=versions.at(-1);
    v4.store.model[p.from]=saved?{
     ...v4DefaultModel(p.from),model:p.from,process:saved.process,field:saved.field,
     source:saved.source,mapField:saved.mapField,rev:saved.rev,
     checked:true,checkRevision:saved.rev,fixed:true,dirty:false,version:saved.id,
     savedVersions:versions
    }:{...v4DefaultModel(p.from),savedVersions:versions};
  }
  if(p.page==="metric"){
    const receipts=prev?.receipts||[],saved=receipts.at(-1);
    v4.store.metric[p.from]=saved?{
      ...v4DefaultMetric(p.from),formula:saved.formula,filter:saved.filter,
      rev:saved.rev,checked:true,checkRevision:saved.rev,impactSeen:true,
      impactRevision:saved.rev,published:true,dirty:false,
      release:saved.id,version:(saved.version||"v1."+(1+receipts.length))+" · 已发布",receipts
    }:{...v4DefaultMetric(p.from),receipts};
  }
  if(p.page==="governance"){
    const receipts=prev?.receipts||[],saved=receipts.at(-1);
    v4.store.governance[p.from]=saved?{
      ...v4DefaultQueue(p.from),receipts,
      decision:saved.decision,transferTo:saved.transferTo,note:saved.note,
      queueStep:"receipt",dirty:false
    }:{...v4DefaultQueue(p.from),receipts};
  }
  v4.active[p.page]=null;
 }
 v4.pending=null;v4.switchReason=null;v4Apply(p.page,p.index);renderMain();
}

function v3Rows(id){

 if(id==="asset")rows=rows.filter(x=>state.view==="entity"?x.r[2]==="技术实体":x.r[2]==="治理资产");

 if(id==="governance"&&state.queue!=="all")rows=rows.filter(x=>x.r[1]===typeMap[state.queue]);
 if(id==="governance"&&v3.scope&&v3.scope.from==="asset")rows=rows.filter(x=>(v3QueueInfo[x.r[4]]||{}).subject?.includes(v3.scope.id));
 if(id==="metric"&&v3.scope&&v3.scope.from==="model"){
  const related=v4.links[v3.scope.id]||[];
  rows=rows.filter(x=>related.includes(x.r[4]));
 }
 if(id==="governance")rows.sort((a,b)=>{const rank={P0:0,P1:1,P2:2};return rank[v3QueueInfo[a.r[4]].priority]-rank[v3QueueInfo[b.r[4]].priority]});

 if(map[state.tree]&&["semantic","standard","metric","asset"].includes(id))rows=rows.filter(x=>new RegExp(map[state.tree],"i").test(x.r.join(" ")));
 if(state.filter==="pending")rows=rows.filter(x=>/待|草稿|未|编目|仅已/.test(x.r[3]));

function v6FieldCandidates(x){

 {name:m,type:m==="pay_order_cnt"?"BIGINT":"DECIMAL(20,2)",source:x.deps[0],origin:m==="pay_order_cnt"?"order_id":"pay_amount",rule:m==="pay_order_cnt"?"COUNT(DISTINCT order_id)":"SUM(pay_amount)",role:"度量",std:m==="pay_order_cnt"?"":"STD-208"}];
 }

function v6Load(mode="replace"){
 if(!actionAllowed()){toast("只读画像不能修改设计草稿");return}
 const x=v6Layer();if(!x.deps.length){toast("先选择有权限的来源或依赖模型");return}
 const incoming=v6FieldCandidates(x);if(mode==="merge"&&x.loaded){const old=new Set(x.rows.map(r=>r.name.toLowerCase()));const add=incoming.filter(r=>!old.has(r.name.toLowerCase()));x.rows.push(...add);x.note="保留已有字段，合并 "+add.length+" 个新字段；重名列没有覆盖。"}else{x.rows=incoming;x.note="从依赖结构批量加载 "+incoming.length+" 列待确认候选。"}
 v6TechRows(x);
 const seen=new Set(),clashes=[];
 for(const r of x.rows){const key=r.name.toLowerCase();if(seen.has(key))clashes.push(r.name);else seen.add(key)}
 if(mode==="merge"){const from=x.deps.flatMap(id=>v6Sources[id].cols.map(z=>z[0].toLowerCase())),repeat=from.filter((n,i)=>from.indexOf(n)!==i);clashes.push(...repeat)}
 x.conflicts=[...new Set(clashes)];x.loaded=true;x.dirty=true;x.checked=false;x.revision++;renderMain();
}
function v6Dependency(id){

 const x=v6Layer(),list=x.pending?[...x.pending]:[...x.deps],index=list.indexOf(id);

}
function v6DepDecision(act){

function v6ResolveConflicts(){

 const x=v6Layer(),seen=new Set();x.rows=x.rows.filter(r=>{const key=r.name.toLowerCase();if(seen.has(key))return false;seen.add(key);return true});

 x.conflicts=[];x.checked=false;x.dirty=true;x.revision++;renderMain();

function v6Check(){
 if(!actionAllowed()){toast("只读画像不能确认设计");return}
 const x=v6Layer();x.checked=false;
 if(!x.loaded||!x.rows.length||!x.deps.length||x.pending||x.pendingReload||x.pendingOption){toast("先选择依赖并完成结构差异确认");return}
 const names=x.rows.map(r=>r.name.trim().toLowerCase());
 if(x.conflicts.length||new Set(names).size!==names.length){toast("存在重复目标列，请先逐列修正");return}
 if(x.rows.some(r=>!r.name.trim()||!r.type.trim()||r.type==="待补充")||!x.grain.trim()){toast("补齐字段名称、有效类型与粒度");return}

}

 const r=v6CurrentCase(),c=v6.collab,notes=(c.note||"").trim();
 const reason=()=>{if(notes.length<5){toast("需补充至少 5 字原因或证据，不可无理由提交");return false}return true};
 if(action==="comment"){
  if(!reason())return;
  v6Log(r,"讨论/补充（非确认）："+notes);
 }
 if(action==="transfer"&&v6NeedsRole("coordinator","builder","steward")){
  if(!reason())return;
  if(r.transfer?.status==="待接收"){toast("上一笔转交尚未被接收或拒接");return}
  if(c.transferTo===c.role){toast("转交目标必须与当前执行职责不同");return}
  r.transfer={from:r.owner,to:c.transferTo,status:"待接收"};
  v6Log(r,"请求由 "+v6RoleNames[c.transferTo]+" 接收，原负责人仍需跟进；原因："+notes);
 }
 if(action==="takeTransfer"){
  if(r.transfer?.status!=="待接收"||c.role!==r.transfer.to){toast("只有被指定的接收职责可以正式接收");return}
  r.owner=v6RoleNames[c.role];r.next=v6RoleNames[c.role];r.transfer.status="已接收";
  v6Log(r,"接收转交，新负责人正式承接");
 }
 if(action==="rejectTransfer"){
  if(r.transfer?.status!=="待接收"||c.role!==r.transfer.to||!reason())return;
  r.transfer.status="已拒接";v6Log(r,"拒绝转交，原负责人继续跟进："+notes);
 }
 if(action==="accept"&&v6NeedsRole("coordinator")){if(r.type!=="demand"||r.status!=="待受理")return;r.status="澄清与方案";r.next="需求协调人";r.owner="数据产品协调人";v6Log(r,"已受理并进入方案澄清，尚未开始开发")}
 if(action==="scope"&&v6NeedsRole("coordinator","builder")){if(r.type!=="demand"||r.status!=="澄清与方案"||!reason())return;r.status="待业务确认";r.version="需求范围基准 R1";r.next="业务确认人";v6Log(r,"提交范围及验收标准："+notes)}
 if(action==="confirmScope"&&v6NeedsRole("owner","business")){if(r.type!=="demand"||r.status!=="待业务确认")return;r.status="建设中";r.scopeConfirmed=true;r.next="技术负责人";v6Log(r,"业务已确认本次范围与验收标准 R1；尚未代表交付")}
 if(action==="addTask"&&v6NeedsRole("builder","coordinator")){if(r.type!=="demand"||!r.scopeConfirmed)return;const id="TASK-"+(130+r.tasks.length);r.tasks.push({id,title:r.tasks.length?"指标定义与样例验证":"订单分层模型设计",owner:"数据研发",status:"未开始",source:"Modeling / Metric",result:"待关联专业版本"});v6Log(r,"新增专业任务 "+id+"（仅协作计划，未调用开发/建模服务）")}
 if(action==="attach"&&v6NeedsRole("builder","steward")){if(r.type==="demand"&&r.status!=="建设中")return;if(r.type==="issue"&&r.status!=="处置中")return;r.deliveries.push({id:"DEMO-OUTPUT-"+(r.deliveries.length+1),source:"Modeling",version:"设计草稿 V1",status:"专业验证待回读"});v6Log(r,"关联一项示例专业成果；不能据此认定运行已成功")}
 if(action==="test"&&v6NeedsRole("builder")){if(r.type!=="demand"||r.status!=="建设中"||!r.deliveries.length){toast("需先在建设中关联可审阅的交付成果");return}if(!reason())return;r.status="待验收";r.next="业务确认人";r.verified=true;v6Log(r,"提交技术验证摘要与交付清单："+notes)}
 if(action==="acceptDelivery"&&v6NeedsRole("business","owner")){if(r.type!=="demand"||r.status!=="待验收")return;r.status="待交付";r.next="技术交付人";v6Log(r,"业务按范围基准 R1 验收通过，但专业发布/交付仍待执行")}
 if(action==="deliver"&&v6NeedsRole("builder")){if(r.type!=="demand"||r.status!=="待交付"||!reason())return;r.status="已完成";r.delivered=true;r.next="无";v6Log(r,"交付记录（示例，不代表真实上架）："+notes)}
 if(action==="return"&&v6NeedsRole("business","owner")){if(r.type!=="demand"||!["待验收","待业务确认"].includes(r.status)||!reason())return;r.status="澄清与方案";r.scopeConfirmed=false;r.verified=false;r.next="需求协调人";v6Log(r,"退回修改，原版本/结论仍保留："+notes)}
 if(action==="investigate"&&v6NeedsRole("builder")){if(r.type!=="issue"||r.status!=="待确认"||!reason())return;r.status="已确认待处置";r.next="技术/治理处理人";v6Log(r,"核实分类 "+c.issueKind+"；核实结论："+notes)}
 if(action==="issueStart"&&v6NeedsRole("builder","steward")){if(r.type!=="issue"||r.status!=="已确认待处置")return;r.status="处置中";r.next="治理负责人";v6Log(r,"创建/承接问题处理，保留原核实结论")}
 if(action==="issueResolve"&&v6NeedsRole("steward","builder")){if(r.type!=="issue"||r.status!=="处置中"||!reason())return;r.status="待业务复核";r.next="业务发起人";v6Log(r,"提交处置证据与限制："+notes)}
 if(action==="issueClose"&&v6NeedsRole("business","owner")){if(r.type!=="issue"||r.status!=="待业务复核")return;r.status="已关闭";r.next="无";v6Log(r,"业务复核通过并关闭当前问题单")}
 if(action==="issueReopen"&&v6NeedsRole("business","owner")){if(r.type!=="issue"||!["已关闭","待业务复核"].includes(r.status)||!reason())return;r.status="核实中";r.next="技术核实人";v6Log(r,"保留原处置证据并重开："+notes)}
 if(action==="caliberRequest"&&v6NeedsRole("owner")){
  if(r.type!=="caliber"||r.status!=="待业务确认"||!reason())return;
  v6Log(r,"要求补充样例（不是同意）："+notes);
 }
 if(action==="caliberReject"&&v6NeedsRole("owner")){
  if(r.type!=="caliber"||r.status!=="待业务确认"||!reason())return;
  r.status="待研发补充";r.next="技术负责人";v6Log(r,"退回精确口径版本并指出分歧："+notes);
 }
 if(action==="sample"&&v6NeedsRole("analyst")){if(r.type!=="caliber"||r.status!=="待业务确认")return;r.sampleConfirmed=true;v6Log(r,"分析参与人按支付/未支付/退款/重复回传样例进行了本地确认")}
 if(action==="approve"&&v6NeedsRole("owner")){if(r.type!=="caliber"||r.status!=="待业务确认")return;if(!r.sampleConfirmed){toast("先完成分析样例核对，评论不等于确认");return}r.businessConfirmed=true;r.status="口径已确认 · 待技术验证";r.next="技术负责人";v6Log(r,"业务口径负责人确认 "+r.version+"，仅对此精确版本有效")}
 if(action==="caliberTest"&&v6NeedsRole("builder")){if(r.type!=="caliber"||!r.businessConfirmed||!reason())return;r.verified=true;r.status="待专业发布";r.next="指标发布人";v6Log(r,"当前版本的技术检查与试算："+notes)}
 if(action==="caliberHandoff"&&v6NeedsRole("builder")){if(r.type!=="caliber"||!r.verified)return;r.status="已交接发布";r.next="Metric 发布职责";v6Log(r,"交接指标中心按正式合同发布；协作不会自行写入已发布状态")}
 if(action==="newCaliber"&&v6NeedsRole("builder","owner")){if(r.type!=="caliber"||!["待研发补充","待专业发布","已交接发布"].includes(r.status)||!reason())return;r.version="MET-026 · 新草稿 v1.3";r.businessConfirmed=false;r.sampleConfirmed=false;r.verified=false;r.status="待业务确认";r.next="分析与业务确认";v6Log(r,"实质口径变更，旧 v1.2 确认不证明新 v1.3："+notes)}
 renderMain();
}

 if((c.draftTitle||"").trim().length<4||(c.draftDetail||"").trim().length<5){toast("至少填写标题与明确业务期望");return}
 const type=c.view==="issue"?"issue":c.view==="caliber"?"caliber":"demand",id=(type==="issue"?"ISS":type==="caliber"?"CAL":"REQ")+"-LOCAL-"+(v6.records.length+1);
 const x={id,type,title:c.draftTitle.trim(),expect:c.draftDetail.trim(),sourceKind:c.source?.kind||null,sourceVersion:c.source?.version||null,accept:"受理时共同补齐验收/复核标准",status:type==="issue"?"待确认":type==="caliber"?"待研发草案":"待受理",owner:"待受理",next:type==="caliber"?"研发负责人":"需求协调人",requester:v6RoleNames[c.role],version:c.source?.version||"待明确",source:c.source?.id||null,due:"待评估",planned:"待评估",tasks:[],deliveries:[],log:[{who:v6RoleNames[c.role],what:"创建本地协作记录"+(c.source?"，关联来源 "+c.source.id+" "+c.source.version:"")}]};

}
function v6ToPro(domain){

function v7Current(){return v7.models.find(x=>x.id===v7.selected)||v7.models[0]}
function v7ForLayer(layer=v6.layer){return v7.models.find(x=>x.id===v7.targetByLayer[layer])||v7.models[0]}
function v7Latest(m){return m.versions.at(-1)}
function v7LogicalTouch(m){m.rev++;for(const k of Object.keys(v7.mapping)){const x=v7.mapping[k];if(x.logicalId===m.id){x.reviewed=false;x.stale=true;if(v6.layers[k])v6.layers[k].checked=false}}}
function v7FreezeLogical(){
 if(!actionAllowed()){toast("当前专业只读画像不能保存逻辑草稿");return}
 const m=v7Current();
 if(!m.attrs.length||!m.name.trim()||!m.process.trim()||!m.grain.trim()||m.attrs.some(a=>!a.code.trim()||!a.name.trim())){toast("先完成模型名称、业务过程、粒度及属性名称/编码");return}
 const codes=m.attrs.map(a=>a.code.trim().toLowerCase());
 if(new Set(codes).size!==codes.length){toast("逻辑属性编码重复，请逐项修正");return}
 if(v7Latest(m)?.revision===m.rev){toast("当前修订已有冻结版本，无须重复创建");return}
 m.versions.push(Object.freeze({version:"L"+(m.versions.length+1),modelId:m.id,name:m.name,revision:m.rev,grain:m.grain,process:m.process,
  attrs:Object.freeze(m.attrs.map(a=>Object.freeze({...a}))),relations:Object.freeze(m.relations.map(r=>Object.freeze({...r})))}));
 toast("已保存本地逻辑快照；未完成业务批准或正式发布");renderMain();
}

function v7ScopeSignature(x){return JSON.stringify({projectId:v81.project,physicalModelId:v81Current(x.layer).id,logicalId:x.layer==="ODS"?null:v81Current(x.layer).logicalId,logicalVersion:x.layer==="ODS"?null:v7Latest(v7ForLayer(x.layer))?.version||null,layer:x.layer,deps:x.deps.map(d=>[d,v6Sources[d].version]),grain:x.grain,scd:x.scd,metric:x.metric,consumer:x.consumer,
 fields:x.rows.map(r=>[r.name,r.type,r.source,r.origin,r.rule,r.std,r.role]),rev:x.revision});}

function v7MappingState(layer=v6.layer){
 return v7.mapping[layer]||(v7.mapping[layer]={logicalId:v7ForLayer(layer).id,logicalVersion:"",selection:{},reviewed:false,stale:false,signature:"",receipt:null});
}
function v7MappingReset(){
 if(!actionAllowed()){toast("只读画像不能改写映射候选");return}
 const x=v6Layer(),p=v7MappingState(),m=v7ForLayer(),version=v7Latest(m);
 p.logicalId=m.id;p.logicalVersion=version?.version||"";p.signature=v7ScopeSignature(x);p.reviewed=false;p.stale=false;p.receipt=null;
 p.selection={};p.disposition={};p.reason={};
 const attrs=version?.attrs||[];
 x.rows.forEach((r,i)=>{const guess=attrs.find(a=>a.code.toLowerCase()===r.name.toLowerCase());p.selection[i]=guess?.id||"";
  p.disposition[i]=guess?(x.layer==="DWS"?"aggregate":"direct"):"pending";p.reason[i]="";});
 x.checked=false;x.handoff=false;renderMain();
}

function v7MappingReview(){
 const x=v6Layer(),m=v7ForLayer(),version=v7Latest(m),p=v7MappingState();
 if(!actionAllowed()){toast("只读角色仅能查看，不可确认设计映射");return}
 p.reviewed=false;x.checked=false;x.handoff=false;
 if(x.layer==="ODS"){toast("ODS 直接核对来源逐列映射");return}
 if(!version||!x.loaded){toast("先冻结逻辑版本并加载来源字段");return}
 if(m.rev!==version.revision||p.logicalVersion!==version.version||p.signature!==v7ScopeSignature(x)){toast("逻辑或物理草稿已变化，请重新冻结或生成候选");return}
 const findings=v8MappingFindings();
 if(findings.length){toast("还有 "+findings.length+" 项未说明："+findings[0]);renderMain();return}
 p.reviewed=true;p.stale=false;
 const mappings=x.rows.map((r,i)=>Object.freeze({target:r.name,sourceRef:r.source,sourceVersion:v6Sources[r.source]?.version||null,sourceColumn:r.origin,
  logicalAttributeId:p.selection[i]||null,kind:p.disposition[i],explanation:p.reason[i]||"",expression:r.rule,stdFieldId:r.std||null}));
 p.receipt=Object.freeze({logicalId:m.id,logicalVersion:version.version,physicalLayer:x.layer,signature:p.signature,
  mappings:Object.freeze(mappings),status:mappings.some(r=>r.kind==="deferred")?"已记录缺口的设计草稿":"本地对照已审阅；语义与运行待验证"});
 x.logicalRef={id:m.id,version:version.version,mappingReview:p.receipt};toast(p.receipt.status);renderMain();
}

 if(t.dataset?.v8Kind!==undefined){v8MappingDetail(Number(t.dataset.v8Kind),'disposition',t.value);renderMain();return}
 if(['v8-runtime','v8-access','v8-usage'].includes(t.id)){v8[t.id.slice(3)]=t.value;v8.result=null;renderMain()}
});
document.addEventListener('input',function(ev){
 const t=ev.target;if(t.dataset?.v8Reason!==undefined){v8MappingDetail(Number(t.dataset.v8Reason),'reason',t.value);
  const status=dom('v8-mapping-status');if(status)status.textContent='还有 '+v8MappingFindings().length+' 项待说明；本次审阅待更新';}
});

// Browser-only accessibility improvements; isolated DOM fixtures do not emulate focus.
if(typeof MutationObserver!=='undefined'&&document.body){
 const skip=document.createElement('a');skip.className='v8Skip';skip.href='#main';skip.textContent='跳到主要工作区';document.body.prepend(skip);
 dom('main').setAttribute('tabindex','-1');
 let returnFocus=null,wasOpen=false;
 const modal=dom('dialogShade');
 new MutationObserver(()=>{const open=modal.classList.contains('open');if(open&&!wasOpen){returnFocus=document.activeElement;dom('dialog').setAttribute('tabindex','-1');(dom('dialog').querySelector('input,select,textarea,button')||dom('dialog')).focus();}if(!open&&wasOpen&&returnFocus?.isConnected)returnFocus.focus();wasOpen=open;}).observe(modal,{attributes:true,attributeFilter:['class']});
 document.addEventListener('keydown',ev=>{if(ev.key!=='Tab'||!modal.classList.contains('open'))return;const focusable=[...dom('dialog').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}});
 new MutationObserver(()=>{const readOnly=!actionAllowed();dom('main').querySelectorAll('[data-v7-attr],[data-v7-rel],[data-v6-row],#v6-grain,#v6-scd,[data-v6-load],[data-v6-dep],[data-v6-tech],[data-v6-conflict],[data-v7-candidates],[data-v7-row],[data-v8-kind],[data-v8-reason]').forEach(e=>{if('disabled' in e)e.disabled=readOnly;});dom('main').querySelectorAll('input[data-v7-attr],input[data-v6-row]').forEach(e=>{if(!e.getAttribute('aria-label'))e.setAttribute('aria-label',(e.closest('tr')?.querySelector('strong')?.textContent||e.value)+' · '+(e.dataset.v7Key||e.dataset.v6Key));});}).observe(dom('main'),{childList:true});
}

var start=decodeURIComponent(window.location.hash.replace(/^#/,""));if(paths[start]||labels[start]||toolInfo[start]){state.page=start;state.lastMenu=domainOf(start).id}render();
})();
</script>
