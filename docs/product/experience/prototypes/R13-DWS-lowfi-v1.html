<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R13 DWS · 全新低保真流程原型 V1（待评审）</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#26313c;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0;font-size:14px}button,input,select,textarea{font:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
.top{background:#fff;border-bottom:1px solid #cbd2d9;padding:14px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.brand{font-size:18px;font-weight:700}.sub{font-size:12px;color:#65717d;margin-top:4px}.tag{border:1px solid #a5aeb8;border-radius:3px;padding:4px 8px;font-size:12px;background:#f8f9fa}
.layout{max-width:1510px;margin:auto;padding:18px;display:grid;grid-template-columns:225px minmax(0,1fr) 255px;gap:16px}
.panel{background:#fff;border:1px solid #c9d0d8;border-radius:5px;padding:18px}
.nav{position:sticky;top:18px;align-self:start}.nav button{width:100%;display:block;text-align:left;background:#fff;border:1px solid transparent;padding:13px 10px;margin:4px 0;line-height:1.45;border-radius:4px}
.nav button.active{border-color:#798896;background:#e9edf0;font-weight:700}.nav small{color:#6a7480;display:block;font-size:11px;margin-top:3px}
.kicker{font-size:11px;color:#566574;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:23px;margin:8px 0 8px}h2{font-size:17px;margin:24px 0 10px}h3{font-size:14px;margin:12px 0}
p{line-height:1.6}small,.muted{color:#687482}.lead{font-size:14px;color:#50606f;max-width:780px;margin-top:0}
.field{display:block;margin:12px 0}.field>span{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#40505d}
input[type=text],input:not([type]),select,textarea{width:100%;min-height:37px;border:1px solid #aeb8c1;border-radius:4px;padding:8px;background:#fff;color:#25313d}
textarea{min-height:64px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:1px solid #cbd2d9;padding:14px;margin:9px 0;border-radius:5px;background:#fcfcfd}
.tile.selected{border:2px solid #566979;background:#eff2f5}
.tile.danger{border-color:#a47474;background:#fff8f7}
.info{border-left:3px solid #7d8a97;background:#f1f3f5;padding:12px 14px;margin:14px 0;line-height:1.55}
.warn{border-left:4px solid #9d6c55;background:#f8f1ed;padding:12px 14px;margin:14px 0;line-height:1.55}
.error{border-left:4px solid #a34f4f;background:#faeded;padding:12px 14px;margin:14px 0;line-height:1.55}
.ok{border-left:4px solid #647e69;background:#eef4ef;padding:12px 14px;margin:14px 0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #9eabb6;background:#fff;border-radius:4px;padding:8px 12px;color:#263747}
.btn.primary{background:#36495a;color:#fff;border-color:#36495a}
.btn.light{background:#edf0f2}.btn.alert{border-color:#a75d5d;color:#853e3e}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #e1e4e8}
.sidebar{position:sticky;top:18px;align-self:start}.sidebar h2{margin-top:0}
.check{padding:8px 0;border-bottom:1px dashed #cbd2d9;font-size:12px}
.check.good:before{content:"✓ ";color:#4f7659;font-weight:bold}.check.bad:before{content:"! ";color:#a16244;font-weight:bold}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d4d8dd;padding:8px;text-align:left;vertical-align:top}th{background:#eff1f4}
.choice{display:block;padding:9px 0;border-bottom:1px dashed #e1e4e8;line-height:1.4}
.choice input{margin-right:8px}.pill{display:inline-block;background:#e9ecef;padding:3px 6px;margin:2px;font-size:11px}
.progress{font-size:12px;color:#65717d;margin-bottom:7px}footer{max-width:1510px;margin:4px auto 30px;padding:0 18px;color:#687482;font-size:12px}
:focus-visible{outline:3px solid #576b7e;outline-offset:2px}
@media(max-width:1060px){.layout{grid-template-columns:185px minmax(0,1fr)}.sidebar{grid-column:1/-1;position:static}.sidebar .panel{display:block}}
@media(max-width:660px){.layout{display:block;padding:10px}.nav{position:static;margin-bottom:12px}.nav button{display:inline-block;width:auto;margin:3px 1px;font-size:12px}.panel{padding:13px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:20px}}
</style>
</head>
<body>
<div class="top"><div><div class="brand">DWS · 汇总设计</div><div class="sub">R13 UX-1 · 全新低保真 V1 / 可点击评审候选 · 绝非最终 UI</div></div><div class="row"><span class="tag">项目：交易分析项目</span><span class="tag">业务过程：订单下单</span><span class="tag">原型模拟数据 / 无后端写入</span></div></div>
<div class="layout"><nav class="panel nav" id="navigation" aria-label="DWS 六屏导航"></nav><main class="panel" id="screen" aria-live="polite"></main><aside class="sidebar" id="evidence"></aside></div>
<footer>线框仅用于验证用户任务、证据和恢复路径；不复用任何 IA-550 原型、不触发 SQL、指标发布或 Runtime。建议逐一点击右侧场景按钮验收。</footer>
<script>
(function(){
"use strict";
var KEY="r13-dws-lowfi-v1-draft";
var STEPS=[["01","对象与过程","当前为谁建汇总"],["02","来源与行粒度","源事实一行是什么"],["03","业务时间与维度","目标每行是什么"],["04","度量和去重","数字为何可信"],["05","审核与发布","只发布模型设计"],["06","版本与恢复","可回读同一对象"]];
var originals={
 step:0,code:"dws_order_daily",name:"订单每日经营汇总",source:"detail",grain:"每天×城市一行",
 timezone:"Asia/Shanghai",period:"1d",businessTime:"event_time",bucket:"order_day",
 dims:["order_day","city_id"],countKey:"order_id",countMethod:"COUNT_DISTINCT",countConfirmed:false,validation:null,
 amountMode:"line",amountConfirmed:false,sourceVersionNo:2,driftReviewed:false,scenario:"normal",readOnly:false,
 savedRevision:0,published:false,dirty:true,saveUnknown:false,message:"",compareOpen:false
};
var state=Object.assign({},originals,{dims:originals.dims.slice()});
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function h(title,subtitle){return '<div class="kicker">DWS / SCREEN '+(state.step+1)+' OF 6</div><h1>'+title+'</h1><p class="lead">'+subtitle+'</p>'}
function field(label,id,val,opts){return '<label class="field"><span>'+label+'</span>'+(opts?'<select data-key="'+id+'" '+(readonly()?"disabled":"")+'>'+opts.map(function(o){return '<option value="'+e(o[0])+'" '+(String(val)===o[0]?"selected":"")+'>'+e(o[1])+'</option>'}).join("")+'</select>':'<input type="text" data-key="'+id+'" '+(readonly()?"disabled":"")+' value="'+e(val)+'">')+'</label>'}
function t(text,kind){return '<div class="'+(kind||"info")+'">'+text+'</div>'}
function b(label,act,kind,disabled){return '<button class="btn '+(kind||"")+'" data-act="'+act+'" '+(disabled?"disabled":"")+'>'+label+'</button>'}
function readonly(){return state.readOnly||state.scenario==="revoked"}
function sourceName(){return state.source==="detail"?"DWD 订单明细 V"+state.sourceVersionNo:state.source==="header"?"DWD 订单头 V3":"DWD 未发布草稿"}
function issues(){
 var z=[];
 if(state.source==="draft")z.push("所选 DWD 未发布，不能用草稿替代源版本");
 if(state.scenario==="revoked")z.push("来源 READ 权限已撤销，必须重新授权");
 if(state.scenario==="drift"&&!state.driftReviewed)z.push("上游已发布 V3，当前冻结 V2 需要差异审阅");
 if(state.scenario==="duplicate")z.push("订单头金额在明细行可能重复计量，必须改变来源/公式并重新核对");
 if(!state.grain.trim())z.push("缺少目标每行代表什么的业务粒度声明");
 if(!state.businessTime||state.businessTime==="none")z.push("没有真实业务时间字段");
 if(state.period!=="ALL"&&!state.dims.includes(state.bucket))z.push("统计周期桶未加入分组维度");
 if(state.dims.length===0)z.push("至少选一项分组维度");
 if(!state.countKey.trim()||!state.countConfirmed)z.push("订单数量 DISTINCT 业务键/去重口径未确认");
 if(state.countMethod!=="COUNT_DISTINCT")z.push("订单数量不能用 COUNT(*) 代替按 order_id 的订单去重口径");
 if(!state.amountConfirmed)z.push("支付金额聚合来源、重复计量风险未人工确认");
 if(state.source==="header"&&state.amountMode==="line")z.push("当前选订单头却引用明细金额，来源事实不一致");
 if(state.source==="detail"&&state.amountMode==="header")z.push("当前选订单明细却 SUM 订单头金额，将发生重复计量");
 if(state.savedRevision===0)z.push("尚未保存当前设计草稿");
 if(state.dirty)z.push("存在未保存的编辑，先保存再提交发布");
 if(readonly())z.push("当前用户仅可只读，禁止保存或发布");
 return z
}

function validationSignature(){
 return JSON.stringify([state.source,state.sourceVersionNo,state.businessTime,state.period,state.timezone,
 state.bucket,state.dims,state.countKey,state.countMethod,state.amountMode,state.grain,state.scenario==="duplicate"]);
}
function validationStatus(){
 if(!state.validation)return "NOT_RUN";
 return state.validation.signature===validationSignature()?state.validation.status:"STALE";
}
function validateSample(){
 var status="SAMPLE_MATCH",reason="同口径合成样本去重值与参考一致，仍不证明全量正确";
 if(state.source==="draft"||state.scenario==="revoked"||state.businessTime==="none"){
  status="UNAVAILABLE";reason="未发布/无 READ 权限/无业务时间，不能借助样本绕过";
 }else if(state.countMethod!=="COUNT_DISTINCT"||state.countKey!=="order_id"){
  status="SAMPLE_WARNING";reason="COUNT(*) 把 3 条明细当作 3 笔订单，参考业务键去重数为 2";
 }else if(state.amountMode!=="line"||state.scenario==="duplicate"){
  status="SAMPLE_WARNING";reason="订单头金额可能在明细中重复，必须核对来源和退款/折扣口径";
 }
 state.validation={status:status,signature:validationSignature(),reason:reason,
   scope:"2026-10-17 / 上海",sampleRows:3,orders:2,lineAmount:450};
 state.message="固定合成样本试算：" + status + "。结果不代表已获得真实数据库查询授权。";
}
function dwsValidationDetail(){
 var status=validationStatus(),v=state.validation;
 if(status==="NOT_RUN")return t("V1 只读样本：NOT_RUN。未连接真实查询服务，真实业务数据仍未验证。");
 if(status==="STALE")return t("V1：STALE。来源/时间/维度/公式已变化，请重新验证，不能沿用旧样本。","warn");
 if(status==="UNAVAILABLE")return t("V1：UNAVAILABLE。来源或权限不可用，不能提供样本或宣称已通过。","error");
 return '<div class="'+(status==="SAMPLE_WARNING"?"warn":"ok")+'"><strong>'+e(status)+'</strong> · 固定合成样本 · '+e(v.scope)+
 '<table><tr><th>比较</th><th>示例数值</th></tr>'+
 '<tr><td>源明细行数 COUNT(*)</td><td>3</td></tr>'+
 '<tr><td>COUNT DISTINCT(order_id)</td><td>2</td></tr>'+
 '<tr><td>当前订单数</td><td>'+(state.countMethod==="COUNT"?"3（行数）":"2（订单数）")+'</td></tr>'+
 '<tr><td>对业务参考订单数差异</td><td>'+(state.countMethod==="COUNT"?"+1 · 重复计数":"0 · 仅样本")+'</td></tr>'+
 '<tr><td>明细行金额示例合计</td><td>450（不代表支付净额）</td></tr></table>'+
 '<p>'+e(v.reason)+'</p><small>合成样本匹配 ≠ 全量核对，不自动放行 Runtime、Metric 或消费。</small></div>'+
 b("修正度量后再次验证","goto:3","light");
}
function dwsVerificationSummary(){
 return '<div class="tile"><h3>静态 / 样本 / 真实对账三层证据</h3><table>'+
 '<tr><td>V0 静态合同</td><td>'+e(issues().length?"STATIC_BLOCKED":"STATIC_PASS（模拟）")+'</td></tr>'+
 '<tr><td>V1 只读样本</td><td>'+e(validationStatus())+'（固定合成数据）</td></tr>'+
 '<tr><td>V2 真实运行后对账</td><td>NOT_EXECUTED / 未交付</td></tr></table>'+
 '<p class="muted">无法访问真实数据时必须标未验证。样本匹配不能替代真实数据质量验收。</p></div>';
}

function section(){
 switch(state.step){
 case 0:return h("先明确要建什么","不是先选择物理表。请先核对业务过程、目标行粒度和已有设计版本。")
 +'<div class="grid">'+field("DWS 模型编码","code",state.code)+field("汇总主题名称","name",state.name)+'</div>'
 +t("业务过程：订单下单 · ODS/DWD 的事实定义属于各自发布域。这里只建设可复用的主题汇总设计。")
 +'<div class="tile"><h3>最近一次工作</h3><p>模型 DWS #810 · '+(state.savedRevision?"草稿修订 R"+state.savedRevision:"尚未保存草稿")+' · '+(state.published?"设计版本已发布":"设计未发布")+'</p>'+b("直接定位最后保存的草稿","reopen")+'</div>';
 case 1:return h("来源事实和目标粒度","不要把一行订单明细误当成一笔订单；不能因为都有 order_id 就认定相同粒度。")
 +["detail","header","draft"].map(function(x){var active=state.source===x;return '<div class="tile '+(active?"selected":"")+'"><div class="row"><strong>'+({detail:"DWD 订单明细 · V"+state.sourceVersionNo,header:"DWD 订单头 · V3",draft:"DWD 尚未发布的草稿"}[x])+'</strong><span class="tag">'+(x==="draft"?"不可用":"正式发布")+'</span></div><p>'+(x==="detail"?"每行=一个订单明细 item；业务键 order_id + item_id":x==="header"?"每行=一个订单；业务键 order_id":"结构仍可能变动，不能作为 DWS 来源")+'</p>'+b(active?"当前已选择":"选择这个来源","src:"+x,"",readonly()||x==="draft")+'</div>'}).join("")
 +(state.scenario==="drift"?t("<strong>版本差异审阅：已发布 V2 → 新发布 V3</strong><br>示例差异：订单事件时间列类型或口径可能改变。必须保持 V2 并显式审阅，或选择新版重新核对去重与金额。<div class=\"actions\">"+b("确认继续采用冻结 V2","keepFrozen")+b("显式迁移到 V3 并重审度量","adoptLatest","light")+"</div>","warn"):"")
 +field("目标每行代表什么（可读业务描述）","grain",state.grain)
 +t("示例：2026-10-17 × 城市=上海 → 恰好一行；订单数必须去重，金额需审查来自头表还是明细表。","warn")
 +'<div class="row">'+b("模拟已发布来源升级 V3","scenario:drift","light")+b("模拟来源权限撤销","scenario:revoked","light")+'</div>';
 case 2:return h("先确定时间和分组粒度","一行 = 一个统计周期桶 × 一个维度值组合。先做这个决定，再定义聚合度量。")
 +'<div class="grid">'+field("统计周期","period",state.period,[["1h","按小时"],["1d","按天"],["1w","按周"],["1m","按月"],["ALL","全量（需要额外审核）"]])
 +field("IANA 时区","timezone",state.timezone)
 +field("正式上游的业务时间列","businessTime",state.businessTime,[["event_time","event_time · 业务事件时间"],["paid_at","paid_at · 支付时间"],["none","无有效业务时间（应阻断）"]])
 +field("目标时间桶","bucket",state.bucket,[["order_day","order_day · 业务日"],["order_hour","order_hour · 业务小时"],["order_week","order_week · 业务周"]])+'</div>'
 +'<h2>分组维度（可多选）</h2>'
 +["order_day","city_id","channel_id"].map(function(x){return '<label class="choice"><input type="checkbox" data-dim="'+x+'" '+(state.dims.includes(x)?"checked":"")+' '+(readonly()?"disabled":"")+'>'+x+' <small>· 来源需有真实标准字段</small></label>'}).join("")
 +t("当前目标粒度：每个 "+e(state.period)+" 时间桶 × "+e(state.dims.join(" × ")||"无维度")+" → 一行（设计示意，不是计算结果）。")
 +t("业务日切换、周起点、跨时区与夏令时、迟到数据重算，需要业务/运行专门规则；不能由「按天」选项自动保证。","warn");
 case 3:return h("每个度量，都要解释数字为什么可信","设计校验 → 固定合成样本试算 → 查看数量差异、修正并重验。真实试算另需数据源 READ 权限。")
 +'<div class="tile"><h3>① 日下单订单量</h3><p>输出字段 order_count · 来源：'+e(sourceName())+'</p>'
 +field("当前订单数量计算方式","countMethod",state.countMethod,[["COUNT","COUNT(*) · 明细行数（可能错误）"],["COUNT_DISTINCT","COUNT DISTINCT(order_id) · 按订单去重"]])
 +field("DISTINCT 业务键","countKey",state.countKey)
 +'<label class="choice"><input type="checkbox" data-check="countConfirmed" '+(state.countConfirmed?"checked":"")+' '+(readonly()?"disabled":"")+'>业务负责人确认订单数按业务键去重，已核对取消/重复订单规则</label></div>'
 +'<div class="tile '+(!state.amountConfirmed?"danger":"")+'"><h3>② 支付金额</h3><p>输出字段 paid_amount · 函数 SUM。若订单头总额复制到每行，直接 SUM 将重复计量。</p>'
 +field("来源金额模式","amountMode",state.amountMode,[["line","明细行金额（需核对折扣/退款）"],["header","订单头金额（存在多明细重复风险）"]])
 +'<label class="choice"><input type="checkbox" data-check="amountConfirmed" '+(state.amountConfirmed?"checked":"")+' '+(readonly()?"disabled":"")+'>已确认来源金额粒度、支付状态/退款/折扣过滤、重复计量与精度口径</label></div>'
 +t("设计通过不等于 Metric 口径正式发布。需要引用 Metric 原域版本与标准审核，不能在这里生成假指标。","warn")
 +b("模拟未确认重复计量风险","scenario:duplicate","light")
 +'<div class="tile"><h3>验证计算 · 三层证据（仅线框）</h3>'+t("同一业务日/上海：O001-01=100、O001-02=200、O002-01=150。全部为固定合成样本，不是仓库查询。")
 +b("验证计算（固定样本模拟）","validateSample","primary")+dwsValidationDetail()+'</div>';
 case 4:var errors=issues();return h("先审核设计，再决定发布","发布的是不可变 Modeling 设计，不启动 SQL、不产生 Runtime ExecutionId，也不会自动开放 Dataset/Service。")
 +'<div class="grid"><div class="tile"><h3>当前设计摘要</h3><p>模型：'+e(state.code)+'<br>源：'+e(sourceName())+'<br>粒度：'+e(state.grain)+'<br>时间：'+e(state.period)+' / '+e(state.timezone)+'<br>分组：'+e(state.dims.join(" × "))+'</p></div><div class="tile"><h3>版本身份</h3><p>项目：交易分析项目<br>草稿：R'+state.savedRevision+'<br>当前上游：'+e(state.source==="detail"?"DWD #701 V2":state.source==="header"?"DWD #700 V3":"未发布")+'<br>发布：'+(state.published?"设计已发布":"未发布")+'</p></div></div>'
 +dwsVerificationSummary()
 +(errors.length?t("<strong>发布阻断项（"+errors.length+"）</strong><ol>"+errors.map(function(x){return "<li>"+e(x)+"</li>"}).join("")+"</ol>","error"):t("所有示例设计条件已具备，可执行「发布设计」模拟；此模拟不会调用后端。","ok"))
 +'<div class="actions">'+b("保存设计草稿","save","",readonly())+b("发布 DWS 设计版本（模拟）","publish","primary",errors.length>0||readonly())+'</div>';
 case 5:return h("保存、重开、版本漂移和回到来源","设计的证据与真实运行状态分开。重开应定位同一个模型、同一个草稿修订。")
 +'<div class="tile"><h3>模型 DWS #810 / '+e(state.code)+'</h3><p>草稿 Revision：R'+state.savedRevision+' · '+(state.published?"已发布设计 V1":"设计未发布")+'</p><p>上游锁定：'+e(sourceName())+'</p><div class="actions">'+b("重新打开已保存草稿","reopen")+b("返回来源与粒度审阅","goto:1")+b("重置原型演示","reset","alert")+'</div></div>'

function persist(){
 var keep=Object.assign({},state,{readOnly:false,saveUnknown:false,message:"",dirty:false,step:5});
 localStorage.setItem(KEY,JSON.stringify(keep))
}
function action(act){
 if(act==="prev"){state.step=Math.max(0,state.step-1)}
 else if(act==="next"){state.step=state.step===5?0:state.step+1}
 else if(act==="save"){
  if(readonly()){state.message="没有编辑权限，禁止保存";refresh();return}
  state.savedRevision+=1;state.dirty=false;persist();
  state.saveUnknown=state.scenario==="timeout";
  state.message=state.saveUnknown?"保存请求超时：结果未知！请按模型 ID 与修订号回读，勿重复创建。":"草稿已保存 R"+state.savedRevision+"；这是线框本地模拟，无后端持久写入。"
 }
 else if(act==="verify"){var v=localStorage.getItem(KEY);state.saveUnknown=false;state.message=v?"按 DWS #810 回读到草稿 R"+JSON.parse(v).savedRevision+"：已确认记录存在":"没有查到草稿，应保持未知并人工核对"}
 else if(act==="reopen"){var raw=localStorage.getItem(KEY);if(!raw){state.message="没有已保存的草稿；请先保存";refresh();return}state=Object.assign({},originals,JSON.parse(raw),{step:5,message:"已按 projectId + modelId + draftRevision 重开保存版本（模拟）。"});}
 else if(act==="publish"){var problems=issues();if(problems.length){state.message="发布阻断："+problems.join("；")}else{state.published=true;state.dirty=false;persist();state.message="仅模拟设计发布成功 V1；DataDev 未运行、数据未验收。"}}
 else if(act==="validateSample"){validateSample();}
 else if(act==="keepFrozen"){state.driftReviewed=true;state.dirty=true;state.message="已显式选择继续沿用冻结 V2；需要重新保存并按权限发布。此原型不证明源端旧版一定仍可访问。";}
 else if(act==="adoptLatest"){state.sourceVersionNo=3;state.driftReviewed=false;state.scenario="normal";state.countConfirmed=false;state.amountConfirmed=false;state.dirty=true;state.message="已迁移到 V3 候选，旧草稿保留；请重新核对业务时间、去重业务键与金额口径，然后保存新修订。";}
 else if(act==="reset"){localStorage.removeItem(KEY);state=Object.assign({},originals,{dims:originals.dims.slice(),message:"原型已重置，所有例子都是测试数据"});}
 else if(act.indexOf("src:")===0){if(state.dirty&&state.savedRevision) {if(!confirm("切换事实来源可能改变业务粒度与指标含义。是否继续并保留当前修改状态供重新审阅？"))return;}state.source=act.slice(4);state.sourceVersionNo=2;state.driftReviewed=false;state.dirty=true;state.amountConfirmed=false;state.countConfirmed=false;state.message="已更换上游来源。请重新核对粒度、业务键与所有度量，不会静默沿用旧确认。"}
 else if(act.indexOf("goto:")===0){state.step=Number(act.slice(5))}
 else if(act.indexOf("scenario:")===0){var s=act.slice(9);state.scenario=s;state.readOnly=s==="readonly";state.saveUnknown=false;state.driftReviewed=false;state.message=s==="normal"?"已恢复正常演示状态。":s==="timeout"?"点击「保存草稿」模拟请求已落库但回执丢失；然后回读":s==="duplicate"?"假设头部金额在每条明细重复，必须重新审阅 SUM 口径":s==="drift"?"有新的 DWD 已发布，当前设计仍锁定旧版本，请比较差异":"当前案例阻断编辑或发布；请走授权恢复路径";}
 refresh()
}
