'<div class="split medium"><div class="card"><div class="listhead"><div><strong>'+esc(t[3])+'</strong><p>此为该专业能力的信息结构设计，尚未接入正式服务</p></div><span class="tag warn">示例集合</span></div>'+filters()+(state.status!=="ready"?statePanel():('<div class="tableScroll"><table><thead><tr><th>专业对象</th><th>来源范围</th><th>Owner</th><th>状态</th><th>查看</th></tr></thead><tbody>'+overrideRows.filter(function(r){return r.join(" ").toLowerCase().includes(state.query.toLowerCase())}).map(function(r,i){return '<tr><td><span class="rowtitle">'+esc(r[0])+'</span><small>'+esc(r[4])+'</small></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+badge(r[3])+'</td><td><button class="link" data-action="evidence">证据 ›</button></td></tr>'}).join("")+'</tbody></table></div>'))+'</div><div class="card inspect"><small class="label">访问合同</small><h3>'+esc(t[2])+' 独立授权</h3><p>专业工具应保留原业务权限和菜单身份，不因收敛到工作台新增其它门槛。</p><div class="kv"><div class="kvrow"><span>对象范围</span><b>项目级 / 集合 / 反向查询</b></div><div class="kvrow"><span>访问身份</span><b>原 leaf menuCode</b></div><div class="kvrow"><span>跳转上下文</span><b>精确重验 projectHint</b></div><div class="kvrow"><span>真实回执</span><b>尚无（静态原型）</b></div></div><div class="softPanel">专业集合入口始终可发现，但只有授权的用户才能实际访问受限 API。</div></div></div>';
}
function placeholderPage(id){
var d=domainOf(id);return pageHead(nameOf(id),"完整 V3.1 导航中的既有能力；本轮不重构其生产页面或菜单授权。","UNMODIFIED / NAVIGATION PLACEHOLDER",'<button class="btn" data-palette="1">'+icon("grid")+' 查看全部菜单</button>')+
'<div class="placeholder"><div><div class="placeholderIcon">'+icon(d.icon)+'</div><div class="caps">OUT OF CURRENT REBUILD SCOPE</div><h2>'+esc(nameOf(id))+' · 页面占位</h2><p>这个入口来自最新 IA V3.1 菜单规划，属于“'+esc(d.name)+'”。真实生产页面沿用现有功能与权限；原型不在这里模拟未授权的业务行为，也不会显示伪造的数据。</p><div class="placeholderLink"><button class="btn" data-page="semantic">查看定义域重设计</button><button class="btn primary" data-page="asset">查看治理域重设计</button></div><div class="softPanel" style="margin-top:24px;text-align:left;max-width:520px">现有访问路径：<strong>'+esc(routeFor[id]||"原系统既有入口")+'</strong><br>不对项目配置、授权、菜单授权或后端状态作任何修改。</div></div></div>';
}
function renderMain(){
nav();dom("roleSwitch").value=state.role;var id=state.page;dom("main").innerHTML=notice()+(id==="model"?modelPage():id==="asset"?assetPage():id==="governance"?queuePage():["semantic","standard","metric"].includes(id)?definitionPage(id):["quality","security","lifecycle","mdm"].includes(id)?specialistPage(id):toolInfo[id]?toolPage(id):placeholderPage(id))+
'<div class="explain">'+icon("file")+'<span class="explaintxt"><b>设计边界：</b>仅标准、指标与建模以及数据资产与治理两域做页面重建原型；其余三域、首页、待办与平台设置都是导航占位。全部数据为虚构示例，正式产品的权限、版本、执行、发布、审计仍以原 Truth Owner 为准。</span></div>';
var sf=dom("statusFilter");if(sf)sf.value=state.filter;
}
function render(){renderMain()}
function toast(text){var x=dom("toast");x.textContent=text;x.classList.add("show");if(window.tmr)clearTimeout(window.tmr);window.tmr=setTimeout(function(){x.classList.remove("show")},3700)}
function closeDialog(){dom("dialogShade").classList.remove("open");dom("dialogShade").setAttribute("aria-hidden","true");state.dialogName=""}
function openDialog(kind,title,body,pending){
state.dialogName=kind;state.pending=pending;var edit=kind==="edit";dom("dialog").innerHTML='<h2 id="dialogTitle">'+esc(title)+'</h2><p>'+esc(body)+'</p>'+(edit?'<label class="dlgfield">对象名称（本地草稿演示）<input id="editTitle" value="'+esc((chosen()||[])[0]||"示例对象")+'"></label><label class="dlgfield">变更说明<textarea id="editNotes" placeholder="说明变更目的..."></textarea></label>':"")+
'<div class="dlgfoot">'+(kind==="dirty"?'<button class="btn" data-modal="stay">继续编辑</button><button class="btn" data-modal="discard">放弃更改并离开</button>':edit?'<button class="btn" data-modal="cancel">取消</button><button class="btn primary" data-modal="draft">仅保存本地草稿</button>':'<button class="btn primary" data-modal="cancel">知道了</button>')+'</div>';
dom("dialogShade").classList.add("open");dom("dialogShade").setAttribute("aria-hidden","false");setTimeout(function(){var el=dom("editTitle")||dom("dialog").querySelector("button");if(el)el.focus()},0);
}
function onAction(a){
if(a.indexOf("goto:")===0){go(a.split(":")[1]);return}
if(a==="openTools"){var d=domainOf(state.page);if(!d.tools.length){toast("当前工作台没有额外专业工具");return}state.dialogName="tools";dom("dialog").innerHTML='<h2 id="dialogTitle">'+esc(d.name)+' · 专业工具</h2><p>以下是 V3.1 中独立的专业集合入口，不要求先打开某个对象。</p>'+d.tools.map(function(t){return '<button class="side-action" data-page="'+esc(t[0])+'">'+esc(t[1])+'　›</button>'}).join("")+'<div class="dlgfoot"><button class="btn" data-modal="cancel">关闭</button></div>';dom("dialogShade").classList.add("open");dom("dialogShade").setAttribute("aria-hidden","false");return}
if(a==="edit"){if(!actionAllowed())return;openDialog("edit","新建 / 编辑对象 · 演示","此表单演示清晰校验、脏数据离开保护与保存草稿；不会修改真实系统。");return}
if(a==="review"){openDialog("info","治理处理条件","盘点 PENDING 不等于上架完成，对账 ACCEPTED 仅代表受理。正式处理必须核验对象、责任人、授权和真实回执。");return}
if(a==="scope"){toast("分类及范围须由真实 Owner 读取；当前仅做视觉结构演示。");return}
openDialog("info",a==="evidence"?"事实证据与权限边界":"原型交互说明","展示项目、对象、版本与 Run 的精确标识。正式系统须重新校验授权并读取 Owner 回执；当前原型没有服务调用，也没有发布、执行或审批动作。");
}
function paletteList(q){q=(q||"").trim().toLowerCase();var entries=[];domains.forEach(function(d){d.items.forEach(function(id){entries.push({id:id,domain:d.name,title:nameOf(id),other:!isTarget(id)})});d.tools.forEach(function(t){entries.push({id:t[0],domain:d.name,title:t[1]+" · 专业工具",other:!isTarget(t[0])})})});var match=entries.filter(function(e){return (e.title+" "+e.domain).toLowerCase().includes(q)});dom("paletteResults").innerHTML=match.length?match.map(function(e){return '<button class="paletteEntry" data-page="'+e.id+'"><span>'+esc(e.title)+' <small>'+esc(e.domain)+'</small></span><span class="tag '+(e.other?"":"good")+'">'+(e.other?"占位":"重建设计")+'</span></button>'}).join(""):'<div class="stateArea"><h3>没有找到入口</h3><p>试试名称、业务域或专业工具。</p></div>'}
function openPalette(){dom("paletteShade").classList.add("open");dom("paletteShade").setAttribute("aria-hidden","false");dom("paletteInput").value="";paletteList("");setTimeout(function(){dom("paletteInput").focus()},0)}
function closePalette(){dom("paletteShade").classList.remove("open");dom("paletteShade").setAttribute("aria-hidden","true")}
document.addEventListener("click",function(e){
var x=e.target.closest("button");if(!x)return;
if(x.dataset.domain){state.lastMenu=x.dataset.domain;var d=domains.find(function(a){return a.id===state.lastMenu});if(d&&d.items.length)go(d.items[0]);return}
if(x.dataset.page){closeDialog();closePalette();go(x.dataset.page);return}
if(x.dataset.palette){openPalette();closeMobile();return}
if(x.dataset.select){selectRow(Number(x.dataset.select));return}
if(x.dataset.tree){state.tree=x.dataset.tree;renderMain();return}
if(x.dataset.tab){state.tab[state.page]=x.dataset.tab;renderMain();return}
if(x.dataset.view){state.view=x.dataset.view;state.query="";state.select.asset=state.view==="entity"?3:0;renderMain();return}
if(x.dataset.queue){state.queue=x.dataset.queue;state.select.governance=0;renderMain();return}
if(x.dataset.model){state.select.model=Math.max(0,sample.model.findIndex(function(r){return r[4]===x.dataset.model}));renderMain();return}
if(x.dataset.stateReset){state.status="ready";renderMain();return}
if(x.dataset.clear){state.query="";renderMain();return}
if(x.dataset.action){onAction(x.dataset.action);return}
if(x.dataset.modal){var t=x.dataset.modal;if(t==="draft"){state.editDirty=false;toast("演示草稿已记录在当前页面；未调用后端保存接口。");closeDialog();return}if(t==="discard"){var to=state.pending;state.editDirty=false;closeDialog();go(to);return}if(t==="stay"){closeDialog();return}closeDialog();return}
});
document.addEventListener("input",function(e){
if(e.target.id==="localSearch"){var sel=e.target.selectionStart;state.query=e.target.value;renderMain();var field=dom("localSearch");if(field){field.focus();field.setSelectionRange(sel,sel)}}if(e.target.id==="editTitle"||e.target.id==="editNotes")state.editDirty=true;if(e.target.id==="paletteInput")paletteList(e.target.value);
});
document.addEventListener("change",function(e){if(e.target.id==="stateMode"){state.status=e.target.value;renderMain()}if(e.target.id==="statusFilter"){state.filter=e.target.value;renderMain()}if(e.target.id==="roleSwitch"){state.role=e.target.value;state.editDirty=false;renderMain();toast("仅切换原型角色画像；真实权限需后端独立鉴权。")}});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}if(e.key==="Escape"){closeDialog();closePalette();closeMobile()}});
dom("openPalette").addEventListener("click",openPalette);dom("projectBtn").addEventListener("click",function(){openDialog("info","项目上下文与数据隔离","Retail Analytics 是静态演示项目。真实切换应验证项目权限、清除旧选择、忽略迟到请求，并对对象重新鉴权。")});dom("helpBtn").addEventListener("click",function(){openDialog("info","完整菜单与双域设计","按最新 IA V3.1 显示五个业务域的 20 个默认任务入口，加上工作首页、待办、平台设置及各域专业工具。本轮只有定义/治理两域设计新页面；其他域为占位。")});
dom("mobileToggle").addEventListener("click",function(){dom("rail").classList.add("drawerOpen");dom("side").classList.add("drawerOpen");dom("mobileShade").classList.add("active")});dom("mobileShade").addEventListener("click",closeMobile);
dom("dialogShade").addEventListener("click",function(e){if(e.target===dom("dialogShade")&&!state.editDirty)closeDialog()});dom("paletteShade").addEventListener("click",function(e){if(e.target===dom("paletteShade"))closePalette()});
window.addEventListener("hashchange",function(){var id=decodeURIComponent(window.location.hash.replace(/^#/,""));if((paths[id]||labels[id]||toolInfo[id]||domains.some(function(d){return d.tools.some(function(t){return t[0]===id})}))&&state.page!==id){state.editDirty=false;state.page=id;state.lastMenu=domainOf(id).id;state.query="";state.status="ready";render()}});
var start=decodeURIComponent(window.location.hash.replace(/^#/,""));if(paths[start]||labels[start]||toolInfo[start]){state.page=start;state.lastMenu=domainOf(start).id}render();
})();
</script>
