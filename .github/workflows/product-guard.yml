name: Product Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-guard:
    name: Product governance checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Check product baseline
        run: node scripts/product/check-product-baseline.mjs

      - name: Check PR product impact
        run: node scripts/product/check-product-pr.mjs

      - name: Check product surface growth
        run: node scripts/product/check-product-surface.mjs
