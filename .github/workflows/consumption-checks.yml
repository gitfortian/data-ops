name: Consumption Checks

on:
  pull_request:
    paths:
      - 'yak-ops-business/yak-ops-business-consumption/**'
      - 'yak-ops-ui/src/services/consumption/**'
      - 'yak-ops-ui/src/pages/data-analysis/consumption/**'
      - 'yak-ops-ui/src/pages/data-analysis/data-catalog/**'
      - 'yak-ops-ui/src/pages/home/**'
      - 'yak-ops-ui/config/routes.ts'
      - '.github/workflows/consumption-checks.yml'

jobs:
  backend-consumption:
    name: Backend consumption contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Phase 4 consumption contract, provider and discovery tests
        run: >-
          mvn -B
          -pl yak-ops-business/yak-ops-business-consumption
          -am
          -Dtest=ConsumptionContractFoundationTest,DatasetDataProductProviderTest,DataServiceDataProductProviderTest,ProductDiscoveryServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  frontend-consumption:
    name: Frontend consumption typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yak-ops-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yak-ops-ui/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck consumption UI
        run: yarn tsc
