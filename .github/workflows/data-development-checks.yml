name: Data Development Checks

on:
  pull_request:
    paths:
      - 'data-ops-ui/src/pages/development/data-development/**'
      - 'data-ops-ui/src/pages/data-asset/**'
      - 'data-ops-ui/src/services/data-development/**'
      - 'data-ops-ui/src/locales/**/data-development-*.ts'
      - 'data-ops-business/data-ops-business-data-development/**'
      - 'data-ops-business/data-ops-business-dataset/**'
      - 'data-ops-business/data-ops-business-asset/**'
      - '.github/workflows/data-development-checks.yml'

jobs:
  frontend-authoring:
    name: Frontend authoring tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-ops-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Yarn classic
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Run Data Development governance tests
        run: >-
          yarn jest
          src/pages/development/data-development
          src/pages/data-asset/constants.test.ts
          src/pages/data-service/utils.test.ts
          --runInBand

  backend-data-development:
    name: Backend Data Development and governance tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run publish, execution and governance truth tests
        run: >-
          mvn -B
          -pl data-ops-business/data-ops-business-data-development,data-ops-business/data-ops-business-dataset,data-ops-business/data-ops-business-asset
          -am
          -Dtest=DevelopmentTaskPublishValidationTest,DevelopmentTaskExecutionControlServiceTest,DevelopmentLineageEvidenceServiceTest,DevelopmentLineageWorkerTest,DevelopmentLineageWriteTransactionTest,DevelopmentSqlLineagePreviewServiceTest,DataDevelopmentDependencyBoundaryTest,DatasetPublisherTest,DatasetVersionWriterTest,DatasetDevelopmentSourceServiceTest,AssetSourceLookupServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
