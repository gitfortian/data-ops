name: Architecture Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Architecture impact and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.plan.outputs.full }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      modules: ${{ steps.plan.outputs.modules }}
      jest_targets: ${{ steps.plan.outputs.jest_targets }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test PR impact selection
        run: node --test scripts/ci/*.test.mjs
      - name: A8 Security Persistence MyBatis single owner and compatibility
        run: node scripts/architecture/check-security-persistence-owner.mjs
      - name: A8 Security permission declaration single-owner contract
        run: node scripts/architecture/check-security-declaration-owner.mjs
      - name: A8 Security permission normalization owner
        run: node scripts/architecture/check-security-registration-plan-owner.mjs
      - name: A8 Security Permission DAO and model unique owner
        run: node scripts/architecture/check-security-permission-persistence-owner.mjs
      - name: A8 Project/RBAC relation and grant port unique owner
        run: node scripts/architecture/check-security-relations-owner.mjs
      - name: A8 Project and Role membership Platform interface bridges
        run: node scripts/architecture/check-security-membership-ports.mjs
      - name: A8 Project and Role pure model unique owner
        run: node scripts/architecture/check-security-project-role-model-owner.mjs
      - name: A8 MySQL and PostgreSQL Security RBAC test matrix
        run: node scripts/architecture/check-security-rbac-db-matrix.mjs
      - name: A8 Security Identity, Auth and User/Dept unique Platform owner
        run: node scripts/architecture/check-security-identity-context-owner.mjs
      - name: A8 Security extensions, default implementations and pure SPI ownership
        run: node scripts/architecture/check-security-extension-owner.mjs
      - name: A8 Security API seventy-five DTO/VO/enum single-owner contract
        run: node scripts/architecture/check-security-api-contract-owner.mjs
      - name: A8 Security runtime adapter, configuration and HTTP/audit unique owners
        run: node scripts/architecture/check-security-runtime-owner.mjs
      - name: A8 Security Platform permission ownership
        run: node scripts/architecture/check-security-permission-owner.mjs
      - name: Plan fail-safe PR validation scope
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/impact-plan.mjs
      - name: Architecture and release unit contracts
        run: node --test scripts/architecture/*.test.mjs scripts/release/*.test.mjs
      - name: Dependency and persistence boundaries
        run: node scripts/architecture/check-boundaries.mjs
      - name: Frontend import boundaries
        run: node scripts/architecture/check-frontend-boundaries.mjs
      - name: Migration history consistency
        run: node scripts/db/check-migration-history.mjs

  backend:
    name: Architecture and complete backend contracts
    needs: [impact]
    if: needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: architecture-ci
          MYSQL_DATABASE: architecture_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -parchitecture-ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: architecture-ci
          POSTGRES_DB: architecture_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d architecture_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      ARCHITECTURE_REDIS_HOST: 127.0.0.1
      ARCHITECTURE_REDIS_PORT: '6379'
      ARCHITECTURE_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/architecture_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      ARCHITECTURE_MYSQL_USERNAME: root
      ARCHITECTURE_MYSQL_PASSWORD: architecture-ci
      ARCHITECTURE_PG_URL: jdbc:postgresql://127.0.0.1:5432/architecture_ci
      ARCHITECTURE_PG_USERNAME: postgres
      ARCHITECTURE_PG_PASSWORD: architecture-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test affected Maven modules or full Boot
        env:
          FULL: ${{ needs.impact.outputs.full }}
          MODULES: ${{ needs.impact.outputs.modules }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FULL" == 'true' ]]; then
            bash ./mvnw -B -ntp -pl data-ops-boot -am verify
          else
            if [[ -z "$MODULES" ]]; then
              echo "::error::Backend requested without a selected module."
              exit 1
            fi
            # Modules are validated existing reactor paths, never user-provided shell code.
            bash ./mvnw -B -ntp -pl "$MODULES" -am test
          fi
      - name: Verify compiled Workflow HTTP schema
        if: needs.impact.outputs.full == 'true'
        run: node scripts/contracts/workflow-schema.mjs

  frontend:
    name: Complete frontend contracts
    needs: [impact]
    if: needs.impact.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-ops-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: data-ops-ui/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: Run full or affected frontend Jest suites
        shell: bash
        env:
          FULL: ${{ needs.impact.outputs.full }}
          JEST_TARGETS: ${{ needs.impact.outputs.jest_targets }}
        run: |
          set -euo pipefail
          if [[ "$FULL" == 'true' ]]; then
            yarn jest --runInBand
          else
            if [[ -z "$JEST_TARGETS" ]]; then
              echo "::error::Frontend requested without Jest targets."
              exit 1
            fi
            IFS=',' read -r -a targets <<< "$JEST_TARGETS"
            yarn jest "${targets[@]}" --runInBand --passWithNoTests
          fi
      - run: node scripts/check-type-baseline.mjs
      - name: Build complete frontend release artifact
        if: needs.impact.outputs.full == 'true'
        run: yarn build
      - uses: actions/upload-artifact@v4
        if: needs.impact.outputs.full == 'true'
        with:
          name: architecture-frontend
          path: data-ops-ui/dist

  distribution:
    name: Distribution source and artifact consistency
    needs: [impact, backend, frontend]
    if: needs.impact.outputs.full == 'true' && needs.backend.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: architecture-frontend
          path: data-ops-ui/dist
      - run: node scripts/release/frontend-artifact.mjs
      - run: bash ./mvnw -B -ntp verify
      - run: tar -tzf data-ops-dist/target/yak-ops-*.tar.gz | grep '/web/build-manifest.json$'

  a8-integration:
    name: A0-A8 ordered migration / runtime / UI acceptance (read-only)
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/a8-2n-p-security-runtime-batch'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 115
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: architecture-ci
          MYSQL_DATABASE: architecture_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -parchitecture-ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architecture
          POSTGRES_PASSWORD: architecture-ci
          POSTGRES_DB: architecture_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U architecture -d architecture_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ARCHITECTURE_REDIS_HOST: 127.0.0.1
      ARCHITECTURE_REDIS_PORT: '6379'
      GITHUB_TOKEN: ${{ github.token }}
      ARCHITECTURE_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/architecture_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      ARCHITECTURE_MYSQL_USERNAME: root
      ARCHITECTURE_MYSQL_PASSWORD: architecture-ci
      ARCHITECTURE_POSTGRESQL_URL: jdbc:postgresql://127.0.0.1:5432/architecture_ci
      ARCHITECTURE_POSTGRESQL_USERNAME: architecture
      ARCHITECTURE_POSTGRESQL_PASSWORD: architecture-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: data-ops-ui/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm install --global yarn@1.22.22
      - name: Verify preview guard unit tests
        run: node --test scripts/architecture/a8-final-integration-preview.test.mjs
      - name: Simulate seventeen protected PR merges and run complete acceptance
        shell: bash
        run: |
          set -euo pipefail
          preview="$RUNNER_TEMP/a8-final-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          report="$RUNNER_TEMP/a8-final-combination-snapshot.json"
          trap 'git worktree remove --force "$preview" 2>/dev/null || true' EXIT
          node scripts/architecture/a8-final-integration-preview.mjs prepare "$preview" "$report"
          # The read-only API token is only needed to pin the PR snapshot.
          # Do not expose it to arbitrary combined-branch build/test commands.
          unset GITHUB_TOKEN
          cd "$preview"
          node --test scripts/architecture/*.test.mjs scripts/ci/*.test.mjs scripts/release/*.test.mjs
          node scripts/architecture/check-security-persistence-owner.mjs
          node scripts/architecture/check-security-membership-ports.mjs
          node scripts/architecture/check-security-runtime-owner.mjs
          node scripts/architecture/check-boundaries.mjs
          node scripts/architecture/check-frontend-boundaries.mjs
          node scripts/architecture/check-persistence-consumers.mjs --json > "$RUNNER_TEMP/a8-final-persistence-consumers.json"
          node scripts/db/check-migration-history.mjs
          node scripts/db/check-flyway-ownership.mjs --json > "$RUNNER_TEMP/a8-final-flyway-ownership.json"
          cd data-ops-ui
          yarn install --frozen-lockfile
          yarn jest --runInBand
          node scripts/check-type-baseline.mjs
          yarn build
          cd ..
          # Run the full reactor against MySQL with the PostgreSQL smoke disabled.
          # application.yml defaults to the mysql profile; set it explicitly for
          # deterministic driver selection even when both CI database URLs exist.
          env -u ARCHITECTURE_POSTGRESQL_URL SPRING_PROFILES_ACTIVE=mysql \
            bash ./mvnw -B -ntp verify

          # Use the actual PostgreSQL profile for a second *targeted* Boot smoke.
          # Isolate MySQL smoke via its opt-in variable. Otherwise Spring can bind
          # the MySQL driver from the default profile to the PostgreSQL JDBC URL.
          env -u ARCHITECTURE_MYSQL_URL SPRING_PROFILES_ACTIVE=postgresql \
            bash ./mvnw -B -ntp -pl data-ops-boot -am \
              -Dtest=PostgresqlStorageSmokeTest \
              -Dsurefire.failIfNoSpecifiedTests=false test
          node scripts/release/frontend-artifact.mjs
          tar -tzf data-ops-dist/target/yak-ops-*.tar.gz | grep '/web/build-manifest.json
      - name: Retain precise SHA snapshot and inventories, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-a8-final-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a8-final-combination-snapshot.json
            ${{ runner.temp }}/a8-final-combination-snapshot.md
            ${{ runner.temp }}/a8-final-persistence-consumers.json
            ${{ runner.temp }}/a8-final-flyway-ownership.json
          if-no-files-found: warn
          retention-days: 30

          # Reverse each local merge and prove the exact original main source tree
          # is restored; the verifier touches only this disposable worktree.
          node scripts/architecture/a8-final-integration-preview.mjs rollback "$preview" "$report"
      - name: Retain precise SHA snapshot and inventories, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-a8-final-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a8-final-combination-snapshot.json
            ${{ runner.temp }}/a8-final-combination-snapshot.md
            ${{ runner.temp }}/a8-final-persistence-consumers.json
            ${{ runner.temp }}/a8-final-flyway-ownership.json
          if-no-files-found: warn
          retention-days: 30

  gate:
    name: Architecture gate
    if: always()
    needs: [impact, backend, frontend, distribution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the required scope without accepting unexpected skips
        env:
          PLAN: ${{ needs.impact.result }}
          FULL: ${{ needs.impact.outputs.full }}
          EXPECT_BACKEND: ${{ needs.impact.outputs.backend }}
          EXPECT_FRONTEND: ${{ needs.impact.outputs.frontend }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DISTRIBUTION: ${{ needs.distribution.result }}
        run: node scripts/ci/check-architecture-gate.mjs
