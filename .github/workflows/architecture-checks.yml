name: Architecture Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Architecture and complete backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: architecture-ci
          MYSQL_DATABASE: architecture_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -parchitecture-ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ARCHITECTURE_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/architecture_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      ARCHITECTURE_MYSQL_USERNAME: root
      ARCHITECTURE_MYSQL_PASSWORD: architecture-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: node --test scripts/architecture/*.test.mjs scripts/release/*.test.mjs
      - run: node scripts/architecture/check-boundaries.mjs
      - run: node scripts/architecture/check-frontend-boundaries.mjs
      - run: node scripts/db/check-migration-history.mjs
      - run: bash ./mvnw -B -ntp -pl data-ops-boot -am verify
      - run: node scripts/contracts/workflow-schema.mjs
  frontend:
    name: Complete frontend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-ops-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: data-ops-ui/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn jest --runInBand
      - run: node scripts/check-type-baseline.mjs
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-frontend
          path: data-ops-ui/dist
  distribution:
    name: Distribution source and artifact consistency
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: architecture-frontend
          path: data-ops-ui/dist
      - run: node scripts/release/frontend-artifact.mjs
      - run: bash ./mvnw -B -ntp verify
      - run: tar -tzf data-ops-dist/target/yak-ops-*.tar.gz | grep '/web/build-manifest.json$'
  gate:
    name: Architecture gate
    if: always()
    needs: [backend, frontend, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Require every architecture check
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DISTRIBUTION: ${{ needs.distribution.result }}
        run: test "$BACKEND" = success && test "$FRONTEND" = success && test "$DISTRIBUTION" = success
