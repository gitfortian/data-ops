name: R12 DWD PostgreSQL Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'data-ops-business/data-ops-business-modeling/**'
      - 'data-ops-boot/src/test/java/io/yak/ops/boot/architecture/DwdMappingSqlSmoke.java'
      - 'data-ops-boot/src/test/java/io/yak/ops/boot/architecture/PostgresqlStorageSmokeTest.java'
      - '.github/workflows/r12-dwd-postgresql-checks.yml'

permissions:
  contents: read

concurrency:
  group: r12-dwd-postgresql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-v6-contract:
    name: PostgreSQL R12 V6 migration and transactional smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: data_ops
          POSTGRES_PASSWORD: architecture-ci
          POSTGRES_DB: architecture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U data_ops -d architecture_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SPRING_PROFILES_ACTIVE: postgresql
      ARCHITECTURE_POSTGRESQL_URL: jdbc:postgresql://127.0.0.1:5432/architecture_ci
      ARCHITECTURE_POSTGRESQL_USERNAME: data_ops
      ARCHITECTURE_POSTGRESQL_PASSWORD: architecture-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate PostgreSQL V6 migration and DWD mapping rollback
        run: >-
          bash ./mvnw -B -ntp
          -pl data-ops-boot -am
          -Dtest=PostgresqlStorageSmokeTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
