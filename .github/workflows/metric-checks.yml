name: Metric Checks

on:
  pull_request:
    paths:
      - 'yak-ops-business/yak-ops-business-metric/**'
      - 'yak-ops-boot/**'
      - 'yak-ops-ui/src/pages/metric/**'
      - 'yak-ops-ui/src/pages/semantic/**'
      - 'yak-ops-ui/src/services/metric/**'
      - 'yak-ops-ui/src/services/semantic/**'
      - 'scripts/db/phase5-metric-*.sql'
      - 'scripts/product/phase5-real-env-acceptance.mjs'
      - '.github/workflows/metric-checks.yml'

jobs:
  backend-metric:
    name: Backend Metric tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Metric module tests
        run: >-
          mvn -B
          -pl yak-ops-business/yak-ops-business-metric
          -am
          test
      - name: Run Phase 5 Boot observed-usage adapter tests
        run: >-
          mvn -B
          -pl yak-ops-boot
          -am
          -Dtest=ConsumptionMetricObservedUsageProviderTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  frontend-metric:
    name: Frontend Metric and Semantic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yak-ops-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Yarn classic
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Run Metric and Semantic tests
        run: >-
          yarn jest
          src/pages/metric
          src/pages/semantic
          --runInBand
      - name: Type-check frontend
        run: yarn tsc --noEmit
